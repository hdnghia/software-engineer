<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>NexPOS Console</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: fixed left rail of feature groups + scrolling work area; each feature is one hash-routed view. */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --surface-2:#ECF0EC; --fg:#16201B; --muted:#5D6A63; --line:#DCE3DE;
  --accent:#0E7C66; --accent-ink:#FFFFFF; --accent-soft:#DAEEE7;
  --warm:#B8730A; --warm-soft:#FBEFD8; --danger:#C2412D; --danger-soft:#F9E2DC;
  --info:#2D62C8; --info-soft:#E1E9FA; --ok:#2C7F3E; --ok-soft:#DFF1E2;
  --ch-grab:#00A85A; --ch-shopee:#EE5A2C; --ch-be:#E5B400; --ch-tiktok:#E0245E; --ch-lazada:#3D3BD8; --ch-zalo:#1A73E8; --ch-momo:#B0006D;
  --shadow:0 1px 2px rgba(20,40,30,.06),0 6px 24px rgba(20,40,30,.08);
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1412; --surface:#161D19; --surface-2:#1E2722; --fg:#E6ECE8; --muted:#93A199; --line:#2A342F;
  --accent:#3BB797; --accent-ink:#05231B; --accent-soft:#13392F;
  --warm:#F0A93A; --warm-soft:#3A2C12; --danger:#EE7461; --danger-soft:#3E1F19;
  --info:#7AA3F0; --info-soft:#1B2A45; --ok:#5CC274; --ok-soft:#173222;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1412; --surface:#161D19; --surface-2:#1E2722; --fg:#E6ECE8; --muted:#93A199; --line:#2A342F;
  --accent:#3BB797; --accent-ink:#05231B; --accent-soft:#13392F;
  --warm:#F0A93A; --warm-soft:#3A2C12; --danger:#EE7461; --danger-soft:#3E1F19;
  --info:#7AA3F0; --info-soft:#1B2A45; --ok:#5CC274; --ok-soft:#173222;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-size:.92em}
h1,h2,h3{text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:22px;font-weight:800}
h2{font-size:16px;font-weight:700}
h3{font-size:14px;font-weight:700}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:16px 12px 24px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.logo b{font-size:17px;font-weight:800;letter-spacing:-.02em}
.nav-group{margin-top:14px}
.nav-group .eyebrow{padding:0 10px 4px;display:block}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:700}
.nav a .k{margin-left:auto;font-size:11px;background:var(--warm-soft);color:var(--warm);border-radius:20px;padding:0 7px;font-weight:700}
.nav svg{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.top .grow{flex:1}
.menu-btn{display:none}
.view{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;max-width:1360px;width:100%}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head .grow{flex:1;min-width:200px}
.head p{margin:4px 0 0;color:var(--muted);max-width:70ch}
.svc{font-family:var(--f-mono);font-size:11px;color:var(--muted);background:var(--surface-2);border-radius:6px;padding:2px 7px;white-space:nowrap}

/* atoms */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--danger);border-color:var(--danger-soft)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{background:transparent;border-color:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.in,select.in,textarea.in{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.in:focus{border-color:var(--accent);outline:none}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted)}
label.f .in{color:var(--fg);font-weight:400;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.dng{background:var(--danger-soft);color:var(--danger)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.ch{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>.ph{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.ph h2{flex:1}
.panel>.pb{padding:14px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-side{grid-template-columns:minmax(0,1fr) 360px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--danger)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs .n{font-family:var(--f-mono);font-size:11px;margin-left:4px;opacity:.8}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 11px;border-radius:7px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.switch{position:relative;width:34px;height:20px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:20px;cursor:pointer;transition:.15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);transition:.15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(14px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.meter{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:8px}
.meter.warm i{background:var(--warm)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}
.mono-tile{width:44px;height:44px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:16px;align-items:start}
.cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:20px;padding:6px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.cats button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.item:hover{border-color:var(--accent)}
.item.out{opacity:.5;cursor:not-allowed}
.item .art{height:64px;border-radius:7px;display:grid;place-items:center;font-weight:800;font-size:20px;letter-spacing:-.02em}
.item b{font-weight:600;font-size:13.5px;line-height:1.3}
.cart{position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100vh - 96px)}
.cart .lines{overflow-y:auto;flex:1;min-height:80px}
.cl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.cl small{color:var(--muted);grid-column:1}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:7px}
.qty button{border:0;background:none;width:26px;height:26px;cursor:pointer;font-weight:700}
.qty span{min-width:20px;text-align:center;font-family:var(--f-mono)}
.sum{padding:12px 14px;display:flex;flex-direction:column;gap:5px;border-top:1px solid var(--line)}
.sum .row{justify-content:space-between}
.sum .tot{font-size:20px;font-weight:800}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pm button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 4px;font-weight:600;font-size:12px;cursor:pointer}
.pm button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column}
.modal.wide{width:min(820px,100%)}
.modal .mh{padding:16px 18px 10px;display:flex;align-items:flex-start;gap:10px}
.modal .mh h2{flex:1;font-size:18px}
.modal .mb{padding:4px 18px 16px;display:flex;flex-direction:column;gap:12px}
.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface)}
.drawer-scrim{justify-content:flex-end;padding:0}
.drawer{background:var(--surface);height:100%;width:min(520px,100%);overflow-y:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer .mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;position:sticky;top:0;background:var(--surface);z-index:2}
.drawer .sec{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.drawer .mf{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);margin-top:auto}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:0;align-items:flex-start}
.step{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;color:var(--muted);text-align:center;position:relative}
.step::before{content:"";position:absolute;top:9px;left:-50%;right:50%;height:2px;background:var(--line)}
.step:first-child::before{display:none}
.step i{width:20px;height:20px;border-radius:50%;background:var(--surface-2);border:2px solid var(--line);z-index:1}
.step.done i{background:var(--accent);border-color:var(--accent)}
.step.done::before{background:var(--accent)}
.step.cur{color:var(--fg);font-weight:700}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;gap:8px;width:min(360px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);border-radius:10px;padding:11px 14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;animation:in .2s ease}
.toast .grow{flex:1;min-width:0}
.toast .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 35%,transparent)}
@keyframes in{from{transform:translateY(8px);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.pop{position:absolute;right:0;top:calc(100% + 6px);width:340px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:40}
.bell{position:relative}
.bell .badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:0 5px;line-height:16px}

/* receipt / phone */
.receipt{font-family:var(--f-mono);font-size:12px;background:#FFFFFF;color:#111111;padding:16px 14px;border-radius:4px;width:100%;max-width:300px;margin:0 auto;box-shadow:0 0 0 1px var(--line);line-height:1.5}
.receipt.w58{max-width:230px}
.receipt hr{border:0;border-top:1px dashed #888;margin:7px 0}
.receipt .c{text-align:center}
.receipt .lr{display:flex;justify-content:space-between;gap:8px}
.receipt.big{font-size:14px}
.qr{width:128px;height:128px;margin:8px auto;display:block;image-rendering:pixelated}
.phone{width:290px;max-width:100%;border:10px solid var(--fg);border-radius:34px;overflow:hidden;background:var(--surface);margin:0 auto;height:580px;display:flex;flex-direction:column}
.phone .scr{overflow-y:auto;flex:1}
.banner{height:120px;background:linear-gradient(120deg,var(--accent),color-mix(in srgb,var(--accent) 50%,var(--warm)));color:var(--accent-ink);padding:14px;display:flex;flex-direction:column;justify-content:flex-end}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.chart .gl{stroke:var(--line)}
.bar{fill:var(--accent)}
.bar.alt{fill:var(--warm)}
.hb{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:8px;align-items:center;font-size:13px}
.hb .t{height:10px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.hb .t i{display:block;height:100%;border-radius:6px}
.perm td:not(:first-child),.perm th:not(:first-child){text-align:center}
.denom{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hours{display:grid;grid-template-columns:80px auto 1fr 1fr;gap:8px;align-items:center}
.auth{position:fixed;inset:0;z-index:80;background:var(--bg);display:grid;grid-template-columns:1fr 1fr;overflow:auto}
.auth .side{background:var(--accent);color:var(--accent-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.auth .side h1{font-size:34px;line-height:1.1;max-width:14ch}
.auth .form{display:flex;align-items:center;justify-content:center;padding:32px 16px}
.auth .card{width:min(380px,100%);display:flex;flex-direction:column;gap:12px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g-side{grid-template-columns:minmax(0,1fr)}.pos{grid-template-columns:minmax(0,1fr)}.cart{position:static;max-height:none}}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:60;transform:translateX(-105%);transition:transform .2s;box-shadow:var(--shadow);padding-top:calc(16px + env(safe-area-inset-top,0px))}
  .rail.open{transform:none}
  .menu-btn{display:inline-flex}
  .g2,.g3{grid-template-columns:minmax(0,1fr)}
  .auth{grid-template-columns:1fr}.auth .side{padding:28px 20px}
  .hide-sm{display:none}
}
@media (max-width:520px){.g4{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.hb{grid-template-columns:90px minmax(0,1fr) 80px}.hours{grid-template-columns:60px auto 1fr 1fr}}
</style>

</head>
<body>
<div class="app">
  <aside class="rail" id="rail" aria-label="Features"></aside>
  <div class="main">
    <header class="top">
      <button class="btn ghost menu-btn" data-act="rail" aria-label="Open menu">☰</button>
      <select class="in" id="hubSel" style="width:auto;max-width:260px" aria-label="Brand and hub">
        <option>Phở Mộc · Nguyễn Huệ, Q1</option><option>Phở Mộc · Võ Văn Tần, Q3</option><option>Sương Coffee · Thảo Điền</option>
      </select>
      <span class="chip ok hide-sm" id="liveChip"><span class="dot" style="background:var(--ok)"></span>POS connected</span>
      <div class="grow"></div>
      <button class="btn sm hide-sm" data-act="simOrder">Simulate incoming order</button>
      <div class="bell" style="position:relative">
        <button class="btn ghost" data-act="bell" aria-label="Notifications">🔔<span class="badge" id="bellN" hidden>0</span></button>
        <div class="pop" id="bellPop" hidden></div>
      </div>
      <button class="btn ghost" data-act="signout" title="Sign out"><span class="mono-tile" style="width:28px;height:28px;font-size:12px;background:var(--accent-soft);color:var(--accent)">LA</span><span class="hide-sm">Linh Anh</span></button>
    </header>
    <main class="view" id="view"></main>
  </div>
</div>
<div id="overlay"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
/* ---------- data ---------- */
const $ = s => document.querySelector(s);
const vnd = n => Math.round(n).toLocaleString('vi-VN') + '₫';
const kfmt = n => n >= 1e6 ? (n/1e6).toFixed(1).replace('.0','')+'tr' : Math.round(n/1e3)+'k';
let seed = 7; const rnd = () => { seed = (seed*16807) % 2147483647; return (seed-1)/2147483646 };
const pick = a => a[Math.floor(rnd()*a.length)];

const head = (t, p, svc, actions='') => `<div class="head"><div class="grow"><div class="row" style="gap:8px"><h1>${t}</h1>${svc?`<span class="svc">${svc}</span>`:''}</div>${p?`<p>${p}</p>`:''}</div><div class="row">${actions}</div></div>`;

function bars(data, {h=180, fmt=kfmt, alt=null}={}){
  const W = Math.max(320, data.length*46), pad = 34, max = Math.max(...data.map(d=>d.v))*1.1, bw = (W-pad-10)/data.length;
  const ticks = [0,.25,.5,.75,1].map(f=>max*f);
  return `<div class="tw"><svg class="chart" viewBox="0 0 ${W} ${h+24}" width="100%" style="min-width:${Math.min(W,520)}px;display:block" role="img">
  ${ticks.map(t=>{const y=h-(t/max)*(h-10);return `<line class="gl" x1="${pad}" x2="${W}" y1="${y}" y2="${y}"/><text x="${pad-6}" y="${y+3}" text-anchor="end">${fmt(t)}</text>`}).join('')}
  ${data.map((d,i)=>{const bh=(d.v/max)*(h-10), x=pad+6+i*bw;return `<rect class="bar ${alt&&alt(d,i)?'alt':''}" x="${x}" y="${h-bh}" width="${bw-12}" height="${bh}" rx="3"><title>${d.l}: ${vnd(d.v)}</title></rect><text x="${x+(bw-12)/2}" y="${h+15}" text-anchor="middle">${d.l}</text>`}).join('')}
  </svg></div>`;
}
const hbar = rows => { const m = Math.max(...rows.map(r=>r.v)); return `<div style="display:flex;flex-direction:column;gap:10px">${rows.map(r=>`<div class="hb"><span class="ell">${r.l}</span><span class="t"><i style="width:${r.v/m*100}%;background:${r.c||'var(--accent)'}"></i></span><span class="num" style="text-align:right">${r.f||vnd(r.v)}</span></div>`).join('')}</div>` };
function qrSvg(txt){ let h=0; for(const c of txt) h=(h*31+c.charCodeAt(0))>>>0; const n=25; let s=''; const r=()=>{h^=h<<13;h^=h>>>17;h^=h<<5;return (h>>>0)%100};
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){ if((x<8&&y<8)||(x>16&&y<8)||(x<8&&y>16)) continue; if(r()<48) s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`; }
  return `<svg class="qr" viewBox="-1 -1 27 27" style="background:#fff"><rect x="-1" y="-1" width="27" height="27" fill="#fff"/>${s}${fin(0,0)}${fin(18,0)}${fin(0,18)}</svg>`; }

/* POS */
function cartTotals(){
  const sub = S.cart.reduce((a,l)=>a+l.unit*l.q,0);
  let disc = 0, ship = S.otype==='delivery' ? 18000 : 0;
  if (S.promo==='GIAM20') disc = Math.min(40000, Math.round(sub*.2));
  if (S.promo==='FREESHIP') { disc = Math.min(15000, ship); }
  return {sub, disc, ship, total: Math.max(0, sub-disc+ship)};
}

    st: status || (S.otype==='take_away'?'FINISH':(S.pay==='LATER'?'WAITING_PAYMENT':'DOING')), pay:S.pay==='LATER'?'BANK_TRANSFER':S.pay, paid:!['LATER','COD'].includes(S.pay)&&!status, t:new Date(), driver:null, prov:S.otype==='delivery'?'Ahamove':null, inv:null};

function orderDrawer(id){
  const o = S.orders.find(x=>x.id==id); if(!o) return;
  const flow = ['PENDING','DOING','PICK','FINISH'], idx = flow.indexOf(o.st);
  const local = ['take_away','pick_up','delivery'].includes(o.ch);
  let acts = '';
  if (o.st==='DRAFT') acts = `<button class="btn dng" data-act="ost" data-id="${o.id}" data-s="DELETED">Delete draft</button><button class="btn pri" data-act="ost" data-id="${o.id}" data-s="PENDING">Submit order</button>`;
  else if (['PENDING','PRE_ORDER','WAITING_PAYMENT'].includes(o.st)) acts = `<button class="btn dng" data-act="cancelO" data-id="${o.id}">Cancel</button><button class="btn pri" data-act="ost" data-id="${o.id}" data-s="DOING">Confirm order</button>`;
  else if (o.st==='DOING') acts = `<button class="btn dng" data-act="cancelO" data-id="${o.id}">Cancel</button>${o.ship?`<button class="btn pri" data-act="quote" data-id="${o.id}">Book driver</button>`:`<button class="btn pri" data-act="ost" data-id="${o.id}" data-s="FINISH">Mark picked up</button>`}`;
  else if (o.st==='PICK') acts = `<button class="btn" data-act="ost" data-id="${o.id}" data-s="RETURNING">Start return</button><button class="btn pri" data-act="ost" data-id="${o.id}" data-s="FINISH">Mark delivered</button>`;
  else if (o.st==='FINISH' && !o.inv) acts = `<button class="btn pri" data-act="issueInv" data-id="${o.id}">Issue e-invoice</button>`;
  acts = `<button class="btn" data-act="reprint" data-id="${o.id}">Print</button>` + acts;
  drawer(`<div style="flex:1"><div class="row"><h2 class="mono">${o.code}</h2>${chip(o.st)}</div><div class="muted" style="margin-top:3px">${chan(o.ch)} · ${o.t.toLocaleString('vi-VN')}</div></div>`,
  `${o.st!=='CANCEL'&&o.st!=='DRAFT'?`<div class="sec"><div class="steps">${['New','Preparing','Delivering','Completed'].map((l,i)=>`<div class="step ${i<=idx?'done':''} ${i===idx?'cur':''}"><i></i>${l}</div>`).join('')}</div></div>`:''}
   <div class="sec"><span class="eyebrow">Customer</span><b>${o.cust}</b><span class="muted mono">${o.phone||''}</span><span>${o.addr}</span></div>
   <div class="sec"><span class="eyebrow">Items</span>${o.items.map(i=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span><b class="num">${i.q}×</b> ${i.n}</span><span class="num">${vnd(i.p*i.q)}</span></div>`).join('')}
     <dl class="kv" style="margin-top:6px;border-top:1px dashed var(--line);padding-top:8px"><dt>(1) Revenue before promotion</dt><dd>${vnd(o.sub)}</dd><dt>(5) Total promotion</dt><dd>−${vnd(o.disc)}</dd><dt>(8) Shipping fee</dt><dd>${vnd(o.ship)}</dd><dt><b>(9) Customer paid</b></dt><dd><b>${vnd(o.total)}</b></dd></dl></div>
   <div class="sec"><div class="row"><span class="eyebrow" style="flex:1">Payment</span><span class="chip ${o.paid?'ok':'warm'}">${o.paid?'Paid':'Unpaid'}</span></div>
     <div class="row" style="justify-content:space-between"><span>${o.pay}</span><span class="num muted">TXN-${o.id}8821</span></div>
     ${!o.paid&&o.st!=='CANCEL'?`<div class="row"><button class="btn sm" data-act="sendLink">Send payment link</button><button class="btn sm" data-act="collect" data-id="${o.id}">Record manual collection</button><button class="btn sm ghost" data-act="checkPay">Check status</button></div>`:''}</div>
   ${o.ship?`<div class="sec"><span class="eyebrow">Delivery</span><dl class="kv"><dt>Provider</dt><dd>${o.prov||'—'}</dd><dt>Driver</dt><dd>${o.driver||'Not assigned'}</dd><dt>Fee</dt><dd>${vnd(o.ship)}</dd></dl>${o.driver&&o.st==='PICK'?`<div class="row"><button class="btn sm" data-act="track">Track driver</button>${local?`<button class="btn sm dng" data-act="cancelShip" data-id="${o.id}">Cancel booking</button>`:''}</div>`:''}</div>`:''}

}

  savePromo:()=>{ const t=document.querySelector('[name=pt]:checked').value; S.promos.unshift({n:$('#pName').value,type:t,v:$('#pVal').value,code:$('#pCode').value.toUpperCase(),used:0,lim:0,on:true,to:$('#pEnd').value.split('-').reverse().join('/')}); closeOv(); toast('Promotion created'); render(); },

  connect3:(d)=>{ const c=S.chans[d.i]; Object.assign(c,{on:true,stores:2,sync:'vừa xong',tok:'Hết hạn sau 30 ngày'}); closeOv(); toast(`${c.n} connected. Importing orders from the last 24 hours.`); render(); },
  chSync:(d)=>toast(d.w==='orders'?`${d.n}: 3 new orders pulled, 0 errors`:`${d.n}: menu pushed (16 items)`),
  chFin:(d)=>modal(`${d.n} finance`, `<div class="tw panel"><table><thead><tr><th>Period</th><th class="r">Gross</th><th class="r">Commission</th><th class="r">Payout</th></tr></thead><tbody>${[['27/10–02/11',48200000],['20/10–26/10',45100000],['13/10–19/10',41800000]].map(r=>`<tr><td class="num">${r[0]}</td><td class="r num">${vnd(r[1])}</td><td class="r num down">−${vnd(r[1]*.25)}</td><td class="r num"><b>${vnd(r[1]*.75)}</b></td></tr>`).join('')}</tbody></table></div>`,'','wide'),
  chFb:(d)=>{ S.repTab='feedback'; location.hash='reports'; },
  repTab:(d)=>{S.repTab=d.k;render()},
  export:()=>{ const n=new Date(), p=x=>String(x).padStart(2,'0'); toast(`Exported <span class="mono">${S.repFile}_${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}_${p(n.getHours())}${p(n.getMinutes())}${p(n.getSeconds())}.xlsx</span>`); },
  tiTab:(d)=>{S.tiTab=d.k;render()},
  addSite:()=>modal('Add store', `<label class="f">Store name<input class="in" value="Phở Mộc · Phan Xích Long"></label><label class="f">Address<input class="in" id="siteAddr" value="17 Phan Xích Long" data-inp="siteAddr"></label><div id="siteSug"></div><label class="f">Province<select class="in"><option>TP. Hồ Chí Minh</option><option>Hà Nội</option><option>Đà Nẵng</option></select></label><p class="muted" style="margin:0">You're using 3 of 4 stores on STANDARD.</p>`, `<button class="btn" data-act="x">Cancel</button><button class="btn pri" data-act="toast" data-m="Store created. Add its channel sites next." data-close="1">Create store</button>`),
  billTab:(d)=>{S.billTab=d.k;render()},
  testPrint:()=>toast('Test page sent'),
  discover:()=>{ toast('Searching the local network…'); setTimeout(()=>{ if(!S.printers.find(p=>p.ip==='192.168.1.57')) S.printers.push({n:'Epson TM-T82III',ip:'192.168.1.57',t:'bill_for_complete',w:80,on:true}); toast('Found 1 new printer: Epson TM-T82III'); if(route()==='bills') render(); }, 1600); },
  teamTab:(d)=>{S.teamTab=d.k;render()},
  invite:()=>modal('Invite staff', `<label class="f">Full name<input class="in" id="ivN" value="Ngô Bảo Châu"></label><label class="f">Email<input class="in" id="ivE" type="email" value="chau.nb@phomoc.vn"></label><div class="grid g2" style="gap:10px"><label class="f">Role<select class="in" id="ivR">${ROLES.slice(1).map(r=>`<option>${r}</option>`).join('')}</select></label><label class="f">Store<select class="in" id="ivH"><option>Nguyễn Huệ, Q1</option><option>Võ Văn Tần, Q3</option><option>Thảo Điền</option></select></label></div>`, `<button class="btn" data-act="x">Cancel</button><button class="btn pri" data-act="doInvite">Send invite</button>`),
  doInvite:()=>{ S.users.push({n:$('#ivN').value,e:$('#ivE').value,r:$('#ivR').value,h:$('#ivH').value,on:false,last:'Chờ kích hoạt'}); closeOv(); toast('Invite sent. They activate with the emailed code.'); render(); },
  yearly:(d)=>{S.yearly=d.v==='1';render()},
  choosePlan:(d)=>planModal(d.p),
  voucher:()=>{ const ok=$('#voucher').value.trim().toUpperCase()==='NEXPOS50'; $('#vMsg').innerHTML = ok?'<span class="up">Voucher applied: −50% first period</span>':'<span class="down">This voucher is not valid or has been used.</span>'; },
  addCap:()=>modal('Add store capacity', `<p style="margin:0">Each extra store costs <b>30.000₫ / month</b>, prorated to your renewal on 14/03/2027.</p><label class="f">Extra stores<input class="in num" type="number" min="1" value="1" id="capN"></label>`, `<button class="btn" data-act="x">Cancel</button><button class="btn pri" data-act="toast" data-m="Capacity added: 5 stores" data-close="1">Pay 129.000₫</button>`),
  runJob:(d)=>{ toast(`${d.n}: started`); setTimeout(()=>toast(`${d.n}: finished`),1400); },
  migrate:()=>{ migDone=true; $('#migs').innerHTML=migList(); toast('2 migrations applied'); },
  closeShift:closeShiftModal,
  doClose:()=>{ S.shift.open=false; closeOv(); toast('Shift closed. Z-report printed.'); render(); },
  openShift:()=>modal('Open shift', `<label class="f">Opening cash float<input class="in num" id="flt" value="1500000"></label>`, `<button class="btn" data-act="x">Cancel</button><button class="btn pri" data-act="doOpen">Open shift</button>`),
  doOpen:()=>{ S.shift={open:true,by:'Huỳnh Linh Anh',at:new Date().toTimeString().slice(0,5),cash0:+$('#flt').value||0,moves:[]}; closeOv(); render(); },
  mvK:(d)=>{ S.mvK=d.k; $('#mvOut').classList.toggle('on',d.k==='out'); $('#mvIn').classList.toggle('on',d.k==='in'); },
  addMove:()=>{ const a=+$('#mvA').value.replace(/\D/g,''); if(!a){ toast('Enter an amount'); return; } S.shift.moves.unshift({t:new Date().toTimeString().slice(0,5),k:S.mvK||'out',n:$('#mvN').value||'Khác',a}); render(); },
  sug:(d)=>{ S.cust.addr=d.v; render(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { if(!e.target.closest('.bell')) $('#bellPop').hidden = true; return; }
  if (el.dataset.act==='close' && e.target!==el) return;
  A[el.dataset.act]?.(el.dataset, el, e);
});
const SUG = ['27 Nguyễn Huệ, Bến Nghé, Quận 1','12 Lê Lợi, Bến Nghé, Quận 1','88 Pasteur, Phường 6, Quận 3','41 Thảo Điền, TP Thủ Đức','17 Phan Xích Long, Phú Nhuận'];
const A_inp = {
  posQ:(e)=>{ S.q=e.value; const pos=e.selectionStart; render(); const n=$('#posQ'); n.focus(); n.setSelectionRange(pos,pos); },
  oQ:(e)=>{ S.oQ=e.value; const pos=e.selectionStart; render(); const n=$('#oQ'); n.focus(); n.setSelectionRange(pos,pos); },
  cName:(e)=>S.cust.name=e.value, cPhone:(e)=>S.cust.phone=e.value,
  cAddr:(e)=>{ S.cust.addr=e.value; const q=e.value.toLowerCase(); $('#addrSug').innerHTML = q.length>1 ? `<div class="panel list" style="margin-top:4px">${SUG.filter(s=>s.toLowerCase().includes(q)||q.length<4).slice(0,4).map(s=>`<button class="li btn ghost" style="border-radius:0;justify-content:flex-start;width:100%" data-act="sug" data-v="${s}">${s}</button>`).join('')}</div>`:''; },
  siteAddr:(e)=>{ $('#siteSug').innerHTML = `<div class="muted" style="font-size:12px">Suggestion: 17 Phan Xích Long, Phường 2, Phú Nhuận · 10.8007, 106.6880</div>`; },
  cash:()=>{ const v=+($('#cashIn').value.replace(/\D/g,'')), t=cartTotals().total; $('#change').innerHTML = v>=t?`<b>${vnd(v-t)}</b>`:`<span class="down">Short by ${vnd(t-v)}</span>`; },
  den:countDen,
  wBanner:(e)=>{ S.web.banner=e.value; $('#phoneScr').innerHTML=phoneScreen(); }, wMin:(e)=>{ S.web.min=+e.value||0; $('#phoneScr').innerHTML=phoneScreen(); },
  bFoot:(e)=>{ S.bill.footer=e.value; $('#billPrev').innerHTML=receipt(S.orders.find(o=>o.items.length>1)||S.orders[0],S.billTab); }
};
document.addEventListener('input', e => { const k=e.target.dataset.inp; if(k&&A_inp[k]) A_inp[k](e.target); });
const A_chg = {
  oCh:(e)=>{S.oCh=e.value;render()}, wh:(e)=>{S.wh=e.value;render()},
  soldout:(e)=>{ const m=MENU.find(x=>x.id==e.dataset.id); m.out=!e.checked; toast(`${m.n} ${m.out?'marked sold out on all channels':'back in stock'}`); },
  promoOn:(e)=>{ S.promos[e.dataset.i].on=e.checked; toast(e.checked?'Promotion on':'Promotion paused'); },
  web:(e)=>{ S.web[e.dataset.k]=e.checked; $('#phoneScr').innerHTML=phoneScreen(); },
  bill:(e)=>{ S.bill[e.dataset.k]=e.checked; render(); }, billW:(e)=>{ S.bill.w=+e.value; render(); },
  file:(e)=>{ const f=e.files[0]; if(f) $('#fileR').innerHTML=`Read <b>${esc(f.name)}</b>. 16 rows look valid. <button class="btn sm pri" data-act="toast" data-m="Imported 16 items" data-close="1">Import</button>`; }
};
document.addEventListener('change', e => { const k=e.target.dataset.chg; if(k&&A_chg[k]) A_chg[k](e.target); });
document.addEventListener('keydown', e => { if(e.key==='Escape') closeOv(); });

render();
</script>

</body>
