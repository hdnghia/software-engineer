<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS DigiBird UI Demo</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#1c2333;--mut:#6b7488;--line:#e4e8f0;--pri:#4f46e5;--pri2:#eef0ff;--ok:#12a150;--warn:#d98a00;--bad:#d6334a;--side:#151a2c;--sideink:#c5cbe0}
@media(prefers-color-scheme:dark){:root{--bg:#0f1220;--card:#181d30;--ink:#e8ebf5;--mut:#98a1ba;--line:#262c45;--pri:#7b74ff;--pri2:#23264a;--side:#0b0e1a}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:flex;min-height:100vh}
aside{width:236px;background:var(--side);color:var(--sideink);padding:12px 8px;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
aside h1{font-size:16px;margin:4px 10px 10px;color:#fff;display:flex;gap:8px;align-items:center}
aside .grp{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;margin:14px 10px 4px;opacity:.55}
aside a{display:flex;gap:8px;padding:7px 10px;border-radius:7px;color:inherit;text-decoration:none;cursor:pointer}
aside a:hover{background:#ffffff14}aside a.on{background:var(--pri);color:#fff}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header.top{display:flex;gap:10px;align-items:center;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border-radius:8px;padding:3px}.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--mut)}.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px #0002}
.sp{flex:1}
#view{padding:20px;max-width:1300px;width:100%}
h2{margin:0 0 4px;font-size:21px}.sub{color:var(--mut);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.stat b{font-size:24px;display:block}.stat span{color:var(--mut);font-size:12.5px}.stat i{font-style:normal;font-size:12px;color:var(--ok)}
.btn{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:7px 14px;cursor:pointer}.btn.sec{background:var(--pri2);color:var(--pri)}.btn.bad{background:none;color:var(--bad);padding:4px 8px}.btn.sm{padding:3px 9px;font-size:12.5px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
.bar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}.bar input{max-width:280px}
table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:var(--mut);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}td{padding:9px 10px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}tr:hover td{background:var(--bg)}
.tw{overflow:auto}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--pri2);color:var(--pri)}.b-ok{background:#12a15022;color:var(--ok)}.b-warn{background:#d98a0022;color:var(--warn)}.b-bad{background:#d6334a22;color:var(--bad)}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}.modal>div{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
.fld{margin-bottom:10px}.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px}
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;z-index:30}
.pos{display:grid;grid-template-columns:1fr 360px;gap:14px}.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.prod{border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--card);text-align:left}.prod:hover{border-color:var(--pri)}
.img{height:70px;border-radius:8px;display:grid;place-items:center;font-size:30px;margin-bottom:6px;background:var(--pri2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.tot{font-size:18px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;cursor:pointer}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.cal{display:grid;grid-template-columns:60px repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}.cal>div{background:var(--card);padding:6px;min-height:44px;font-size:12px}.cal .h{font-weight:600;background:var(--bg)}.slot{background:var(--pri2)!important;color:var(--pri);border-radius:4px;cursor:pointer}
.hero{background:linear-gradient(120deg,var(--pri),#a855f7);color:#fff;border-radius:14px;padding:30px;margin-bottom:16px}
.steps{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}.steps span{padding:4px 12px;border-radius:99px;background:var(--bg);color:var(--mut)}.steps .on{background:var(--pri);color:#fff}
.wheel{width:230px;height:230px;border-radius:50%;margin:10px auto;border:6px solid var(--ink);transition:transform 3s cubic-bezier(.1,.7,.2,1);background:conic-gradient(#f59e0b 0 60deg,#4f46e5 60deg 120deg,#12a150 120deg 180deg,#d6334a 180deg 240deg,#06b6d4 240deg 300deg,#a855f7 300deg 360deg)}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px}.bars div{flex:1;background:var(--pri);border-radius:5px 5px 0 0;position:relative;min-height:4px}.bars div span{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut)}
.tog{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;display:inline-block;border:0}.tog::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.tog.on{background:var(--ok)}.tog.on::after{left:19px}
@media(max-width:820px){aside{position:fixed;left:-250px;z-index:15;transition:.2s}aside.open{left:0}.pos{grid-template-columns:1fr}#view{padding:14px}}
.mb{display:none}@media(max-width:820px){.mb{display:inline-block}}
</style></head><body>
<div id="app"><aside id="side"></aside><main><header class="top"><button class="btn sec mb" onclick="side.classList.toggle('open')">☰</button>
<div class="seg" id="portals"></div><span class="sp"></span><span id="crumb" class="sub" style="margin:0"></span><span class="badge">Demo data · nothing is saved</span></header><div id="view"></div></main></div>
<script>
const $=s=>document.querySelector(s),vnd=n=>Number(n).toLocaleString('en-US')+' ₫';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)};
const OKW=['Paid','Active','Delivered','Completed','Confirmed','Approved','Received','Connected','Sent','Success','Live','In stock','Running','Done','Yes'],WARNW=['Pending','Partial','Draft','Scheduled','Low','Processing','Shipping','Trial','Ordered','Upcoming'],BADW=['Unpaid','Cancelled','Rejected','Expired','Failed','Out of stock','Overdue','Disabled','Returned','No'];
const bd=v=>{const c=OKW.includes(v)?'b-ok':WARNW.includes(v)?'b-warn':BADW.includes(v)?'b-bad':'';return `<span class="badge ${c}">${esc(v)}</span>`};
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div>${html}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m);return m}
const PEOPLE=['Nguyen Van An','Tran Thi Binh','Le Hoang Cuong','Pham Minh Duc','Vo Thu Ha','Dang Quoc Huy','Bui Lan Anh','Hoang Gia Bao'];
const PR=[['🥤','Iced Milk Tea',35000,'Drinks'],['☕','Cold Brew Coffee',42000,'Drinks'],['🍰','Tiramisu Slice',55000,'Bakery'],['🥐','Butter Croissant',32000,'Bakery'],['🧴','Hand Cream 50ml',129000,'Care'],['🧼','Herbal Soap',45000,'Care'],['🎧','Wireless Earbuds',690000,'Gadgets'],['🔋','Power Bank 10k',349000,'Gadgets'],['🍵','Matcha Powder',185000,'Drinks'],['🕯️','Scented Candle',99000,'Home']];
// ---------- page registry ----------
const NAV={admin:[],store:[],super:[]},PAGES={};
function reg(p,grp,id,label,ic,fn){let g=NAV[p].find(x=>x[0]==grp);if(!g)NAV[p].push(g=[grp,[]]);g[1].push([id,label,ic]);PAGES[p+':'+id]={label,fn}}
function head(t,s,btn){return `<div class="bar"><div style="flex:1"><h2>${t}</h2><p class="sub" style="margin:0">${s||''}</p></div>${btn||''}</div>`}
function table(cols,rows,act){return `<div class="tw"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}${act?'<th></th>':''}</tr></thead><tbody>${rows.map((r,i)=>`<tr>${r.map((v,j)=>`<td>${/^(Status|State|Payment)$/.test(cols[j])?bd(v):esc(v)}</td>`).join('')}${act?`<td style="text-align:right;white-space:nowrap">${act(i)}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function stats(a){return `<div class="grid g4" style="margin-bottom:14px">${a.map(s=>`<div class="card stat"><span>${s[0]}</span><b>${s[1]}</b><i>${s[2]||''}</i></div>`).join('')}</div>`}
// generic CRUD list page
function list(p,grp,id,label,ic,cols,rows,fields,o={}){reg(p,grp,id,label,ic,el=>{
 let q='',data=rows.map(r=>[...r]);
 const draw=()=>{const f=data.map((r,i)=>[r,i]).filter(([r])=>r.join(' ').toLowerCase().includes(q));
  el.innerHTML=head(label,o.sub||'',(o.extra||'')+(fields?`<button class="btn" id="add">+ New</button>`:''))+(o.stats?stats(o.stats):'')+`<div class="card"><div class="bar"><input id="q" placeholder="Search…" value="${esc(q)}"><span class="sub" style="margin:0">${f.length} records</span></div>`+
  table(cols,f.map(x=>x[0]),k=>{const i=f[k][1];return `<button class="btn sec sm" data-v="${i}">View</button> <button class="btn bad sm" data-d="${i}">Delete</button>`})+`</div>`;
  $('#q').oninput=e=>{q=e.target.value.toLowerCase();draw();const x=$('#q');x.focus();x.setSelectionRange(99,99)};
  el.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const r=data[b.dataset.v];modal(`<h3>${esc(r[0])}</h3>`+r.map((v,j)=>`<div class="row"><span class="sub" style="margin:0">${cols[j]}</span><span>${esc(v)}</span></div>`).join('')+`<p style="text-align:right"><button class="btn" onclick="this.closest('.modal').remove()">Close</button></p>`)});
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{data.splice(b.dataset.d,1);draw();toast('Deleted (demo)')});
  if(fields)$('#add').onclick=()=>{const m=modal(`<h3>New ${label}</h3>`+fields.map((f,i)=>`<div class="fld"><label>${f[0]}</label>${f[1]?`<select>${f[1].map(x=>`<option>${x}</option>`).join('')}</select>`:`<input placeholder="${f[0]}">`}</div>`).join('')+`<p style="text-align:right"><button class="btn sec" onclick="this.closest('.modal').remove()">Cancel</button> <button class="btn" id="sv">Save</button></p>`);
   m.querySelector('#sv').onclick=()=>{const v=[...m.querySelectorAll('input,select')].map(x=>x.value||'—');const r=cols.map((c,j)=>v[j]!==undefined?v[j]:(/Status/.test(c)?'Active':'—'));data.unshift(r);m.remove();draw();toast('Saved (demo)')}}};
 draw()})}
const D=(n,i=0)=>`2026-${String(11-((n+i)%4)).padStart(2,'0')}-${String(1+((n*7+i*3)%27)).padStart(2,'0')}`;
const gen=(n,f)=>Array.from({length:n},(_,i)=>f(i));
const pick=(a,i)=>a[i%a.length];
// =============== ADMIN ===============
reg('admin','Overview','dash','Dashboard','📊',el=>{
 const m=[42,58,51,73,66,88,95];
 el.innerHTML=head('Dashboard','Today across Main Store · Warehouse HCM-01')+stats([['Sales today',vnd(48250000),'▲ 12% vs yesterday'],['Orders','184','▲ 9%'],['Purchases',vnd(21400000),''],['Low-stock items','7','Needs reorder'],['Pending bookings','12','3 today'],['New customers','23','▲ 4%']])+
 `<div class="grid g2"><div class="card"><b>Sales — last 7 days (M ₫)</b><div class="bars" style="margin:14px 0 24px">${m.map((v,i)=>`<div style="height:${v}%"><span>${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][i]}</span></div>`).join('')}</div></div>
 <div class="card"><b>Top products</b>${PR.slice(0,5).map((p,i)=>`<div class="row"><span>${p[0]} ${p[1]}</span><span class="sub" style="margin:0">${120-i*17} sold</span></div>`).join('')}</div>
 <div class="card"><b>Recent orders</b>${table(['#','Customer','Total','Status'],gen(5,i=>['SO-'+(1050+i),PEOPLE[i],vnd(150000+i*83000),pick(['Paid','Pending','Shipping','Delivered','Paid'],i)]))}</div>
 <div class="card"><b>Alerts</b><div class="row">⚠️ Matcha Powder below minimum (4 left)<button class="btn sec sm">Reorder</button></div><div class="row">💬 2 withdrawal requests awaiting approval<button class="btn sec sm">Review</button></div><div class="row">📅 3 appointments start in the next hour<button class="btn sec sm">Open</button></div><div class="row">💳 Messaging wallet low: 48,000 ₫<button class="btn sec sm">Top up</button></div></div></div>`});
reg('admin','Overview','pos','POS — Products','🛒',el=>{
 let cart={},cat='All',pay='Cash',disc=0,cust='Walk-in customer';
 const draw=()=>{const items=Object.entries(cart),sub=items.reduce((s,[i,q])=>s+PR[i][2]*q,0),tax=Math.round((sub-disc)*.08),tot=sub-disc+tax;
 el.innerHTML=head('Point of Sale','Warehouse HCM-01 · Cashier: Admin')+`<div class="pos"><div><div class="bar"><input placeholder="Scan barcode or search product…"></div><div class="chips">${['All','Drinks','Bakery','Care','Gadgets','Home'].map(c=>`<span class="chip ${c==cat?'on':''}" data-c="${c}">${c}</span>`).join('')}</div><div class="prods">${PR.map((p,i)=>(cat=='All'||p[3]==cat)?`<button class="prod" data-p="${i}"><div class="img">${p[0]}</div><b>${p[1]}</b><div class="sub" style="margin:0">${vnd(p[2])}</div></button>`:'').join('')}</div></div>
 <div class="card"><select id="cu"><option>Walk-in customer</option>${PEOPLE.map(p=>`<option ${p==cust?'selected':''}>${p}</option>`).join('')}</select><div style="margin:10px 0;min-height:120px">${items.length?items.map(([i,q])=>`<div class="row"><span>${PR[i][0]} ${PR[i][1]}<br><small class="sub">${vnd(PR[i][2])}</small></span><span><button class="btn sec sm" data-m="${i}">−</button> ${q} <button class="btn sec sm" data-a="${i}">+</button></span></div>`).join(''):'<p class="sub">Cart is empty — tap a product.</p>'}</div>
 <div class="row"><span>Subtotal</span><span>${vnd(sub)}</span></div><div class="row"><span>Discount / voucher</span><span><button class="btn sec sm" id="vc">SAVE10 −10%</button> ${vnd(disc)}</span></div><div class="row"><span>VAT 8%</span><span>${vnd(tax)}</span></div><div class="row tot"><span>Total</span><span>${vnd(tot)}</span></div>
 <div class="chips">${['Cash','Card','Bank transfer','MoMo','VNPay'].map(c=>`<span class="chip ${c==pay?'on':''}" data-pm="${c}">${c}</span>`).join('')}</div><button class="btn" style="width:100%;padding:11px" id="pay" ${items.length?'':'disabled'}>Charge ${vnd(tot)}</button></div></div>`;
 el.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;draw()});el.querySelectorAll('[data-p],[data-a]').forEach(b=>b.onclick=()=>{const i=b.dataset.p??b.dataset.a;cart[i]=(cart[i]||0)+1;draw()});
 el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{const i=b.dataset.m;if(--cart[i]<=0)delete cart[i];draw()});el.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{pay=b.dataset.pm;draw()});
 $('#cu').onchange=e=>cust=e.target.value;$('#vc').onclick=()=>{disc=Math.round(sub*.1);draw()};
 $('#pay').onclick=()=>modal(`<h3>✅ Payment received</h3><p>Receipt <b>INV-${2000+Math.floor(Math.random()*900)}</b> · ${pay}</p><div class="row tot"><span>Paid</span><span>${vnd(tot)}</span></div><p class="sub">Stock deducted · points added for ${esc(cust)} · affiliate commission recorded</p><p style="text-align:right"><button class="btn sec">Print</button> <button class="btn" onclick="this.closest('.modal').remove()">New sale</button></p>`).querySelector('.btn:last-child').addEventListener('click',()=>{cart={};disc=0;draw()})};draw()});
// Catalog
list('admin','Catalog','products','Products','📦',['Name','SKU','Category','Brand','Price','Stock','Status'],PR.map((p,i)=>[p[1],'SKU-'+(100+i),p[3],pick(['DigiBrand','Aurora','Kito'],i),vnd(p[2]),String([48,20,12,66,4,31,9,15,4,27][i]),[4,8,3].includes(i)?'Low':'In stock']),[['Name'],['SKU'],['Category',['Drinks','Bakery','Care','Gadgets','Home']],['Brand',['DigiBrand','Aurora','Kito']],['Price'],['Stock']],{sub:'Variants, units, taxes, barcodes and warehouse-specific prices',extra:'<button class="btn sec">Import</button> <button class="btn sec">Export</button> <button class="btn sec">Print barcodes</button> '});
list('admin','Catalog','categories','Categories','🗂️',['Name','Parent','Products','Status'],[['Drinks','—','3','Active'],['Bakery','—','2','Active'],['Care','—','2','Active'],['Gadgets','—','2','Active'],['Home','—','1','Active'],['Tea','Drinks','1','Active']],[['Name'],['Parent']]);
list('admin','Catalog','brands','Brands','🏷️',['Name','Products','Status'],[['DigiBrand','5','Active'],['Aurora','3','Active'],['Kito','2','Active']],[['Name']]);
list('admin','Catalog','units','Units & taxes','⚖️',['Name','Short','Type','Rate'],[['Piece','pc','Unit','—'],['Box (12)','box','Unit','—'],['VAT 8%','VAT8','Tax','8%'],['VAT 10%','VAT10','Tax','10%']],[['Name'],['Short'],['Type',['Unit','Tax']],['Rate']]);
list('admin','Catalog','holiday','Holiday prices','🎄',['Name','Period','Adjustment','Status'],[['Lunar New Year','Jan 25 – Feb 3','+10%','Scheduled'],['Black Friday','Nov 27–30','−20%','Scheduled'],['Summer Sale','Jun 1–30','−15%','Expired']],[['Name'],['Period'],['Adjustment']]);
// Sales
const so=(pre,n)=>gen(n,i=>[pre+(1000+i),D(i),pick(PEOPLE,i),pick(['Main Store','HCM-01'],i),vnd(120000+i*91000),pick(['Paid','Partial','Unpaid','Paid'],i)]);
list('admin','Sales','sales','Sales','🧾',['Invoice','Date','Customer','Warehouse','Total','Payment'],so('INV-',12),[['Customer',PEOPLE],['Warehouse',['Main Store','HCM-01']],['Total']],{sub:'Manual sales, online orders, receipts and shipments',stats:[['Total sales',vnd(48250000)],['Paid',vnd(39100000)],['Due',vnd(9150000)],['Online orders','64']]});
list('admin','Sales','quotes','Quotations','📝',['Quote','Date','Customer','Valid until','Total','Status'],gen(6,i=>['QT-'+(300+i),D(i),pick(PEOPLE,i),D(i+2),vnd(900000+i*210000),pick(['Draft','Sent','Approved','Expired'],i)]),[['Customer',PEOPLE],['Valid until'],['Total']],{sub:'Convert approved quotations into sales'});
list('admin','Sales','sreturns','Sales returns','↩️',['Return','Date','Invoice','Customer','Refund','Status'],gen(5,i=>['SR-'+(70+i),D(i),'INV-'+(1000+i),pick(PEOPLE,i),vnd(99000+i*45000),pick(['Completed','Pending'],i)]),[['Invoice'],['Refund']]);
list('admin','Sales','orders','Online orders','🚚',['Order','Date','Customer','Shipping','Total','Status'],gen(8,i=>['ON-'+(5000+i),D(i),pick(PEOPLE,i),pick(['GHN','GHTK','Viettel Post'],i),vnd(240000+i*77000),pick(['Pending','Processing','Shipping','Delivered','Cancelled'],i)]),null,{sub:'Fulfil, ship, track and cancel storefront orders',extra:'<button class="btn sec">Sync shipping status</button> '});
// Purchases
list('admin','Purchases','purchases','Purchases','📥',['Ref','Date','Supplier','Warehouse','Total','Status'],gen(8,i=>['PO-'+(200+i),D(i),pick(['Aurora Supply','Kito Trading','Fresh Farm'],i),'Main Store',vnd(2500000+i*430000),pick(['Received','Ordered','Pending'],i)]),[['Supplier',['Aurora Supply','Kito Trading','Fresh Farm']],['Warehouse',['Main Store','HCM-01']],['Total']]);
list('admin','Purchases','preturns','Purchase returns','📤',['Ref','Date','Supplier','Total','Status'],gen(4,i=>['PR-'+(20+i),D(i),pick(['Aurora Supply','Kito Trading'],i),vnd(400000+i*120000),pick(['Completed','Pending'],i)]),[['Supplier'],['Total']]);
list('admin','Purchases','suppliers','Suppliers','🏭',['Name','Phone','Email','Balance','Status'],[['Aurora Supply','0901 234 567','sales@aurora.vn',vnd(3200000),'Active'],['Kito Trading','0902 345 678','hi@kito.vn',vnd(0),'Active'],['Fresh Farm','0903 456 789','ops@freshfarm.vn',vnd(870000),'Active']],[['Name'],['Phone'],['Email']]);
// Inventory
list('admin','Inventory','transfers','Stock transfers','🔁',['Ref','Date','From','To','Items','Status'],gen(5,i=>['TR-'+(40+i),D(i),'Main Store','HCM-01',String(3+i),pick(['Completed','Pending'],i)]),[['From',['Main Store','HCM-01']],['To',['HCM-01','Main Store']]]);
list('admin','Inventory','adjust','Stock adjustments','🛠️',['Ref','Date','Warehouse','Reason','Qty change'],gen(5,i=>['ADJ-'+(10+i),D(i),'Main Store',pick(['Damaged','Count correction','Expired'],i),String(-(1+i))]),[['Warehouse'],['Reason'],['Qty change']]);
