    $('#lg',w).innerHTML=logHTML(S.log);$('#iso',w).value=S.iso}
  init('rc');draw();
  w.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){ACT[b.dataset.a](b.dataset.s);draw();return}
    const c=e.target.closest('[data-sc]');if(!c)return;timers.forEach(clearTimeout);timers=[];const k=c.dataset.sc;
    if(k==='reset'){init();draw();return}const sc=SC[k];init(sc.iso);draw();
    sc.st.forEach((s,i)=>timers.push(setTimeout(()=>{ACT[s[1]](s[0]);draw()},700*(i+1))))});
  $('#iso',w).onchange=e=>{init(e.target.value);draw()};
}

/* ───────── INDEXES ───────── */
function rIdx(w,m){
  const MAX=3;let nid=0,splits,root,hl={n:new Set(),k:new Map()},timers=[];onLeave(()=>timers.forEach(clearTimeout));
  const mkn=leaf=>({id:++nid,leaf,keys:[],children:[]});
  function ins(n,k){
    if(n.leaf){if(n.keys.includes(k))return 'dup';let i=n.keys.findIndex(x=>x>k);if(i<0)i=n.keys.length;n.keys.splice(i,0,k);
      if(n.keys.length>MAX){const mid=Math.ceil(n.keys.length/2),r=mkn(true);r.keys=n.keys.splice(mid);splits++;return {sep:r.keys[0],right:r}}return null}
    let i=n.keys.filter(x=>x<=k).length;const res=ins(n.children[i],k);if(res==='dup')return 'dup';
    if(res){n.keys.splice(i,0,res.sep);n.children.splice(i+1,0,res.right);
      if(n.keys.length>MAX){const mid=Math.floor(n.keys.length/2),sep=n.keys[mid],r=mkn(false);r.keys=n.keys.splice(mid+1);n.keys.pop();r.children=n.children.splice(mid+1);splits++;return {sep,right:r}}}return null}
  function insert(k){const r=ins(root,k);if(r==='dup')return false;if(r){const nr=mkn(false);nr.keys=[r.sep];nr.children=[root,r.right];root=nr}return true}
  const path=k=>{let n=root;const p=[n];while(!n.leaf){n=n.children[n.keys.filter(x=>x<=k).length];p.push(n)}return p};
  const lv=()=>{const L=[];let c=[root];while(c.length){L.push(c);c=c.flatMap(n=>n.leaf?[]:n.children)}return L};
  const reset=()=>{nid=0;root=mkn(true);[10,20,30,40,50,60,70,80].forEach(insert);hl={n:new Set(),k:new Map()}};
  function draw(msg){const L=lv();$('#tr',w).innerHTML=L.map(l=>`<div class="lvl">${l.map(n=>`<div class="bn ${n.leaf?'leaf':''} ${hl.n.has(n.id)?'on':''}">${n.keys.map(k=>`<span class="${hl.k.get(k)||''}">${k}</span>`).join('')}</div>`).join('')}</div>`).join('');
    const total=L[L.length-1].reduce((a,n)=>a+n.keys.length,0);
    $('#st',w).innerHTML=`<div><b>${L.length}</b><span>levels (pages read per lookup)</span></div><div><b>${total}</b><span>keys</span></div><div><b>${total}</b><span>rows a seq scan would check</span></div>`;
    if(msg)$('#ms',w).innerHTML=msg}
  function animate(p,final,msg){timers.forEach(clearTimeout);hl={n:new Set(),k:new Map()};draw();
    p.forEach((n,i)=>timers.push(setTimeout(()=>{hl.n.add(n.id);draw(i<p.length-1?`Visiting level ${i+1}: pick the child whose range covers the key…`:msg);if(i===p.length-1)final()},550*(i+1))))}
  const IT=[['id = 42','B-tree','Equality and range on sortable values. The default, and right for most columns.'],
   ['price BETWEEN 10 AND 50 ORDER BY price','B-tree','Range scans walk the linked leaf level, already in sorted order.'],
   ['tags @> ARRAY[\'sql\']  or  doc @> \'{"a":1}\'','GIN','Inverted index: value → list of rows. Built for arrays, jsonb and full-text search.'],
   ['to_tsvector(body) @@ to_tsquery(\'postgres\')','GIN','Full-text search. GiST also works but GIN is faster to read, slower to update.'],
   ['name ILIKE \'%arlo%\'','GIN + pg_trgm','Trigram indexes make substring and fuzzy matches indexable.'],
   ['ST_DWithin(geom, point, 500)','GiST','Balanced tree over bounding boxes. Geometry, ranges, nearest-neighbor, exclusion constraints.'],
   ['created_at > now() - interval \'1 day\' on a huge append-only table','BRIN','Stores min/max per block range. Tiny, perfect when values correlate with physical order.'],
   ['token = \'abc123\' only equality, huge keys','Hash','Equality only. Smaller than B-tree for long keys, rarely needed.'],
   ['embedding <-> query ORDER BY ... LIMIT 10','pgvector HNSW / IVFFlat','Approximate nearest-neighbor search over vectors (extension).']];
  w.innerHTML=P(m,`<div class="panel stack"><h3>B+tree explorer</h3>
   <div class="row"><input id="kv" type="number" value="35" style="width:90px" aria-label="key"><button class="btn primary" data-a="ins">Insert</button><button class="btn" data-a="rnd">Insert 8 random</button><button class="btn" data-a="find">Search</button>
   <span style="color:var(--muted)">range</span><input id="lo" type="number" value="25" style="width:70px" aria-label="low"><input id="hi" type="number" value="55" style="width:70px" aria-label="high"><button class="btn" data-a="rng">Range scan</button><button class="btn" data-a="reset">Reset</button></div>
   <div class="tree" id="tr"></div><div class="kpi" id="st"></div><div class="note" id="ms">Insert enough keys to force a split and watch the tree grow upward. Leaves are chained, which is what makes range scans cheap.</div></div>
   <div class="panel stack"><h3>Which index for which query?</h3><label class="f">Query pattern<select id="iq">${IT.map((x,i)=>`<option value="${i}">${esc(x[0])}</option>`).join('')}</select></label><div id="ia"></div></div>
   <div class="cols">${[['B-tree','=, <, >, BETWEEN, ORDER BY, LIKE \'abc%\''],['Hash','= only'],['GIN','contains / overlaps / full-text'],['GiST','geometry, ranges, nearest-neighbor'],['SP-GiST','tries, quadtrees, IP ranges'],['BRIN','huge tables ordered by the indexed column']].map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`,
  ['An index trades write cost and disk space for read speed. Every INSERT and UPDATE must maintain every index on the table.',
   'A B-tree lookup touches a handful of pages even for billions of rows, because each level multiplies fan-out by hundreds.',
   'Multicolumn index (a, b) helps filters on a, or a and b, but not on b alone. Partial and expression indexes shrink and target the hot subset.',
   'Create indexes on busy tables with CREATE INDEX CONCURRENTLY to avoid blocking writes.']);
  function ia(){const x=IT[+$('#iq',w).value];$('#ia',w).innerHTML=`<div class="note good"><b>${x[1]}</b>. ${x[2]}</div>`}
  reset();splits=0;draw();ia();$('#iq',w).onchange=ia;
  w.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=parseInt($('#kv',w).value);timers.forEach(clearTimeout);hl={n:new Set(),k:new Map()};
    if(a==='ins'){if(isNaN(k))return;splits=0;const ok=insert(k);hl.k.set(k,'hit');draw(!ok?`<b>Duplicate key value violates unique constraint.</b> ${k} already exists.`:splits?`Inserted ${k}. A node overflowed (more than ${MAX} keys) so it <b>split</b> ${splits} time${splits>1?'s':''}, pushing a separator key upward.`:`Inserted ${k} into the correct leaf. No split needed.`)}
    if(a==='rnd'){splits=0;for(let i=0;i<8;i++)insert(1+Math.floor(Math.random()*99));hl={n:new Set(),k:new Map()};draw(`Inserted 8 random keys, causing ${splits} split${splits===1?'':'s'}. Notice the tree stays balanced: all leaves are at the same depth.`)}
    if(a==='reset'){reset();draw('Reset.')}
    if(a==='find'){const p=path(k),leaf=p[p.length-1],f=leaf.keys.includes(k);animate(p,()=>{hl.k.set(k,f?'hit':'miss');draw()},f?`<b>Found ${k}</b> after reading ${p.length} pages. A sequential scan would have checked up to ${lv().pop().reduce((a,n)=>a+n.keys.length,0)} keys.`:`<b>${k} is not in the index</b>, determined after reading ${p.length} pages.`)}
    if(a==='rng'){const lo=parseInt($('#lo',w).value),hi=parseInt($('#hi',w).value);const p=path(lo),leaves=lv().pop();const start=leaves.indexOf(p[p.length-1]);const vis=[];const keys=[];
      for(let i=start;i<leaves.length;i++){const ks=leaves[i].keys.filter(x=>x>=lo&&x<=hi);if(i>start&&leaves[i].keys[0]>hi)break;vis.push(leaves[i]);keys.push(...ks)}
      animate(p.concat(vis.slice(1)),()=>{keys.forEach(x=>hl.k.set(x,'hit'));draw()},`<b>Range scan ${lo}..${hi}</b>: descended once, then followed leaf links. Found ${keys.length} keys (${keys.join(', ')||'none'}). No re-descent needed.`)}
  });
}

/* ───────── PLANNER ───────── */
function rPlan(w,m){
  w.innerHTML=P(m,`<div class="cols"><div class="panel stack"><h3>Table and query</h3>
   <label class="f">Rows in table: <b id="vr"></b><input id="rows" type="range" min="2" max="8" step="0.1" value="6"></label>
   <label class="f">Selectivity (rows returned): <b id="vs"></b><input id="sel" type="range" min="-7" max="0" step="0.1" value="-3"></label>
   <label class="f">Physical order correlation with index: <b id="vc"></b><input id="cor" type="range" min="0" max="1" step="0.05" value="0"></label>
   <label class="f">random_page_cost: <b id="vp"></b><input id="rpc" type="range" min="1" max="6" step="0.1" value="4"></label>
   <label><input type="checkbox" id="hasi" checked> Index exists on the filtered column</label>
   <label><input type="checkbox" id="only"> Query needs only indexed columns (index-only scan)</label></div>
   <div class="panel stack"><h3>Planner's estimate</h3><div class="bars" id="bars"></div><pre id="ex"></pre><div class="note" id="why"></div></div></div>`,
  ['The planner picks the lowest estimated cost. Costs are unitless: one sequential page read = 1, a random page read = random_page_cost (4 by default, ~1.1 on SSD).',
   'An index wins when few rows match. Returning a large fraction of the table is cheaper with a sequential scan.',
   'Bitmap scans sit in between: collect matching row locations, then read heap pages in order.',
   'Use EXPLAIN (ANALYZE, BUFFERS) to compare estimated rows with actual rows. A big mismatch usually means stale statistics: run ANALYZE.']);
  function calc(){
    const rows=Math.round(10**+$('#rows',w).value),sf=10**+$('#sel',w).value,corr=+$('#cor',w).value,rpc=+$('#rpc',w).value,hasI=$('#hasi',w).checked,only=$('#only',w).checked;
    const pages=Math.max(1,Math.ceil(rows/100)),matched=Math.max(1,Math.round(rows*sf)),sel=matched/rows;
    $('#vr',w).textContent=fmt(rows);$('#vs',w).textContent=`${(sel*100).toPrecision(2)}% ≈ ${fmt(matched)} rows`;$('#vc',w).textContent=corr.toFixed(2);$('#vp',w).textContent=rpc.toFixed(1);
    $('#only',w).disabled=!hasI;
    const seq=pages+rows*0.0125;const ML=Math.min(pages,2*pages*matched/(2*pages+matched));
    const maxIO=ML*rpc,minIO=rpc+Math.max(0,Math.ceil(sel*pages)-1);const idxIO=maxIO+corr*corr*(minIO-maxIO);
    const idx=0.3+idxIO+matched*0.0175;
    const per=rpc-(rpc-1)*Math.sqrt(ML/pages);const bmp=0.3+ML*per+matched*0.0175+matched*0.0075;
    const ios=0.3+matched*0.0075+Math.ceil(sel*pages)*0.1;
    const C=[['Seq Scan',seq]];if(hasI){C.push(['Index Scan',idx],['Bitmap Heap Scan',bmp]);if(only)C.push(['Index Only Scan',ios])}
    const best=C.reduce((a,b)=>b[1]<a[1]?b:a);const mx=Math.max(...C.map(c=>Math.log10(c[1]+1)));
    $('#bars',w).innerHTML=C.map(c=>`<div class="bar"><div><span>${c[0]}${c===best?' <span class="tag good">chosen</span>':''}</span><span class="mono">${num(c[1].toFixed(0))}</span></div><div class="track"><div class="fill ${c===best?'best':''}" style="width:${Math.max(2,Math.log10(c[1]+1)/mx*100)}%"></div></div></div>`).join('')+'<div style="font-size:12px;color:var(--muted)">Bar length is log-scaled.</div>';
    const cs=best[1].toFixed(2);
    const plans={'Seq Scan':`Seq Scan on orders  (cost=0.00..${cs} rows=${matched} width=64)\n  Filter: (customer_id = 42)`,
      'Index Scan':`Index Scan using orders_customer_idx on orders\n  (cost=0.43..${cs} rows=${matched} width=64)\n  Index Cond: (customer_id = 42)`,
      'Bitmap Heap Scan':`Bitmap Heap Scan on orders  (cost=4.30..${cs} rows=${matched} width=64)\n  Recheck Cond: (customer_id = 42)\n  ->  Bitmap Index Scan on orders_customer_idx\n        Index Cond: (customer_id = 42)`,
      'Index Only Scan':`Index Only Scan using orders_cover_idx on orders\n  (cost=0.43..${cs} rows=${matched} width=8)\n  Index Cond: (customer_id = 42)\n  Heap Fetches: 0`};
    $('#ex',w).textContent=plans[best[0]];
    const why={'Seq Scan':hasI?'Too many rows match. Jumping around the heap through an index would cost more than reading every page once in order.':'No usable index, so reading the whole table is the only option.',
      'Index Scan':'Few rows match, or the table is physically ordered like the index, so random heap reads are cheap enough.',
      'Bitmap Heap Scan':'A middle number of rows: collecting row locations first lets the heap be read in page order, avoiding repeated page visits.',
      'Index Only Scan':'The index holds every column needed. The heap is skipped for pages marked all-visible by VACUUM.'};
    $('#why',w).innerHTML=`<b>${best[0]}.</b> ${why[best[0]]}`}
  $$('input',w).forEach(i=>i.oninput=calc);calc();
}

/* ───────── JOINS ───────── */
function rJoin(w,m){
  const CU=[[1,'Ada'],[2,'Bo'],[3,'Cy'],[4,'Di']],OR=[[101,1],[102,3],[103,1],[104,4],[105,3]];
  const ALG={nl:{t:'Nested loop',d:'For every outer row, scan the inner side. Best when the outer side is tiny and the inner side has an index. Awful on two big unindexed tables.'},
   hash:{t:'Hash join',d:'Build an in-memory hash table from the smaller input, then probe it with each row of the larger. Needs work_mem, equality conditions only. The workhorse for big joins.'},
   merge:{t:'Merge join',d:'Both inputs sorted on the join key, then walked together once. Great when inputs are already sorted (index order) or for very large joins.'}};
  function steps(a){const S=[],res=[];let cmp=0;
    if(a==='nl'){CU.forEach((c,i)=>OR.forEach((o,j)=>{cmp++;const hit=c[0]===o[1];if(hit)res.push(`${c[1]} · #${o[0]}`);S.push({c:i,o:j,hit,cmp,res:res.slice(),txt:`Compare customer ${c[0]} with order ${o[0]} (customer_id ${o[1]}): ${hit?'match, emit row':'no match'}.`})}))}
    if(a==='hash'){const H={};CU.forEach((c,i)=>{const b=c[0]%3;(H[b]=H[b]||[]).push(c[1]);S.push({c:i,o:-1,hit:false,cmp,res:res.slice(),H:JSON.parse(JSON.stringify(H)),txt:`Build phase: hash customer ${c[0]} → bucket ${b}.`})});
      OR.forEach((o,j)=>{const b=o[1]%3;cmp++;const c=CU.findIndex(x=>x[0]===o[1]);const hit=c>=0;if(hit)res.push(`${CU[c][1]} · #${o[0]}`);S.push({c,o:j,hit,cmp,res:res.slice(),H:JSON.parse(JSON.stringify(H)),txt:`Probe phase: order ${o[0]} hashes customer_id ${o[1]} → bucket ${b}: ${hit?'found '+CU[c][1]+', emit row':'empty'}.`})})}
    if(a==='merge'){const O=OR.slice().sort((x,y)=>x[1]-y[1]);let j=0;
      CU.forEach((c,i)=>{while(j<O.length&&O[j][1]<c[0]){cmp++;S.push({c:i,o:j,hit:false,cmp,res:res.slice(),sorted:O,txt:`Customer ${c[0]} vs order key ${O[j][1]}: order key is smaller, advance the orders pointer.`});j++}
        let k=j,any=false;while(k<O.length&&O[k][1]===c[0]){cmp++;res.push(`${c[1]} · #${O[k][0]}`);any=true;S.push({c:i,o:k,hit:true,cmp,res:res.slice(),sorted:O,txt:`Customer ${c[0]} = order key ${O[k][1]}: match, emit row.`});k++}
        if(!any){cmp++;S.push({c:i,o:Math.min(j,O.length-1),hit:false,cmp,res:res.slice(),sorted:O,txt:`Customer ${c[0]}: no orders with this key (next key is ${j<O.length?O[j][1]:'end'}). Move to next customer.`})}j=k})}
    return S}
  let cur='nl',api,S;
  w.innerHTML=P(m,`<div class="panel stack"><div class="tabs" id="tabs">${Object.entries(ALG).map(([k,v])=>`<button data-alg="${k}" aria-pressed="${k===cur}">${v.t}</button>`).join('')}</div>
   <p id="ad" style="color:var(--muted)"></p><pre style="white-space:pre-wrap">SELECT c.name, o.id FROM customers c JOIN orders o ON o.customer_id = c.id;</pre>
   <div class="cols"><div><h3 style="font-size:14px;margin-bottom:6px">customers</h3><div class="tw"><table class="t" id="tc"></table></div></div><div><h3 style="font-size:14px;margin-bottom:6px" id="oh">orders</h3><div class="tw"><table class="t" id="to"></table></div></div>
   <div><h3 style="font-size:14px;margin-bottom:6px">Hash table / result</h3><div id="hs" class="mono"></div><div class="out" id="rs" style="margin-top:8px">(empty)</div></div></div>
   <div class="note" id="tx">Press Next step.</div><div class="kpi"><div><b id="cm">0</b><span>comparisons / probes</span></div></div>${ctl()}</div>`,
  ['The planner chooses the join algorithm from cost estimates, you only write the JOIN.',
   'Nested loop with an index on the inner side is the OLTP favorite: a few rows, many fast lookups.',
   'Hash joins need memory. If the hash table exceeds work_mem it spills to disk in batches and slows down sharply.',
   'Missing index on a foreign key column is the classic cause of a slow nested loop.']);
  function draw(i){const s=i>=0?S[i]:null;const sorted=(s&&s.sorted)||(cur==='merge'?OR.slice().sort((x,y)=>x[1]-y[1]):OR);
    $('#tc',w).innerHTML='<tr><th>id</th><th>name</th></tr>'+CU.map((c,k)=>`<tr class="${s&&s.c===k?(s.hit?'ok':'hl'):''}"><td>${c[0]}</td><td>${c[1]}</td></tr>`).join('');
    $('#oh',w).textContent=cur==='merge'?'orders (sorted by customer_id)':'orders';
    $('#to',w).innerHTML='<tr><th>id</th><th>customer_id</th></tr>'+sorted.map((o,k)=>`<tr class="${s&&s.o===k?(s.hit?'ok':'hl'):''}"><td>${o[0]}</td><td>${o[1]}</td></tr>`).join('');
    $('#hs',w).innerHTML=cur==='hash'&&s&&s.H?[0,1,2].map(b=>`bucket ${b}: ${(s.H[b]||[]).join(', ')||'—'}`).join('<br>'):cur==='hash'?'(hash table empty)':'';
    $('#rs',w).textContent=s&&s.res.length?s.res.join('\n'):'(empty)';$('#cm',w).textContent=s?s.cmp:0;$('#tx',w).textContent=s?s.txt:'Press Next step.'}
  function mk(){api&&api.stop();S=steps(cur);$('#ad',w).textContent=ALG[cur].d;api=player(S.length,draw,cur==='nl'?350:900);draw(-1)}
  mk();bindCtl(w,{next:()=>api.next(),prev:()=>api.prev(),reset:()=>api.reset(),play:()=>api.play(),stop:()=>api.stop()});
  $('#tabs',w).addEventListener('click',e=>{const b=e.target.closest('[data-alg]');if(!b)return;cur=b.dataset.alg;$$('#tabs button',w).forEach(x=>x.setAttribute('aria-pressed',x===b));mk()});
}

/* ───────── WAL ───────── */
function rWal(w,m){
  let W;const P3=['A','B','C'];
  const init=()=>{W={data:{A:{v:0,lsn:0},B:{v:0,lsn:0},C:{v:0,lsn:0}},buf:null,wal:[],lsn:0,flushed:0,ckpt:0,tx:0,open:null,crashed:false,sync:W?W.sync:true,acked:[],log:[]};
    W.buf={};P3.forEach(p=>W.buf[p]={v:0,dirty:false,lsn:0})};
  const L=t=>W.log.unshift(t);
  function upd(p){if(W.crashed)return;if(!W.open)W.open=++W.tx;const b=W.buf[p];b.v++;b.dirty=true;W.lsn++;b.lsn=W.lsn;W.wal.push({lsn:W.lsn,type:'upd',tx:W.open,page:p});L(`Tx ${W.open}: changed page ${p} in shared_buffers (dirty) and appended WAL record LSN ${W.lsn} to the WAL buffer.`)}
  function commit(){if(W.crashed)return;if(!W.open){L('No open transaction.');return}W.lsn++;W.wal.push({lsn:W.lsn,type:'commit',tx:W.open});W.acked.push({tx:W.open,lsn:W.lsn});
    if(W.sync){W.flushed=W.lsn;L(`COMMIT tx ${W.open}: WAL flushed and fsynced up to LSN ${W.lsn}. Client told "COMMIT". Durable.`)}else L(`COMMIT tx ${W.open}: client told "COMMIT" immediately, but WAL up to LSN ${W.lsn} is still only in RAM (synchronous_commit = off).`);W.open=null}
  function tick(){if(W.crashed)return;W.flushed=W.lsn;L(`WAL writer flushed WAL to LSN ${W.flushed}.`)}
  function ckpt(){if(W.crashed)return;W.flushed=W.lsn;let n=0;P3.forEach(p=>{const b=W.buf[p];if(b.dirty){W.data[p]={v:b.v,lsn:b.lsn};b.dirty=false;n++}});W.lsn++;W.wal.push({lsn:W.lsn,type:'ckpt'});W.flushed=W.lsn;W.ckpt=W.lsn;L(`CHECKPOINT: wrote ${n} dirty page(s) to data files, recorded checkpoint at LSN ${W.lsn}. Older WAL can be recycled.`)}
  function crash(){if(W.crashed)return;const lost=W.acked.filter(a=>a.lsn>W.flushed);const dropped=W.wal.filter(r=>r.lsn>W.flushed).length;
    W.wal=W.wal.filter(r=>r.lsn<=W.flushed);W.lsn=W.flushed;W.acked=W.acked.filter(a=>a.lsn<=W.flushed);W.buf=null;W.open=null;W.crashed=true;
    L(`CRASH! shared_buffers and the WAL buffer vanished (${dropped} unflushed WAL record(s) lost).`);lost.forEach(a=>L(`⚠ Tx ${a.tx} was acknowledged to the client but its commit record was not on disk. It is lost.`))}
  function recover(){if(!W.crashed)return;let n=0;W.wal.forEach(r=>{if(r.lsn>W.ckpt&&r.type==='upd'&&r.lsn>W.data[r.page].lsn){W.data[r.page].v++;W.data[r.page].lsn=r.lsn;n++}});
    W.buf={};P3.forEach(p=>W.buf[p]={v:W.data[p].v,dirty:false,lsn:W.data[p].lsn});W.crashed=false;L(`RECOVERY: replayed ${n} WAL record(s) after checkpoint LSN ${W.ckpt}. Server is back.`)}
  const visible=p=>{const c=new Set(W.wal.filter(r=>r.type==='commit').map(r=>r.tx));return W.wal.filter(r=>r.type==='upd'&&r.page===p&&c.has(r.tx)).length};
  w.innerHTML=P(m,`<div class="panel stack"><div class="row"><label><input type="checkbox" id="sync" checked> synchronous_commit = on</label></div>
   <div class="row">${P3.map(p=>`<button class="btn" data-a="upd" data-p="${p}">UPDATE page ${p}</button>`).join('')}<button class="btn primary" data-a="commit">COMMIT</button><button class="btn" data-a="tick">WAL writer tick</button><button class="btn" data-a="ckpt">CHECKPOINT</button><button class="btn danger" data-a="crash">💥 Crash server</button><button class="btn primary" data-a="recover">Restart + recover</button><button class="btn" data-a="reset">Reset</button></div>
   <div class="cols"><div class="panel"><h3>Shared buffers <span class="tag">RAM</span></h3><div id="bf"></div></div>
   <div class="panel"><h3>WAL <span class="tag">log: RAM tail + disk</span></h3><div id="wl" style="max-height:230px;overflow:auto"></div></div>
   <div class="panel"><h3>Data files <span class="tag">disk</span></h3><div id="df"></div></div></div>
   <div class="panel"><h3>What committed clients can see</h3><div id="vv" class="row"></div></div><div class="log" id="lg"></div></div>`,
  ['Rule: the log record reaches disk before the data page does (write-ahead). Commit only waits for the sequential WAL flush, never for random data-file writes.',
   'After a crash, Postgres replays WAL from the last checkpoint. Committed work is redone; uncommitted work stays invisible.',
   'synchronous_commit = off trades up to a few hundred ms of recent commits for speed. You lose the latest commits, never consistency.',
   'The same WAL stream feeds replicas and point-in-time recovery.']);
  function draw(){
    $('#bf',w).innerHTML=W.crashed?'<p class="null">Lost in the crash.</p>':P3.map(p=>`<div class="row" style="margin-bottom:6px"><span class="cell">${p}</span><b class="mono">v = ${W.buf[p].v}</b>${W.buf[p].dirty?'<span class="tag warn">dirty</span>':'<span class="tag good">clean</span>'}</div>`).join('');
    $('#wl',w).innerHTML=W.wal.length?W.wal.slice(-14).map(r=>`<div class="rec ${r.lsn>W.flushed?'ram':''} ${r.lsn<W.ckpt?'old':''}">LSN ${r.lsn} · ${r.type==='upd'?`tx ${r.tx} update ${r.page}`:r.type==='commit'?`tx ${r.tx} COMMIT`:'CHECKPOINT'}${r.lsn>W.flushed?' · RAM only':''}${r.lsn<W.ckpt?' · recyclable':''}</div>`).join(''):'<p class="null">Empty.</p>';
    $('#df',w).innerHTML=P3.map(p=>`<div class="row" style="margin-bottom:6px"><span class="cell">${p}</span><b class="mono">v = ${W.data[p].v}</b><span class="tag">page LSN ${W.data[p].lsn}</span></div>`).join('');
    $('#vv',w).innerHTML=W.crashed?'<span class="null">Server is down.</span>':P3.map(p=>`<span class="tag acc">page ${p}: ${visible(p)} committed change${visible(p)===1?'':'s'}</span>`).join('');
    $('#lg',w).innerHTML=logHTML(W.log);$$('[data-a]',w).forEach(b=>{if(b.dataset.a==='recover')b.disabled=!W.crashed;else if(b.dataset.a!=='reset')b.disabled=W.crashed})}
  init();draw();
  w.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='upd')upd(b.dataset.p);if(a==='commit')commit();if(a==='tick')tick();if(a==='ckpt')ckpt();if(a==='crash')crash();if(a==='recover')recover();if(a==='reset')init();draw()});
  $('#sync',w).onchange=e=>{W.sync=e.target.checked;L(`synchronous_commit = ${W.sync?'on':'off'}`);draw()};
}

/* ───────── LOCKS ───────── */
function rLocks(w,m){
  const M=['ACCESS SHARE','ROW SHARE','ROW EXCLUSIVE','SHARE UPDATE EXCLUSIVE','SHARE','SHARE ROW EXCLUSIVE','EXCLUSIVE','ACCESS EXCLUSIVE'];
  const CF={1:[8],2:[7,8],3:[5,6,7,8],4:[4,5,6,7,8],5:[3,4,6,7,8],6:[3,4,5,6,7,8],7:[2,3,4,5,6,7,8],8:[1,2,3,4,5,6,7,8]};
  const conf=(a,b)=>CF[a].includes(b);
  const CMD=[['SELECT',1],['SELECT … FOR UPDATE',2],['INSERT / UPDATE / DELETE',3],['VACUUM (plain) / ANALYZE',4],['CREATE INDEX CONCURRENTLY',4],['CREATE INDEX (blocking)',5],['CREATE TRIGGER / some ALTER TABLE',6],['REFRESH MATERIALIZED VIEW CONCURRENTLY',7],['ALTER TABLE (most forms) / DROP / TRUNCATE',8],['VACUUM FULL / REINDEX / LOCK TABLE',8]];
  let ra=3,rb=8;
  w.innerHTML=P(m,`<div class="panel stack"><h3>Two sessions, one table</h3><div class="cols">
   <label class="f">Already running (holds the lock)<select id="ca">${CMD.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select></label>
   <label class="f">Arrives later<select id="cb">${CMD.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('')}</select></label></div><div id="res"></div></div>
   <div class="panel"><h3>Conflict matrix</h3><p style="color:var(--muted);font-size:13.5px;margin-bottom:8px">Red = the two lock modes conflict, so the second session waits. Click a cell, or use the dropdowns above.</p>
   <div class="tw"><table class="mx" id="mx"></table></div></div>
   <div class="cols"><div class="card"><h3>Row-level locks</h3><p>UPDATE, DELETE and SELECT FOR UPDATE lock individual rows (stored in the tuple header). Two sessions only wait if they touch the same row.</p></div>
   <div class="card"><h3>Deadlocks</h3><p>A waits for B and B waits for A. Postgres detects the cycle after deadlock_timeout (1 s) and aborts one session. Fix: always lock rows in the same order.</p></div>
   <div class="card"><h3>Advisory locks</h3><p>pg_advisory_lock(key) gives your application named locks that Postgres manages but never takes by itself.</p></div></div>`,
  ['Plain reads (ACCESS SHARE) only conflict with ACCESS EXCLUSIVE. That is why ALTER TABLE, which needs ACCESS EXCLUSIVE, queues behind a long SELECT and then blocks every query behind it.',
   'Safe migration habit: set lock_timeout to a few seconds, so DDL gives up instead of stalling production.',
   'Use CREATE INDEX CONCURRENTLY, and add constraints as NOT VALID then VALIDATE, to avoid heavy locks.',
   'Find blockers with pg_locks and pg_blocking_pids(pid).']);
  function draw(){$('#mx',w).innerHTML=`<tr><th></th>${M.map((_,i)=>`<th>${i+1}</th>`).join('')}</tr>`+M.map((n,r)=>`<tr><th style="white-space:nowrap">${r+1} ${n.toLowerCase()}</th>${M.map((_,c)=>`<td data-r="${r+1}" data-c="${c+1}" class="${conf(r+1,c+1)?'x':''} ${r+1===ra&&c+1===rb?'cur':''}">${conf(r+1,c+1)?'✕':'✓'}</td>`).join('')}</tr>`).join('');
    const ia=CMD.findIndex(c=>c[1]===ra&&c[0]===CMD[+$('#ca',w).value][0]);
    const A=CMD[+$('#ca',w).value],B=CMD[+$('#cb',w).value];ra=A[1];rb=B[1];const c=conf(ra,rb);
    $('#res',w).innerHTML=`<div class="note ${c?'bad':'good'}"><b>${c?'Blocked.':'Runs concurrently.'}</b> ${esc(A[0])} takes <b>${M[ra-1]}</b>; ${esc(B[0])} needs <b>${M[rb-1]}</b>. ${c?'The second statement waits until the first transaction ends, and anything queued behind it waits too.':'The lock modes are compatible, so neither waits (row-level conflicts can still occur).'}</div>`}
  $('#ca',w).value=2;$('#cb',w).value=8;draw();
  $('#ca',w).onchange=$('#cb',w).onchange=draw;
  w.addEventListener('click',e=>{const t=e.target.closest('td[data-r]');if(!t)return;const r=+t.dataset.r,c=+t.dataset.c;
    $('#ca',w).value=CMD.findIndex(x=>x[1]===r);$('#cb',w).value=CMD.findIndex(x=>x[1]===c);draw()});
}

/* ───────── REPLICATION ───────── */
function rRepl(w,m){
  let R,iv;
  const init=()=>{R={lsn:0,sb:0,pending:[],acked:[],sync:R?R.sync:false,net:R?R.net:true,lat:R?R.lat:900,promoted:false,log:[]}};
  const L=t=>R.log.unshift(t);
  function tick(){if(R.promoted||!R.net||R.sb>=R.lsn)return;R.sb++;R.pending=R.pending.filter(l=>{if(l<=R.sb){R.acked.push(l);L(`Standby confirmed LSN ${l}: client gets COMMIT.`);return false}return true});draw()}
  function restart(){clearInterval(iv);iv=setInterval(tick,R.lat)}onLeave(()=>clearInterval(iv));
  function commit(){if(R.promoted)return;R.lsn++;if(R.sync){R.pending.push(R.lsn);L(`Tx ${R.lsn} committed locally. Waiting for the standby before telling the client…`)}else{R.acked.push(R.lsn);L(`Tx ${R.lsn} committed. Client told immediately (async).`)}}
  function failover(){const lost=R.acked.filter(l=>l>R.sb);R.promoted=true;L(`Primary lost. Standby promoted at LSN ${R.sb}.`);L(lost.length?`⚠ ${lost.length} acknowledged transaction(s) were lost: ${lost.join(', ')}.`:'No acknowledged transaction was lost.');R.pending.length&&L(`${R.pending.length} commit(s) were never acknowledged, the client sees an error and can retry.`)}
  w.innerHTML=P(m,`<div class="panel stack"><div class="row"><label><input type="checkbox" id="sy"> synchronous_commit = remote_apply / on with synchronous_standby_names</label><label><input type="checkbox" id="nt" checked> Network up</label>
    <label class="f" style="min-width:200px">Replication delay per record: <b id="lv"></b><input id="lt" type="range" min="200" max="2000" step="100" value="900"></label></div>
   <div class="row"><button class="btn primary" data-a="c">COMMIT a transaction</button><button class="btn danger" data-a="f">💥 Primary crashes, promote standby</button><button class="btn" data-a="r">Reset</button></div>
   <div class="cols"><div class="panel"><h3>Primary <span class="tag acc">writes</span></h3><div id="pm"></div></div><div class="panel"><h3>Standby <span class="tag">replays WAL</span></h3><div id="sm"></div></div></div>
   <div class="legend"><span><i style="background:var(--good)"></i>safe on the standby</span><span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>acknowledged but only on primary</span><span><i style="border:1px dashed var(--muted)"></i>client still waiting</span></div>
   <div class="log" id="lg"></div></div>
   <div class="cols"><div class="card"><h3>Physical (streaming)</h3><p>Ships the raw WAL. The standby is a byte-identical copy of the whole cluster; read-only with hot_standby. Needs the same major version.</p></div>
   <div class="card"><h3>Logical</h3><p>Publishes row changes per table (PUBLICATION / SUBSCRIPTION). Can cross versions, replicate a subset, and write on the target. Does not copy DDL.</p></div>
   <div class="card"><h3>Replication slots</h3><p>Make the primary keep WAL until a consumer has it. Safe, but an abandoned slot fills the disk: monitor pg_replication_slots.</p></div>
   <div class="card"><h3>Failover</h3><p>Postgres does not elect leaders by itself. Patroni, repmgr or a managed service decides when to promote and fences the old primary.</p></div></div>`,
  ['Async replication is fast but a failover can lose the last acknowledged commits. Sync replication loses nothing but commits wait on the network.',
   'With synchronous replication and the standby unreachable, commits hang: you choose between availability and durability.',
   'Replicas also scale reads. Expect replica lag: a read right after a write may not see it.',
   'Replication is not a backup. A DROP TABLE replicates instantly. Keep base backups plus WAL archives for point-in-time recovery.']);
  function draw(){
    const sq=(l)=>{const cls=l<=R.sb?'good':R.acked.includes(l)?'warn':'wait';return `<span class="sq ${cls}">${l}</span>`};
    $('#pm',w).innerHTML=R.lsn?Array.from({length:R.lsn},(_,i)=>sq(i+1)).join(''):'<span class="null">No transactions yet.</span>';
    $('#sm',w).innerHTML=R.promoted?`<span class="tag good">PROMOTED: new primary at LSN ${R.sb}</span><br>`+Array.from({length:R.sb},(_,i)=>`<span class="sq good">${i+1}</span>`).join(''):R.sb?Array.from({length:R.sb},(_,i)=>`<span class="sq good">${i+1}</span>`).join(''):'<span class="null">Nothing received.</span>';
    $('#lg',w).innerHTML=logHTML(R.log);$('#lv',w).textContent=R.lat+' ms';$$('[data-a]',w).forEach(b=>{if(b.dataset.a!=='r')b.disabled=R.promoted})}
  init();draw();restart();
  w.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;if(a==='c')commit();if(a==='f')failover();if(a==='r'){init();$('#sy',w).checked=R.sync;restart()}draw()});
  $('#sy',w).onchange=e=>{R.sync=e.target.checked;L('Mode: '+(R.sync?'SYNCHRONOUS':'ASYNCHRONOUS'));draw()};
  $('#nt',w).onchange=e=>{R.net=e.target.checked;L(R.net?'Network restored.':'Network partition: standby unreachable.');draw()};
  $('#lt',w).oninput=e=>{R.lat=+e.target.value;restart();draw()};
}

/* ───────── PARTITIONING ───────── */
function rPart(w,m){
  const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const REG=['EU','US','APAC','LATAM'];let mode='range';
  const rowsOf=n=>Math.round(2e6+((n*7919)%13)*3e5);
  w.innerHTML=P(m,`<div class="panel stack"><div class="tabs" id="tb">${[['range','Range (by month)'],['list','List (by region)'],['hash','Hash (by id)']].map(([k,t])=>`<button data-m="${k}" aria-pressed="${k===mode}">${t}</button>`).join('')}</div>
   <div id="ctrl" class="row"></div><div class="pgrid" id="pg"></div><div class="kpi" id="kp"></div><pre id="ex"></pre><div class="note" id="nt"></div></div>`,
  ['Partitioning splits one logical table into many physical tables. Queries that filter on the partition key touch only the matching partitions (partition pruning).',
   'Pruning only works when the WHERE clause compares the bare partition key. Wrapping it in a function usually defeats pruning.',
   'Biggest win: dropping or detaching an old partition is instant, while DELETE of the same rows would bloat the table.',
   'Keep partition counts reasonable (tens to a few hundred). Thousands slow down planning. Partitioning is not sharding: it all stays on one server.']);
  function ctrl(){const c=$('#ctrl',w);
    if(mode==='range')c.innerHTML=`<label class="f">created_at from<select id="a">${MON.map((x,i)=>`<option value="${i}">${x} 2025</option>`).join('')}</select></label><label class="f">to (inclusive)<select id="b">${MON.map((x,i)=>`<option value="${i}">${x} 2025</option>`).join('')}</select></label><label class="row" style="margin-top:16px"><input type="checkbox" id="fn"> wrap the column: date_trunc('month', created_at) = …</label>`;
    if(mode==='list')c.innerHTML=REG.map(r=>`<label><input type="checkbox" class="rg" value="${r}" ${r==='EU'?'checked':''}> ${r}</label>`).join('')+`<label><input type="checkbox" id="nof"> no region filter at all</label>`;
    if(mode==='hash')c.innerHTML=`<label class="f">id = <input id="id" type="number" value="1042" style="width:100px"></label><label><input type="checkbox" id="nof"> no id filter (e.g. WHERE status = 'new')</label>`;
    $('#a',w)&&($('#a',w).value=2,$('#b',w).value=4);$$('input,select',c).forEach(x=>x.oninput=draw)}
  function draw(){let parts,scan,name,pred;
    if(mode==='range'){parts=MON.map((x,i)=>`orders_2025_${String(i+1).padStart(2,'0')}`);const a=+$('#a',w).value,b=+$('#b',w).value,fn=$('#fn',w).checked;scan=parts.map((_,i)=>fn||(i>=Math.min(a,b)&&i<=Math.max(a,b)));
      pred=fn?`WHERE date_trunc('month', created_at) = '${MON[a]} 2025'`:`WHERE created_at >= '2025-${String(Math.min(a,b)+1).padStart(2,'0')}-01' AND created_at < '2025-${String(Math.max(a,b)+2).padStart(2,'0')}-01'`}
    if(mode==='list'){parts=REG.map(r=>`orders_${r.toLowerCase()}`);const no=$('#nof',w).checked,sel=$$('.rg',w).filter(x=>x.checked).map(x=>x.value);scan=REG.map(r=>no||sel.includes(r));pred=no?`WHERE status = 'new'`:`WHERE region IN (${sel.map(s=>"'"+s+"'").join(', ')||'…'})`}
    if(mode==='hash'){parts=[0,1,2,3].map(i=>`orders_p${i}`);const no=$('#nof',w).checked,id=+$('#id',w).value;scan=[0,1,2,3].map(i=>no||((id%4)+4)%4===i);pred=no?`WHERE status = 'new'`:`WHERE id = ${id}`}
    const rs=parts.map((_,i)=>rowsOf(i+1)),tot=rs.reduce((a,b)=>a+b,0),sc=rs.reduce((a,b,i)=>a+(scan[i]?b:0),0),n=scan.filter(Boolean).length;
    $('#pg',w).innerHTML=parts.map((p,i)=>`<div class="part ${scan[i]?'scan':'skip'}"><b>${p.replace('orders_','')}</b><br><span style="color:var(--muted)">${fmt(rs[i])} rows</span><br>${scan[i]?'scanned':'pruned'}</div>`).join('');
    $('#kp',w).innerHTML=`<div><b>${n} / ${parts.length}</b><span>partitions scanned</span></div><div><b>${fmt(sc)}</b><span>rows in scope</span></div><div><b>${(sc/tot*100).toFixed(0)}%</b><span>of ${fmt(tot)} total rows</span></div>`;
    $('#ex',w).textContent=`EXPLAIN SELECT * FROM orders ${pred};\n`+(n===0?'Result  (One-Time Filter: false)':`Append\n`+parts.filter((_,i)=>scan[i]).slice(0,5).map(p=>`  ->  Seq Scan on ${p}`).join('\n')+(n>5?`\n  ->  … ${n-5} more partitions`:''));
    $('#nt',w).innerHTML=n===parts.length&&(mode==='range'&&$('#fn',w).checked||$('#nof',w)&&$('#nof',w).checked)?'<b>No pruning.</b> The planner cannot map this condition to a partition key, so every partition is scanned.':`<b>Pruned ${parts.length-n} partition${parts.length-n===1?'':'s'} at plan time.</b> Only the partitions that can contain matching rows are in the plan.`}
  w.querySelector('#tb').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(!b)return;mode=b.dataset.m;$$('#tb button',w).forEach(x=>x.setAttribute('aria-pressed',x===b));ctrl();draw()});
  ctrl();draw();
}

/* ───────── TUNING ───────── */
function rTune(w,m){
  w.innerHTML=P(m,`<div class="cols"><div class="panel stack"><h3>Your server</h3>
   <label class="f">RAM (GB)<input id="ram" type="number" value="32" min="1" max="2048"></label>
   <label class="f">CPU cores<input id="cpu" type="number" value="8" min="1" max="256"></label>
   <label class="f">Max connections<input id="mc" type="number" value="200" min="10" max="5000"></label>
   <label class="f">Storage<select id="sto"><option value="ssd">SSD / NVMe</option><option value="hdd">Spinning disk</option></select></label>
   <label class="f">Workload<select id="wk"><option value="oltp">OLTP (many small queries)</option><option value="mix">Mixed</option><option value="dw">Analytics / reporting</option></select></label></div>
   <div class="panel stack"><h3>Memory budget</h3><div class="bars" id="mb"></div><div id="wn"></div></div></div>
   <div class="panel stack"><div class="row" style="justify-content:space-between"><h3>postgresql.conf starting point</h3><button class="btn sm" id="cp">Copy</button></div><pre id="cf"></pre>
   <p style="color:var(--muted);font-size:13.5px">Rules of thumb from the community, not a substitute for measuring. Change one thing at a time and check with pg_stat_statements and EXPLAIN (ANALYZE, BUFFERS).</p></div>`,
  ['shared_buffers is Postgres’s own cache (start near 25% of RAM). The OS page cache holds the rest, and effective_cache_size tells the planner about both.',
   'work_mem is per sort or hash node, per query, per connection. 200 connections with several nodes each can exhaust RAM, so keep it modest globally and raise it per session for reports.',
   'random_page_cost = 1.1 on SSD stops the planner from avoiding perfectly good indexes.',
   'Bigger max_wal_size means fewer, smoother checkpoints at the price of longer crash recovery.']);
  const mb=n=>n>=1024?(n/1024).toFixed(n%1024?1:0).replace(/\.0$/,'')+'GB':Math.round(n)+'MB';
  function calc(){const ram=+$('#ram',w).value||1,cpu=+$('#cpu',w).value||1,mc=+$('#mc',w).value||10,ssd=$('#sto',w).value==='ssd',wk=$('#wk',w).value;const R=ram*1024;
    const sb=Math.min(R*0.25,40*1024),ecs=R*0.75,frac=wk==='oltp'?0.25:wk==='mix'?0.35:0.5;
    const wm=Math.max(4,Math.floor(R*frac/(mc*3))),mw=Math.min(2048,Math.max(64,R/16)),maxw=wk==='oltp'?4096:wk==='mix'?8192:16384;
    const pw=Math.min(cpu,wk==='dw'?8:4),worst=mc*wm*2;
    const lines=[['shared_buffers',mb(sb)],['effective_cache_size',mb(ecs)],['work_mem',mb(wm)],['maintenance_work_mem',mb(mw)],['wal_buffers','16MB'],['max_wal_size',mb(maxw)],['checkpoint_timeout','15min'],['checkpoint_completion_target','0.9'],
     ['random_page_cost',ssd?'1.1':'4.0'],['effective_io_concurrency',ssd?'200':'2'],['max_connections',mc],['max_worker_processes',cpu],['max_parallel_workers',cpu],['max_parallel_workers_per_gather',Math.max(1,Math.floor(pw/ (wk==='dw'?1:2)))],['default_statistics_target',wk==='dw'?'500':'100']];
    $('#cf',w).textContent=lines.map(l=>`${l[0].padEnd(33)}= ${l[1]}`).join('\n');
    const os=Math.max(0,R-sb-worst);const seg=[['shared_buffers',sb,'var(--accent)'],[`work_mem worst case (${mc} × ${mb(wm)} × 2 nodes)`,Math.min(worst,R),'var(--warn)'],['OS cache / everything else',os,'var(--good)']];
    $('#mb',w).innerHTML=`<div class="track" style="height:22px;display:flex">${seg.map(s=>`<div style="width:${s[1]/R*100}%;background:${s[2]}"></div>`).join('')}</div>`+seg.map(s=>`<div class="bar"><div><span><i style="display:inline-block;width:10px;height:10px;background:${s[2]};border-radius:2px;margin-right:6px"></i>${s[0]}</span><b class="mono">${mb(s[1])}</b></div></div>`).join('');
    $('#wn',w).innerHTML=worst+sb>R?`<div class="note bad"><b>Over budget.</b> If every connection ran two sort/hash nodes at once, memory would exceed RAM. Lower max_connections (use a pooler) or work_mem.</div>`:`<div class="note good">Worst-case memory fits in RAM, leaving about ${mb(os)} for the OS cache.</div>`}
  $$('input,select',w).forEach(x=>x.oninput=calc);calc();$('#cp',w).onclick=e=>copyText($('#cf',w).textContent,e.target);
}

/* ───────── SQL TOOLKIT ───────── */
function rSql(w,m){
  let tab='join';
  const EM=[[1,'Ana',1],[2,'Ben',1],[3,'Chi',2],[4,'Dev',null]],DP=[[1,'Eng'],[2,'Ops'],[3,'Legal']];
  const SALES=[['East','Ana',100],['East','Ben',150],['East','Cy',150],['West','Di',90],['West','Eli',200],['West','Fay',60]];
  const dc=(a,b)=>{if(a!==null&&typeof a==='object'){if(b===null||typeof b!=='object')return false;if(Array.isArray(a)){return Array.isArray(b)&&b.every(y=>a.some(x=>dc(x,y)))}return !Array.isArray(b)&&Object.keys(b).every(k=>k in a&&dc(a[k],b[k]))}return a===b};
  w.innerHTML=P(m,`<div class="panel stack"><div class="tabs" id="tb">${[['join','JOIN types'],['win','Window functions'],['json','JSONB operators']].map(([k,t])=>`<button data-t="${k}" aria-pressed="${k===tab}">${t}</button>`).join('')}</div><div id="body" class="stack"></div></div>
   <div class="cols"><div class="card"><h3>CTEs</h3><pre>WITH recent AS (\n  SELECT * FROM orders\n  WHERE created_at > now() - interval '7 days'\n)\nSELECT customer_id, sum(total)\nFROM recent GROUP BY 1;</pre></div>
   <div class="card"><h3>UPSERT</h3><pre>INSERT INTO counters (key, n)\nVALUES ('hits', 1)\nON CONFLICT (key)\nDO UPDATE SET n = counters.n + 1\nRETURNING n;</pre></div>
   <div class="card"><h3>Queue worker pattern</h3><pre>SELECT * FROM jobs\nWHERE status = 'new'\nORDER BY id\nLIMIT 1\nFOR UPDATE SKIP LOCKED;</pre></div></div>`,
  ['LEFT JOIN keeps unmatched left rows (with NULLs on the right). FULL keeps both. EXISTS / NOT EXISTS test for presence without multiplying rows.',
   'Window functions compute across related rows without collapsing them like GROUP BY does. With ORDER BY, the default frame includes peer rows with equal values, which is why ties share a running total.',
   'jsonb is stored decomposed and indexable with GIN; json keeps the exact text. Prefer jsonb unless you need to preserve formatting.']);
  function show(){const b=$('#body',w);
    if(tab==='join'){b.innerHTML=`<label class="f">Join type<select id="jt">${[['INNER JOIN','inner'],['LEFT JOIN','left'],['RIGHT JOIN','right'],['FULL OUTER JOIN','full'],['CROSS JOIN','cross'],['WHERE EXISTS (semi join)','semi'],['WHERE NOT EXISTS (anti join)','anti']].map(x=>`<option value="${x[1]}">${x[0]}</option>`).join('')}</select></label>
      <div class="cols"><div class="tw"><table class="t"><tr><th>employees.id</th><th>name</th><th>dept_id</th></tr>${EM.map(e=>`<tr><td>${e[0]}</td><td>${e[1]}</td><td>${e[2]===null?'<span class="null">NULL</span>':e[2]}</td></tr>`).join('')}</table></div>
      <div class="tw"><table class="t"><tr><th>departments.id</th><th>dept</th></tr>${DP.map(d=>`<tr><td>${d[0]}</td><td>${d[1]}</td></tr>`).join('')}</table></div></div><pre id="js"></pre><div class="tw"><table class="t" id="jr"></table></div>`;
      const go=()=>{const t=$('#jt',w).value;let r=[];const nl=v=>v===null?'<span class="null">NULL</span>':v;
        if(t==='inner')EM.forEach(e=>DP.forEach(d=>{if(e[2]===d[0])r.push([e[1],d[1]])}));
        if(t==='left'||t==='full'){EM.forEach(e=>{const d=DP.filter(d=>d[0]===e[2]);if(d.length)d.forEach(x=>r.push([e[1],x[1]]));else r.push([e[1],null])})}
        if(t==='right'||t==='full'){DP.forEach(d=>{const es=EM.filter(e=>e[2]===d[0]);if(!es.length)r.push([null,d[1]]);else if(t==='right')es.forEach(e=>r.push([e[1],d[1]]))})}
        if(t==='cross')EM.forEach(e=>DP.forEach(d=>r.push([e[1],d[1]])));
        if(t==='semi')EM.filter(e=>DP.some(d=>d[0]===e[2])).forEach(e=>r.push([e[1]]));
        if(t==='anti')EM.filter(e=>!DP.some(d=>d[0]===e[2])).forEach(e=>r.push([e[1]]));
        const sem=t==='semi'||t==='anti';
        $('#js',w).textContent=sem?`SELECT e.name FROM employees e\nWHERE ${t==='anti'?'NOT ':''}EXISTS (SELECT 1 FROM departments d WHERE d.id = e.dept_id);`:`SELECT e.name, d.dept\nFROM employees e\n${{inner:'INNER JOIN',left:'LEFT JOIN',right:'RIGHT JOIN',full:'FULL OUTER JOIN',cross:'CROSS JOIN'}[t]} departments d${t==='cross'?';':' ON d.id = e.dept_id;'}`;
        $('#jr',w).innerHTML=`<tr>${sem?'<th>name</th>':'<th>name</th><th>dept</th>'}</tr>`+r.map(x=>`<tr>${x.map(c=>`<td>${nl(c)}</td>`).join('')}</tr>`).join('')+`<tr><td colspan="2" style="color:var(--muted)">${r.length} row${r.length===1?'':'s'}</td></tr>`};
      $('#jt',w).onchange=go;go()}
    if(tab==='win'){b.innerHTML=`<div class="row"><label class="f">Function<select id="wf">${[['row_number','row_number()'],['rank','rank()'],['dense_rank','dense_rank()'],['sum','sum(amount)'],['lag','lag(amount)'],['avg','avg(amount)']].map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('')}</select></label><label style="margin-top:16px"><input type="checkbox" id="pt" checked> PARTITION BY region</label></div><pre id="ws"></pre><div class="tw"><table class="t" id="wr"></table></div>`;
      const go=()=>{const f=$('#wf',w).value,p=$('#pt',w).checked;const rows=SALES.map(r=>({r:r[0],n:r[1],a:r[2]})).sort((x,y)=>p&&x.r!==y.r?(x.r<y.r?-1:1):y.a-x.a);
        const G=new Map();rows.forEach(x=>{const k=p?x.r:'all';(G.get(k)||G.set(k,[]).get(k)).push(x)});
        G.forEach(g=>g.forEach((x,i)=>{const first=g.findIndex(y=>y.a===x.a),last=g.map(y=>y.a).lastIndexOf(x.a);
          x.v={row_number:i+1,rank:first+1,dense_rank:new Set(g.slice(0,i+1).map(y=>y.a)).size,sum:g.slice(0,last+1).reduce((s,y)=>s+y.a,0),lag:i?g[i-1].a:null,avg:+(g.reduce((s,y)=>s+y.a,0)/g.length).toFixed(1)}[f]}));
        const ex={row_number:'row_number()',rank:'rank()',dense_rank:'dense_rank()',sum:'sum(amount)',lag:'lag(amount)',avg:'avg(amount)'}[f];
        $('#ws',w).textContent=`SELECT region, rep, amount,\n       ${ex} OVER (${p?'PARTITION BY region ':''}${f==='avg'?'':'ORDER BY amount DESC'}) AS result\nFROM sales;`;
        $('#wr',w).innerHTML='<tr><th>region</th><th>rep</th><th>amount</th><th>result</th></tr>'+rows.map(x=>`<tr><td>${x.r}</td><td>${x.n}</td><td>${x.a}</td><td><b>${x.v===null?'<span class="null">NULL</span>':x.v}</b></td></tr>`).join('')};
      $('#wf',w).onchange=$('#pt',w).onchange=go;go()}
    if(tab==='json'){b.innerHTML=`<label class="f">jsonb document<textarea id="jd" rows="5">{"user":{"name":"Ada","tags":["db","math"],"address":{"city":"London"}},"active":true,"score":42}</textarea></label>
      <div class="row"><label class="f">Operator<select id="jo"><option value="-&gt;">-&gt;  get as jsonb</option><option value="-&gt;&gt;">-&gt;&gt; get as text</option><option value="#&gt;">#&gt;  path as jsonb</option><option value="@&gt;">@&gt;  contains</option><option value="?">?  key exists</option></select></label>
      <label class="f">Right-hand side<input id="ja" type="text" value="user" style="min-width:240px"></label></div><pre id="jq"></pre><div class="out" id="jx"></div>
      <p style="color:var(--muted);font-size:13.5px">Examples: <code>user</code> with -&gt; | <code>{user,address,city}</code> with #&gt; | <code>{"active":true}</code> with @&gt; | <code>score</code> with ?</p>`;
      const go=()=>{const op=$('#jo',w).value,arg=$('#ja',w).value.trim();let out;try{const doc=JSON.parse($('#jd',w).value);
        if(op==='->'||op==='->>'){const k=/^\d+$/.test(arg)?+arg:arg;const v=doc==null?null:doc[k];out=v===undefined?'NULL':op==='->'?JSON.stringify(v):(typeof v==='object'&&v!==null?JSON.stringify(v):String(v))}
        else if(op==='#>'){const ks=arg.replace(/^\{|\}$/g,'').split(',').map(s=>s.trim());let v=doc;for(const k of ks){v=v==null?undefined:v[k]}out=v===undefined?'NULL':JSON.stringify(v)}
        else if(op==='@>'){out=String(dc(doc,JSON.parse(arg)))}
        else out=String(doc!==null&&typeof doc==='object'&&!Array.isArray(doc)&&arg in doc)}catch(e){out='Invalid JSON: '+e.message}
        $('#jq',w).textContent=`SELECT doc ${op} '${arg}' FROM events;`;$('#jx',w).textContent=out};
      $('#jo',w).onchange=$('#ja',w).oninput=$('#jd',w).oninput=go;go()}}
  $('#tb',w).addEventListener('click',e=>{const t=e.target.closest('[data-t]');if(!t)return;tab=t.dataset.t;$$('#tb button',w).forEach(x=>x.setAttribute('aria-pressed',x===t));show()});show();
}

/* ───────── TOOLBOX ───────── */
function rTool(w,m){
  const T=[
  ['psql','\\l  and  \\c dbname','List databases; connect to one.','\\l'],['psql','\\dt+ / \\d+ table','List tables with sizes; describe a table with indexes and constraints.','\\d+ orders'],['psql','\\x auto','Expanded output when rows are too wide.','\\x auto'],['psql','\\timing','Print query duration.','\\timing on'],['psql','\\watch 2','Re-run the last query every 2 seconds.','\\watch 2'],['psql','\\copy','Client-side CSV import/export.','\\copy orders TO \'orders.csv\' CSV HEADER'],['psql','\\df / \\du / \\dx','List functions, roles, installed extensions.','\\dx'],
  ['Catalog','pg_stat_activity','Who is connected and what they are running, and for how long.','SELECT pid, state, now()-query_start AS age, left(query,80)\nFROM pg_stat_activity WHERE state <> \'idle\' ORDER BY age DESC;'],
  ['Catalog','Who blocks whom','Find sessions waiting on locks and the pids blocking them.','SELECT pid, pg_blocking_pids(pid) AS blocked_by, query\nFROM pg_stat_activity\nWHERE cardinality(pg_blocking_pids(pid)) > 0;'],
  ['Catalog','Table bloat signals','Dead tuples and last vacuum per table.','SELECT relname, n_live_tup, n_dead_tup, last_autovacuum\nFROM pg_stat_user_tables ORDER BY n_dead_tup DESC LIMIT 10;'],
  ['Catalog','Unused indexes','Indexes never scanned since stats reset: candidates to drop.','SELECT relname, indexrelname, idx_scan\nFROM pg_stat_user_indexes WHERE idx_scan = 0;'],
  ['Catalog','Sizes','Human-readable size of a table including indexes and TOAST.','SELECT pg_size_pretty(pg_total_relation_size(\'orders\'));'],
  ['Catalog','Slowest queries','Needs the pg_stat_statements extension.','SELECT calls, mean_exec_time, left(query,80)\nFROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 10;'],
  ['Catalog','Replication lag','On the primary: how far behind each standby is.','SELECT client_addr, state, replay_lag FROM pg_stat_replication;'],
  ['Catalog','Settings','Current value and where it was set.','SELECT name, setting, source FROM pg_settings WHERE name = \'work_mem\';'],
  ['Operate','EXPLAIN ANALYZE','Run the query and show real timings, rows and buffer use.','EXPLAIN (ANALYZE, BUFFERS) SELECT …;'],
  ['Operate','VACUUM / ANALYZE','Reclaim dead rows and refresh planner statistics.','VACUUM (VERBOSE, ANALYZE) orders;'],
  ['Operate','Online index build','Build without blocking writes (slower, cannot run in a transaction).','CREATE INDEX CONCURRENTLY orders_cust_idx ON orders (customer_id);'],
  ['Operate','Cancel a query','Politely cancel, or terminate the whole connection.','SELECT pg_cancel_backend(12345);\nSELECT pg_terminate_backend(12345);'],
  ['Operate','Logical backup','Dump in custom format; restore in parallel.','pg_dump -Fc mydb > mydb.dump\npg_restore -j4 -d mydb mydb.dump'],
  ['Operate','Base backup','Physical copy for replicas and PITR (with WAL archive).','pg_basebackup -D /backup -Fp -Xs -P'],
  ['Operate','Change config live','Writes postgresql.auto.conf; reload without restart if the setting allows.','ALTER SYSTEM SET work_mem = \'32MB\';\nSELECT pg_reload_conf();'],
  ['Operate','Safe migrations','Fail fast instead of queueing behind long transactions.','SET lock_timeout = \'3s\';\nALTER TABLE orders ADD COLUMN note text;'],
  ['Security','Roles and grants','Least privilege: a role per application, grant only what it needs.','CREATE ROLE app LOGIN PASSWORD \'…\';\nGRANT SELECT, INSERT ON orders TO app;'],
  ['Security','Row-level security','Policies filter rows per user, enforced by the server.','ALTER TABLE docs ENABLE ROW LEVEL SECURITY;\nCREATE POLICY own ON docs USING (owner = current_user);'],
  ['Security','pg_hba.conf','Who may connect from where, using which auth method.','hostssl  all  app  10.0.0.0/8  scram-sha-256'],
  ['Extension','pg_stat_statements','Per-query statistics across all sessions.','CREATE EXTENSION pg_stat_statements;'],
  ['Extension','pg_trgm','Trigram similarity and fast LIKE / ILIKE with GIN.','CREATE INDEX ON users USING gin (name gin_trgm_ops);'],
  ['Extension','PostGIS','Geometry, geography, spatial indexes and hundreds of GIS functions.','CREATE EXTENSION postgis;'],
  ['Extension','pgvector','Vector column type and nearest-neighbor indexes for embeddings.','CREATE EXTENSION vector;\nCREATE INDEX ON items USING hnsw (embedding vector_cosine_ops);'],
  ['Extension','TimescaleDB','Time-series hypertables, compression and continuous aggregates.','SELECT create_hypertable(\'metrics\', \'ts\');'],
  ['Extension','postgres_fdw','Query tables in another Postgres server as if local.','CREATE SERVER s FOREIGN DATA WRAPPER postgres_fdw OPTIONS (host \'h\', dbname \'d\');'],
  ['Extension','pg_cron','Run SQL on a schedule inside the database.','SELECT cron.schedule(\'0 3 * * *\', \'VACUUM ANALYZE orders\');'],
  ['Feature','Generated columns','Computed and stored automatically.','ALTER TABLE items ADD total numeric GENERATED ALWAYS AS (qty * price) STORED;'],
  ['Feature','LISTEN / NOTIFY','Lightweight pub/sub between sessions.','LISTEN jobs;\nNOTIFY jobs, \'new\';'],
  ['Feature','Materialized view','Stored query result you refresh on demand.','CREATE MATERIALIZED VIEW daily AS SELECT …;\nREFRESH MATERIALIZED VIEW CONCURRENTLY daily;'],
  ['Feature','Transactional DDL','Schema changes roll back too. Rare among databases.','BEGIN;\nALTER TABLE t ADD c int;\nROLLBACK;'],
  ['Feature','Arrays and ranges','First-class types with operators and indexes.','SELECT ARRAY[1,2,3] @> ARRAY[2];\nSELECT daterange(\'2025-01-01\',\'2025-02-01\') @> DATE \'2025-01-15\';']];
  const cats=['All',...new Set(T.map(t=>t[0]))];let cat='All';
  w.innerHTML=P(m,`<div class="panel stack"><div class="row"><input id="fq" type="text" placeholder="Search tools, views, extensions…" style="min-width:240px;flex:1" aria-label="Search"><div class="tabs" id="ct">${cats.map(c=>`<button data-c="${c}" aria-pressed="${c===cat}">${c}</button>`).join('')}</div></div><div class="cards" id="cd"></div></div>`,
  ['Postgres exposes almost everything as queryable views (pg_stat_*, pg_locks, pg_settings). When something is wrong, query the catalog first.',
   'Extensions are the ecosystem: search, GIS, vectors, time series, scheduling and foreign data all plug in with CREATE EXTENSION.']);
  function draw(){const q=$('#fq',w).value.toLowerCase();const items=T.filter(t=>(cat==='All'||t[0]===cat)&&(t[1]+t[2]+t[3]).toLowerCase().includes(q));
    $('#cd',w).innerHTML=items.map((t,i)=>`<div class="card"><span class="tag acc" style="justify-self:start">${t[0]}</span><h3>${esc(t[1])}</h3><p>${esc(t[2])}</p><pre>${esc(t[3])}</pre><button class="btn sm" data-i="${T.indexOf(t)}" style="justify-self:start">Copy</button></div>`).join('')||'<p class="null">No match.</p>'}
  draw();$('#fq',w).oninput=draw;
  w.addEventListener('click',e=>{const c=e.target.closest('[data-c]');if(c){cat=c.dataset.c;$$('#ct button',w).forEach(x=>x.setAttribute('aria-pressed',x===c));draw();return}
    const b=e.target.closest('button[data-i]');if(b)copyText(T[+b.dataset.i][3],b)});
}

/* ───────── QUIZ ───────── */
function rQuiz(w,m){
  const Q=[['What does an UPDATE do to a row on disk?',['Overwrites it in place','Writes a new row version and marks the old one dead','Moves it to the WAL','Locks the whole table'],1,'MVCC: the old version gets xmax set, a new version is written. VACUUM removes dead versions later.'],
  ['At COMMIT, what must reach disk before the client is told "success" (default settings)?',['All modified data pages','The modified indexes','The WAL records up to the commit','A full checkpoint'],2,'Only the sequential WAL flush. Data pages are written lazily.'],
  ['Which isolation level gives a fresh snapshot for every statement?',['Read Committed','Repeatable Read','Serializable','Read Uncommitted'],0,'Read Committed (the default) re-snapshots per statement, so repeated reads can differ.'],
  ['You filter on a column but the planner ignores your index. Most likely reason?',['Indexes only work on primary keys','The query returns a large share of the table','The table has too few columns','Postgres never uses indexes for text'],1,'When a big fraction of rows match, a sequential scan is cheaper than many random heap reads.'],
  ['Which index suits "tags @> ARRAY[\'sql\']" or jsonb containment?',['B-tree','Hash','GIN','BRIN'],2,'GIN is an inverted index for composite values: arrays, jsonb and full-text.'],
  ['Why can ALTER TABLE freeze an entire busy table?',['It rewrites WAL','It needs ACCESS EXCLUSIVE and queues behind running queries, blocking all new ones','It disables autovacuum','It drops the indexes first'],1,'Lock queueing: once the ALTER waits, every later query waits behind it. Use lock_timeout.'],
  ['Async streaming replication: the primary dies. What can happen?',['Nothing, replicas are always identical','Recently acknowledged commits may be missing on the standby','The standby corrupts','The WAL is replayed backwards'],1,'Async acknowledges before the standby has the record. Synchronous replication closes that gap at a latency cost.'],
  ['What is partition pruning?',['Deleting old partitions','Skipping partitions that cannot match the WHERE clause','Compressing partitions','Merging partitions'],1,'The planner (or executor) excludes partitions whose bounds contradict the filter on the partition key.'],
  ['Which join algorithm builds an in-memory hash table from one input?',['Nested loop','Merge join','Hash join','Index join'],2,'Hash join. It is limited by work_mem and spills to disk in batches if the table is too large.'],
  ['What does autovacuum NOT do?',['Remove dead tuples','Update planner statistics','Roll back long transactions','Prevent transaction ID wraparound'],2,'It cleans and analyzes, but never kills transactions. Long-running transactions actually hold back vacuum.']];
  let score=0,answered=new Array(Q.length).fill(null);
  function draw(){const n=answered.filter(x=>x!==null).length;
    $('#qz',w).innerHTML=Q.map((q,i)=>`<div class="panel"><h3 style="font-size:15px">${i+1}. ${esc(q[0])}</h3>${q[1].map((o,j)=>`<button class="opt ${answered[i]!==null?(j===q[2]?'right':j===answered[i]?'wrong':''):''}" data-q="${i}" data-o="${j}" ${answered[i]!==null?'disabled':''}>${esc(o)}</button>`).join('')}${answered[i]!==null?`<div class="note ${answered[i]===q[2]?'good':'warn'}" style="margin-top:8px">${answered[i]===q[2]?'Correct. ':'Not quite. '}${esc(q[3])}</div>`:''}</div>`).join('');
    $('#sc',w).textContent=`${answered.filter((a,i)=>a===Q[i][2]).length} / ${Q.length} correct · ${n} answered`}
  w.innerHTML=P(m,`<div class="row"><span class="tag acc" id="sc" style="font-size:14px"></span><button class="btn sm" id="rs">Restart</button></div><div class="stack" id="qz"></div>`,null);
  draw();w.addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b){answered[+b.dataset.q]=+b.dataset.o;draw()}if(e.target.id==='rs'){answered.fill(null);draw()}});
}
