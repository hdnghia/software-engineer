<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: persistent left index of 16 modules; each module is one hands-on simulator + a short "remember this" list. */
:root{
  --bg:#f1f4f8;--surface:#ffffff;--surface2:#e8eef5;--ink:#122033;--muted:#55657a;--line:#d3dce7;
  --accent:#2a68a3;--accent-ink:#ffffff;--accent-soft:#d9e8f6;
  --good:#1b7e54;--good-soft:#d6efe2;--warn:#9a5f08;--warn-soft:#fae9cc;--bad:#b3372b;--bad-soft:#f8dbd7;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1520;--surface:#142130;--surface2:#1b2d41;--ink:#e5edf6;--muted:#93a5ba;--line:#273b52;
  --accent:#6fb0ea;--accent-ink:#08121d;--accent-soft:#1c3552;
  --good:#58c796;--good-soft:#173a2d;--warn:#e2a94f;--warn-soft:#3d2f14;--bad:#f0877b;--bad-soft:#41201c;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1520;--surface:#142130;--surface2:#1b2d41;--ink:#e5edf6;--muted:#93a5ba;--line:#273b52;
  --accent:#6fb0ea;--accent-ink:#08121d;--accent-soft:#1c3552;
  --good:#58c796;--good-soft:#173a2d;--warn:#e2a94f;--warn-soft:#3d2f14;--bad:#f0877b;--bad-soft:#41201c;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
pre{margin:0;background:var(--surface2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;overflow-x:auto;white-space:pre;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:262px minmax(0,1fr);min-height:100vh}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand b{font:700 20px var(--display)}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 16px var(--display)}
.grp{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:16px 8px 4px}
.nav a{display:block;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.theme{margin-top:18px;width:100%}
.mbar{display:none}
.main{padding:28px 32px 60px;padding-right:max(32px,env(safe-area-inset-right,0px));min-width:0;max-width:1100px}
.ph{margin-bottom:20px;display:grid;gap:8px}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.ph h1{font-size:34px}
.lead{color:var(--muted);max-width:68ch;font-size:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel>h3{font-size:16px;margin-bottom:10px}
.stack{display:grid;gap:14px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:3px 9px;font-size:13px}
select,input[type=text],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-width:100%}
textarea{width:100%;font-family:var(--mono);font-size:12.5px}
label.f{display:grid;gap:3px;font-size:13px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent)}
.tag{display:inline-block;padding:1px 8px;border-radius:99px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)}.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.acc{background:var(--accent-soft);color:var(--accent)}
.tw{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
table.t tr.sel td{background:var(--accent-soft)}
table.t tr.dead td{color:var(--bad)}
table.t tr.hl td{background:var(--warn-soft)}
table.t tr.ok td{background:var(--good-soft)}
.null{color:var(--muted);font-style:italic}
.note{background:var(--accent-soft);border-radius:8px;padding:10px 12px;font-size:14px}
.note.warn{background:var(--warn-soft)}.note.bad{background:var(--bad-soft)}.note.good{background:var(--good-soft)}
.take{margin-top:24px;border-top:2px solid var(--ink);padding-top:12px}
.take h3{font-size:15px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
.take ul{margin:0;padding-left:20px;display:grid;gap:5px;max-width:78ch}
.pn{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.pn a{color:var(--accent);text-decoration:none;font-weight:600}
.log{font-family:var(--mono);font-size:12px;background:var(--surface2);border-radius:6px;padding:8px 10px;max-height:160px;overflow:auto;display:grid;gap:2px;min-height:44px}
.log div:first-child{color:var(--ink);font-weight:500}.log div{color:var(--muted)}
.kpi{display:flex;gap:18px;flex-wrap:wrap}
.kpi div{display:grid}.kpi b{font:700 22px var(--display);font-variant-numeric:tabular-nums}.kpi span{font-size:12px;color:var(--muted)}
.cards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;text-decoration:none;color:var(--ink);display:grid;gap:4px;align-content:start}
a.card:hover{border-color:var(--accent)}
.card h3{font-size:16px}.card p{color:var(--muted);font-size:13.5px}
/* architecture */
.arch{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr))}
.zone{background:var(--surface2);border-radius:10px;padding:10px;display:grid;gap:8px;align-content:start}
.zone>h4{margin:0;font:600 11px var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.node{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;font-size:13.5px;transition:.2s}
.node:hover{border-color:var(--accent)}
.node.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:translateX(2px)}
.node.pick{outline:2px solid var(--accent)}
/* heap */
.page{display:flex;height:46px;border:1px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--surface)}
.page>div{min-width:2px;font-size:10px;display:grid;place-items:center;overflow:hidden;border-right:1px solid var(--surface)}
.seg-h{background:var(--ink);color:var(--surface)}.seg-i{background:var(--warn)}.seg-f{background:repeating-linear-gradient(45deg,transparent 0 6px,var(--surface2) 6px 12px)}
.seg-l{background:var(--accent);color:var(--accent-ink)}.seg-d{background:var(--bad);color:#fff}.seg-t{background:var(--good);color:#fff}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
/* mvcc */
.sess{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:8px;align-content:start;background:var(--surface)}
.sess h3{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.out{min-height:38px;font-family:var(--mono);font-size:12.5px;background:var(--surface2);padding:8px;border-radius:6px;white-space:pre-wrap}
/* btree */
.tree{display:grid;gap:18px;overflow-x:auto;padding:6px 2px 10px}
.lvl{display:flex;gap:10px;justify-content:center;min-width:max-content}
.bn{display:flex;border:1.5px solid var(--ink);border-radius:6px;background:var(--surface);transition:.25s}
.bn span{padding:4px 8px;font-family:var(--mono);font-size:13px;border-right:1px solid var(--line);min-width:30px;text-align:center}
.bn span:last-child{border-right:0}
.bn.leaf{border-color:var(--accent)}
.bn.leaf+.bn.leaf{position:relative;margin-left:8px}
.bn.leaf+.bn.leaf::before{content:"→";position:absolute;left:-15px;top:3px;color:var(--accent)}
.bn.on{background:var(--warn-soft);border-color:var(--warn)}
.bn span.hit{background:var(--good);color:#fff}.bn span.miss{background:var(--bad);color:#fff}
/* bars */
.bars{display:grid;gap:10px}
.bar{display:grid;gap:3px}
.bar>div:first-child{display:flex;justify-content:space-between;font-size:13px;gap:8px}
.track{height:14px;background:var(--surface2);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--muted);transition:width .3s}.fill.best{background:var(--good)}
/* locks */
.mx{border-collapse:separate;border-spacing:3px;font-size:12px}
.mx th{font-weight:500;color:var(--muted);padding:2px 4px;text-align:left;max-width:90px}
.mx td{width:30px;height:28px;text-align:center;border-radius:4px;background:var(--good-soft);color:var(--good);font-weight:700}
.mx td.x{background:var(--bad-soft);color:var(--bad)}
.mx td.cur{outline:2px solid var(--ink)}
/* wal / repl */
.cell{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:6px;font:500 12px var(--mono);border:1px solid var(--line);background:var(--surface)}
.rec{display:flex;gap:8px;align-items:center;font:12px var(--mono);padding:2px 6px;border-radius:4px}
.rec.ram{background:var(--warn-soft)}.rec.old{opacity:.5}
.sq{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:5px;font:500 11px var(--mono);margin:2px;border:1.5px solid var(--line)}
.sq.good{background:var(--good);color:#fff;border-color:var(--good)}.sq.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}.sq.wait{border-style:dashed}
.part{border:1.5px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:12.5px;background:var(--surface);transition:.25s}
.part.scan{background:var(--warn-soft);border-color:var(--warn)}.part.skip{opacity:.4}
.pgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(88px,1fr))}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 12px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt{display:block;width:100%;text-align:left;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good)}.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.pipe{display:flex;gap:6px;flex-wrap:wrap}
.pipe span{padding:5px 11px;border-radius:99px;border:1px solid var(--line);font-size:13px;background:var(--surface);color:var(--muted)}
.pipe span.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.pipe span.done{color:var(--ink);border-color:var(--accent)}
@media (max-width:900px){
  .app{display:block}
  .side{position:static;max-height:none;border-right:0;display:none;padding-right:max(14px,env(safe-area-inset-right,0px))}
  .side.open{display:block}
  .mbar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:env(safe-area-inset-top,0px);background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));z-index:20}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) 50px max(16px,env(safe-area-inset-left,0px))}
  .ph h1{font-size:28px}
  .arch{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="mbar"><div class="brand" style="margin:0"><span class="logo">Pg</span><b>Postgres Atlas</b></div><button class="btn" id="menu" aria-expanded="false">Modules</button></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><span class="logo">Pg</span><b>Postgres Atlas</b></div>
    <nav class="nav" id="nav"></nav>
    <button class="btn theme" id="theme">Theme: auto</button>
  </aside>
  <main class="main"><div id="view"></div></main>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n>=1e9?(n/1e9).toFixed(1)+'B':n>=1e6?(n/1e6).toFixed(n>=1e7?0:1)+'M':n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+'K':String(Math.round(n));
const num=n=>Number(n).toLocaleString('en-US',{maximumFractionDigits:2});
let cleanups=[];const onLeave=f=>cleanups.push(f);
function copyText(t,btn){const o=btn.textContent;const done=m=>{btn.textContent=m;setTimeout(()=>btn.textContent=o,1200)};
  try{navigator.clipboard.writeText(t).then(()=>done('Copied'),()=>done('Select & copy'))}catch(e){done('Select & copy')}}
function player(n,show,ms){let i=-1,t=null;const stop=()=>{if(t){clearInterval(t);t=null}};
  const api={next(){if(i<n-1){i++;show(i);return true}return false},prev(){if(i>0){i--;show(i)}},reset(){stop();i=-1;show(-1)},
    play(){stop();if(i>=n-1)api.reset();t=setInterval(()=>{if(!api.next())stop()},ms)},stop,get i(){return i}};onLeave(stop);return api}
const ctl=()=>`<div class="row"><button class="btn" data-p="prev">◀ Back</button><button class="btn primary" data-p="next">Next step ▶</button><button class="btn" data-p="play">Autoplay</button><button class="btn" data-p="reset">Reset</button></div>`;
function bindCtl(w,api){w.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;const a=b.dataset.p;if(a==='next'){api.stop();api.next()}else if(a==='prev'){api.stop();api.prev()}else api[a]()})}
function P(m,body,take){const i=MODS.findIndex(x=>x.id===m.id),pv=MODS[i-1],nx=MODS[i+1];
  return `<header class="ph"><div class="eyebrow">${m.group}</div><h1>${m.title}</h1><p class="lead">${m.lead}</p></header><div class="stack">${body}</div>
  ${take?`<section class="take"><h3>Remember this</h3><ul>${take.map(t=>`<li>${t}</li>`).join('')}</ul></section>`:''}
  <div class="pn"><span>${pv?`<a href="#${pv.id}">← ${pv.title}</a>`:''}</span><span>${nx?`<a href="#${nx.id}">${nx.title} →</a>`:''}</span></div>`}
const logHTML=a=>a.slice(0,8).map(x=>`<div>${esc(x)}</div>`).join('')||'<div>Nothing yet. Press a button.</div>';

/* ───────── HOME ───────── */
function rHome(w,m){
  const layers=[['Connect','architecture','Clients, the postmaster, one process per connection, shared memory.'],
  ['Understand the query','lifecycle','Parse, analyze, rewrite, plan, execute.'],
  ['Store the data','heap','8 KB pages, tuples, TOAST, dead rows and VACUUM.'],
  ['Keep it consistent','mvcc','Snapshots and isolation levels without readers blocking writers.'],
  ['Find it fast','indexes','B-tree and friends, and when each one wins.'],
  ['Choose a strategy','planner','Cost-based planning and how EXPLAIN reads.'],
  ['Combine tables','joins','Nested loop, hash and merge joins, step by step.'],
  ['Survive crashes','wal','Write-ahead log, checkpoints and recovery.'],
  ['Coordinate writers','locks','Table lock modes and why ALTER TABLE hangs.'],
  ['Stay available','replication','Streaming replicas, sync vs async, failover.'],
  ['Grow','partitioning','Splitting big tables and pruning.'],
  ['Run it well','tuning','Memory and planner settings from your hardware.'],
  ['Write good SQL','sql','Joins, window functions, JSONB operators.'],
  ['Know the tools','toolbox','psql, system views, extensions, security.'],
  ['Check yourself','quiz','Ten questions across everything above.']];
  w.innerHTML=`<header class="ph"><div class="eyebrow">Interactive guide</div><h1>PostgreSQL, from the socket to the disk</h1>
  <p class="lead">Every module has a small simulator. Click, break things, crash the server, and watch what Postgres does. Follow the path in order or jump to what you need.</p></header>
  <div class="panel"><h3>PostgreSQL in one paragraph</h3><p style="max-width:75ch">PostgreSQL is an open-source relational database that stores rows in fixed 8 KB pages, never overwrites a row in place (it writes a new version, which is why readers and writers do not block each other), and logs every change to a write-ahead log before it touches the data files (which is why it survives crashes and can feed replicas). A cost-based planner picks the cheapest way to answer each query using statistics about your data.</p></div>
  <div class="cards">${layers.map((l,i)=>`<a class="card" href="#${l[1]}"><span class="tag acc" style="justify-self:start">${i+1}. ${l[0]}</span><h3>${MODS.find(x=>x.id===l[1]).title}</h3><p>${l[2]}</p></a>`).join('')}</div>`;
}

/* ───────── ARCHITECTURE ───────── */
function rArch(w,m){
  const N={client:['Client application','psql, your app, or a pooler such as PgBouncer. Talks the frontend/backend protocol over TCP (port 5432) or a Unix socket.'],
  postmaster:['Postmaster','The first process. Listens for connections, checks pg_hba.conf, authenticates, then forks a backend. If a child crashes, it restarts the server to protect shared memory.'],
  backend:['Backend process','One OS process per connection. Parses, plans and executes your SQL. Private memory: work_mem for sorts and hashes, temp_buffers for temp tables.'],
  shbuf:['shared_buffers','Cache of 8 KB table and index pages shared by every backend. Reads look here first. Writes change the page here and mark it dirty. Typical size: about 25% of RAM.'],
  walbuf:['WAL buffers','Small RAM staging area for write-ahead log records before they are flushed to disk.'],
  lock:['Lock table and commit status','Shared state: heavyweight locks, and the commit/abort status of every transaction (pg_xact), which MVCC visibility checks consult.'],
  ckpt:['Checkpointer','Periodically writes all dirty pages to disk and records a checkpoint in the WAL. This bounds how much WAL a crash recovery must replay.'],
  bgw:['Background writer','Trickles dirty pages to disk between checkpoints so backends rarely have to wait for a clean buffer.'],
  walw:['WAL writer','Flushes WAL buffers regularly (about every 200 ms), so even asynchronous commits reach disk quickly.'],
  av:['Autovacuum','A launcher and workers that remove dead row versions, refresh the visibility map and statistics, and prevent transaction ID wraparound.'],
  wals:['WAL sender / archiver','walsender streams WAL to replicas. The archiver copies completed WAL segments to storage for point-in-time recovery.'],
  data:['Data files','The base/ directory: one file per table or index, split into 1 GB segments made of 8 KB pages.'],
  walf:['WAL files','pg_wal/: 16 MB sequential segments. fsynced at commit. The source of durability and of replication.']};
  const MAXC=5;let clients=1,pick='postmaster';
  const traces={write:[
   [['client','postmaster','backend'],'Connect. The postmaster authenticates the client and forks a backend (a pooler skips this by reusing one).'],
   [['client','backend'],'UPDATE arrives at the backend, which parses, plans and executes it.'],
   [['backend','shbuf'],'The target page is read into shared_buffers (from disk if not cached) and the new row version is written there. The page is now dirty.'],
   [['backend','walbuf'],'A WAL record describing the change is written to WAL buffers. Rule: log first, data later.'],
   [['backend','walf'],'COMMIT. The WAL is flushed and fsynced to pg_wal, and only then does the client see "COMMIT". The data file has not changed yet.'],
   [['bgw','ckpt','data'],'Later, the background writer or checkpointer writes the dirty page to the data file. A crash before this is harmless: the WAL replays the change.'],
   [['av','wals'],'Autovacuum eventually cleans the old version. A walsender streams the WAL record to any replica.']],
  read:[
   [['client','backend'],'SELECT arrives at an existing backend.'],
   [['backend','shbuf'],'The executor asks shared_buffers for the page. Cache hit: it is returned from RAM, nothing else happens.'],
   [['shbuf','data'],'Cache miss: the page is read from the data file (or the OS page cache) into shared_buffers, evicting a clean page by clock-sweep.'],
   [['backend','lock'],'For each row version, the backend checks commit status to decide whether the row is visible to its snapshot.'],
   [['client','backend'],'Rows are sent to the client. No WAL was written and no locks block writers.']]};
  w.innerHTML=P(m,`
  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div class="row">
    <label class="f" style="display:flex;gap:6px;align-items:center">Trace a <select id="tr"><option value="write">write (UPDATE + COMMIT)</option><option value="read">read (SELECT)</option></select></label>
    </div><span class="tag acc" id="cnt"></span></div>
    <div class="arch">
      <div class="zone"><h4>Clients</h4><div id="clients" class="stack" style="gap:6px"></div>
        <div class="row"><button class="btn sm" id="addc">+ Connect</button><button class="btn sm" id="rmc">− Disconnect</button></div></div>

        <button class="node" data-n="walw">WAL writer</button><button class="node" data-n="av">Autovacuum</button><button class="node" data-n="wals">WAL sender / archiver</button></div>
      <div class="zone"><h4>Shared memory</h4><button class="node" data-n="shbuf">shared_buffers</button><button class="node" data-n="walbuf">WAL buffers</button><button class="node" data-n="lock">Locks + commit status</button></div>

    </div></div>
  <div class="cols"><div class="panel"><h3 id="dt"></h3><p id="dd"></p></div>
  <div class="panel"><h3>Trace</h3><p id="ti" style="margin-bottom:10px;min-height:66px">Press Next step to follow one operation through the system.</p>${ctl()}</div></div>`,
  ['Postgres is process-per-connection. Connections are expensive, so use a pooler (PgBouncer) once you have hundreds of clients.',
   'Shared memory (shared_buffers, WAL buffers, lock and commit state) is how backends cooperate.',

  function mk(){const t=traces[q('#tr').value];api=player(t.length,i=>{const ids=i<0?[]:t[i][0];
    $$('.node',w).forEach(n=>n.classList.toggle('on',ids.includes(n.dataset.n)));
    q('#ti').textContent=i<0?'Press Next step to follow one operation through the system.':t[i][1]},1800);
    q('#ti').textContent='Press Next step to follow one operation through the system.'}
  w.addEventListener('click',e=>{const n=e.target.closest('.node');if(n)setPick(n.dataset.n);
    if(e.target.id==='addc'){if(clients>=MAXC){q('#dd').innerHTML='<b style="color:var(--bad)">FATAL: sorry, too many clients already.</b> Each connection is a process. Raise max_connections carefully, or put PgBouncer in front.';q('#dt').textContent='Connection refused'}else{clients++;drawClients()}}

/* ───────── LIFECYCLE ───────── */
function rLife(w,m){
  const ST=[['Parse','Text becomes a raw parse tree. Only syntax is checked here; table names are not looked up yet.'],
   ['Analyze','Names are resolved against the system catalogs, types are checked, functions and operators are chosen, permissions verified.'],
   ['Rewrite','Rules and views are expanded; row-level security policies are added as extra conditions.'],
   ['Plan','The planner generates candidate paths, estimates cost from table statistics, and keeps the cheapest.'],
   ['Execute','The executor runs the plan tree top-down; each node pulls rows from its children one at a time.'],
   ['Return','Rows (or a command tag) go back to the client over the wire protocol.']];
  const Q=[{s:'SELECT name FROM users WHERE id = 42;',o:[
   'SelectStmt\n  targetList: [ColumnRef name]\n  fromClause: [RangeVar users]\n  whereClause: A_Expr(=) ColumnRef id, Const 42',
   'users   → pg_class OID 16402\nname    → attno 2, type text\nid      → attno 1, type int4\n42      → int4 constant, operator int4eq chosen',
   'No rules or views involved. Query tree unchanged.\n(If users were a view, its definition would be substituted here.)',
   'Index Scan using users_pkey on users  (cost=0.29..8.30 rows=1 width=32)\n  Index Cond: (id = 42)',
   '1. B-tree descent in users_pkey → TID (7,3)\n2. Fetch heap page 7 through shared_buffers\n3. MVCC check: is tuple (7,3) visible to my snapshot?\n4. Project the column "name"',
   ' name\n--------------\n Ada Lovelace\n(1 row)']},
  {s:'SELECT u.name, count(*) FROM users u JOIN orders o ON o.user_id = u.id GROUP BY u.name;',o:[
   'SelectStmt\n  targetList: [u.name, count(*)]\n  fromClause: JoinExpr(users u, orders o) ON o.user_id = u.id\n  groupClause: [u.name]',
   'Aliases u and o resolved to pg_class entries\ncount(*) → aggregate count("any")\nGROUP BY covers every non-aggregated column',
   'No rules. With row-level security on, each table would get its policy expression added here.',
   'HashAggregate  (cost=2791.00..2891.00 rows=10000)\n  Group Key: u.name\n  -> Hash Join  (cost=290.00..2541.00 rows=100000)\n       Hash Cond: (o.user_id = u.id)\n       -> Seq Scan on orders o\n       -> Hash\n            -> Seq Scan on users u',
   '1. Scan users, build an in-memory hash table on id (uses work_mem)\n2. Scan orders, probe the hash table for every row\n3. Feed matches to HashAggregate: one counter per name\n4. Emit one row per group',
   ' name         | count\n--------------+-------\n Ada Lovelace |    12\n Grace Hopper |     7\n ... (10000 rows)']},
  {s:'UPDATE accounts SET balance = balance - 50 WHERE id = 1;',o:[
   'UpdateStmt\n  relation: accounts\n  targetList: balance = (balance - 50)\n  whereClause: id = 1',
   'accounts.balance → numeric, expression type-checked\nPermission check: UPDATE on accounts, SELECT on balance',
   'Nothing to rewrite here (triggers are not rewrites). RLS policies and rules would be applied now.',
   'Update on accounts  (cost=0.15..8.17 rows=1)\n  -> Index Scan using accounts_pkey on accounts\n       Index Cond: (id = 1)',
   '1. Find the current row version through the index\n2. Lock it: set its xmax to my transaction ID\n3. Insert a NEW version with balance - 50 (same page if room: a HOT update)\n4. Write a WAL record\n5. Run AFTER triggers, if any',
   'UPDATE 1\n(other sessions see the change only after COMMIT)']}];
  w.innerHTML=P(m,`<div class="panel stack"><div class="row"><label class="f">Query<select id="q">${Q.map((x,i)=>`<option value="${i}">${esc(x.s)}</option>`).join('')}</select></label></div>
  <pre id="sql"></pre><div class="pipe" id="pp">${ST.map(s=>`<span>${s[0]}</span>`).join('')}</div>
  <p id="what" style="min-height:44px;color:var(--muted)">Step through the stages to see what each one produces for this query.</p><pre id="o" style="min-height:96px">—</pre>${ctl()}</div>`,
  ['Parsing is pure syntax. Analysis is where "relation does not exist" and type errors come from.',
   'The planner never runs your query. It estimates with statistics, so stale statistics (run ANALYZE) mean bad plans.',
   'Every query, even a SELECT, goes through all six stages. Prepared statements skip parse and sometimes plan on reuse.']);
  const q=s=>$(s,w);let api;
  function mk(){const qi=+q('#q').value;q('#sql').textContent=Q[qi].s;
    api=player(6,i=>{$$('#pp span',w).forEach((s,j)=>s.className=j===i?'on':j<i?'done':'');
      q('#what').textContent=i<0?'Step through the stages to see what each one produces for this query.':ST[i][1];q('#o').textContent=i<0?'—':Q[qi].o[i]},1800);api.reset()}
  q('#q').onchange=()=>{api.stop();mk()};mk();bindCtl(w,{next:()=>api.next(),prev:()=>api.prev(),reset:()=>api.reset(),play:()=>api.play(),stop:()=>api.stop()});
}

/* ───────── HEAP PAGE ───────── */
function rHeap(w,m){
  const NAMES=['Ada','Ben','Chi','Dev','Eli','Fay','Gus','Hana','Ivo','Jun'];let S,sel=null;
  const init=()=>{S={slots:[],tx:100,log:[],pagesFull:false};sel=null;for(let i=0;i<3;i++)ins(70+i*12,true);S.log=[]};
  const used=()=>24+4*S.slots.length+S.slots.reduce((a,t)=>a+(t?t.sz:0),0);
  function ins(sz,quiet,name){const toast=sz>2000;const real=toast?24:sz;const need=real+(S.slots.includes(null)?0:4);
    if(used()+need>8192){S.log.unshift('Page is full (8192 B). Postgres would add a new 8 KB page to the table file.');return null}
    const t={sz:real,xmin:++S.tx,xmax:0,name:name||NAMES[Math.floor(Math.random()*NAMES.length)],toast:toast,raw:sz};
    const free=S.slots.indexOf(null);if(free>=0)S.slots[free]=t;else S.slots.push(t);
    if(!quiet)S.log.unshift(toast?`INSERT ${sz} B value: too big for a page, TOASTed. Only a 24 B tuple with a pointer stays on this page.`:`INSERT: new tuple of ${sz} B at line pointer ${S.slots.indexOf(t)+1}, xmin=${t.xmin}.`);return t}
  const live=t=>t&&t.xmax===0;
  function draw(){const U=used();const segs=[`<div class="seg-h" style="flex:24" title="Header 24 B"></div>`];
    if(S.slots.length)segs.push(`<div class="seg-i" style="flex:${4*S.slots.length}" title="Line pointers ${4*S.slots.length} B"></div>`);
    segs.push(`<div class="seg-f" style="flex:${8192-U}" title="Free ${8192-U} B"></div>`);
    for(let i=S.slots.length-1;i>=0;i--){const t=S.slots[i];if(t)segs.push(`<div class="${t.toast?'seg-t':live(t)?'seg-l':'seg-d'}" style="flex:${t.sz}" title="(0,${i+1}) ${t.sz} B">${t.sz>200?i+1:''}</div>`)}
    const dead=S.slots.filter(t=>t&&!live(t)).length,rows=S.slots.filter(live).length;
    $('#pg',w).innerHTML=segs.join('');
    $('#kp',w).innerHTML=`<div><b>${8192-U}</b><span>free bytes</span></div><div><b>${rows}</b><span>live rows</span></div><div><b>${dead}</b><span>dead versions</span></div><div><b>${S.slots.length}</b><span>line pointers</span></div>`;
    $('#tb',w).innerHTML=S.slots.map((t,i)=>t?`<tr data-i="${i}" class="${!live(t)?'dead':''} ${sel===i?'sel':''}"><td>(0,${i+1})</td><td>${esc(t.name)}${t.toast?' <span class="tag good">TOAST ptr</span>':''}</td><td>${t.xmin}</td><td>${t.xmax||'—'}</td><td>${t.toast?t.raw+' → 24':t.sz} B</td><td>${live(t)?'<span class="tag good">live</span>':'<span class="tag bad">dead</span>'}</td></tr>`
      :`<tr><td>(0,${i+1})</td><td colspan="5" class="null">unused line pointer, can be reused</td></tr>`).join('');
    $('#lg',w).innerHTML=logHTML(S.log);
    const r=+$('#ar',w).value;$('#av',w).textContent=`Autovacuum fires when dead tuples exceed 50 + 0.2 × ${fmt(r)} = ${fmt(50+0.2*r)} rows`}
  w.innerHTML=P(m,`<div class="panel stack"><div class="kpi" id="kp"></div><div class="page" id="pg"></div>
   <div class="legend"><span><i style="background:var(--ink)"></i>page header</span><span><i style="background:var(--warn)"></i>line pointers (grow →)</span><span><i style="background:var(--surface2);border:1px solid var(--line)"></i>free space</span><span><i style="background:var(--accent)"></i>live tuple</span><span><i style="background:var(--bad)"></i>dead tuple</span><span><i style="background:var(--good)"></i>TOAST pointer</span><span>tuples grow ← from the end</span></div>
   <div class="row"><button class="btn primary" data-a="ins">INSERT row</button><button class="btn" data-a="big">INSERT 5 KB value</button><button class="btn" data-a="upd">UPDATE selected</button><button class="btn danger" data-a="del">DELETE selected</button><button class="btn" data-a="vac">VACUUM</button><button class="btn" data-a="reset">Reset</button></div>
   <div class="tw"><table class="t"><thead><tr><th>ctid</th><th>row</th><th>xmin</th><th>xmax</th><th>size</th><th>state</th></tr></thead><tbody id="tb"></tbody></table></div>
   <div class="log" id="lg"></div></div>
   <div class="cols"><div class="panel"><h3>Autovacuum threshold</h3><label class="f">Rows in table <input id="ar" type="number" value="100000" min="0"></label><p id="av" style="margin-top:8px"></p><p style="margin-top:6px;color:var(--muted);font-size:13.5px">Controlled by autovacuum_vacuum_threshold (50) and autovacuum_vacuum_scale_factor (0.2). Lower the scale factor for very large, hot tables.</p></div>
   <div class="panel"><h3>Try this</h3><ol style="margin:0;padding-left:18px;display:grid;gap:4px"><li>Click a row, press UPDATE twice. Watch old versions pile up as dead.</li><li>Press VACUUM. Dead space is reclaimed, line pointers become reusable.</li><li>Insert the 5 KB value: the page barely grows.</li></ol></div></div>`,
  ['An UPDATE never edits a row in place. It marks the old version dead (sets xmax) and writes a new version. A DELETE only sets xmax.',
   'Dead versions keep taking space until VACUUM removes them. Heavy updates without vacuum cause table bloat.',
   'Values over about 2 KB are compressed or moved to a TOAST table, so wide columns do not bloat the main heap.',
   'ctid = (page number, line pointer). Indexes store ctids that point at heap tuples.']);
  init();draw();
  w.addEventListener('click',e=>{const r=e.target.closest('tr[data-i]');if(r){sel=+r.dataset.i;draw();return}
    const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='ins')ins(60+Math.floor(Math.random()*120));
    if(a==='big')ins(5000,false,'blob');
    if(a==='upd'||a==='del'){const t=S.slots[sel];if(!t||!live(t)){S.log.unshift('Select a live row first.')}else{
      const id=++S.tx;t.xmax=id;if(a==='upd'){const n=ins(t.toast?5000:t.sz,true,t.name);
        if(n){n.xmin=id;S.log.unshift(`UPDATE: old version (0,${sel+1}) gets xmax=${id}; new version written at (0,${S.slots.indexOf(n)+1}).`)}else{t.xmax=0;S.log.unshift('No room for the new version: the update would go to another page.')}}
      else S.log.unshift(`DELETE: (0,${sel+1}) gets xmax=${id}. The bytes stay on the page.`)}}
    if(a==='vac'){let n=0,b=0;S.slots=S.slots.map(t=>{if(t&&!live(t)){n++;b+=t.sz;return null}return t});
      while(S.slots.length&&S.slots[S.slots.length-1]===null)S.slots.pop();
      S.log.unshift(`VACUUM: removed ${n} dead versions, reclaimed ${b} B, line pointers marked reusable.`);sel=null}
    if(a==='reset'){init()}
    draw()});
  $('#ar',w).oninput=draw;
}

/* ───────── MVCC ───────── */
function rMvcc(w,m){
  let S;
  const blank=()=>({tx:null,snap:null,auto:false,pending:null,failed:false,out:''});
  function init(iso){S={iso:iso||(S&&S.iso)||'rc',next:100,status:{1:'c'},vers:[{k:'alice',bal:100,xmin:1,xmax:0},{k:'bob',bal:50,xmin:1,xmax:0}],ss:{A:blank(),B:blank()},log:[]}}
  const L=t=>{S.log.unshift(t)};
  const fresh=()=>new Set(Object.keys(S.status).filter(k=>S.status[k]==='c').map(Number));
  const snapOf=s=>S.iso==='rc'?fresh():(s.snap=s.snap||fresh());
  const vis=(v,me,sn)=>(v.xmin===me||sn.has(v.xmin))&&!(v.xmax&&(v.xmax===me||sn.has(v.xmax)));
  function ensure(s,n){if(s.failed){L(`${n}: ERROR current transaction is aborted. Press ROLLBACK.`);return false}
    if(!s.tx){s.tx=++S.next;S.status[s.tx]='p';s.auto=true}return true}
  const done=(s,n)=>{if(s.auto&&s.tx&&!s.pending)commit(n)};
  function begin(n){const s=S.ss[n];if(s.tx){L(`${n}: already in a transaction.`);return}s.tx=++S.next;S.status[s.tx]='p';s.auto=false;s.snap=null;L(`${n}: BEGIN (txid ${s.tx}, ${S.iso==='rc'?'Read Committed':'Repeatable Read'}).`)}
  function sel(n){const s=S.ss[n];if(s.pending){L(`${n}: waiting on a lock.`);return}if(!ensure(s,n))return;const sn=snapOf(s);
    const rows=S.vers.filter(v=>vis(v,s.tx,sn));s.out=rows.map(v=>`${v.k.padEnd(6)} ${v.bal}`).join('\n');L(`${n}: SELECT → alice=${(rows.find(v=>v.k==='alice')||{}).bal}.`);done(s,n)}
  function upd(n){const s=S.ss[n];if(s.pending){L(`${n}: still waiting.`);return}if(!ensure(s,n))return;const sn=snapOf(s);
    const v=S.vers.find(x=>x.k==='alice'&&vis(x,s.tx,sn));if(!v){L(`${n}: row not visible.`);done(s,n);return}
    if(v.xmax&&v.xmax!==s.tx&&S.status[v.xmax]==='p'){s.pending=v.xmax;L(`${n}: UPDATE blocked. Row is locked by txid ${v.xmax}. Waiting…`);return}
    if(v.xmax&&v.xmax!==s.tx&&S.status[v.xmax]==='c'){S.status[s.tx]='a';s.failed=true;s.pending=null;L(`${n}: ERROR could not serialize access due to concurrent update.`);return}
    v.xmax=s.tx;S.vers.push({k:'alice',bal:v.bal+10,xmin:s.tx,xmax:0});L(`${n}: UPDATE alice SET bal = bal + 10 → ${v.bal+10} (new version, txid ${s.tx}).`);done(s,n)}
  function commit(n){const s=S.ss[n];if(!s.tx){L(`${n}: no transaction.`);return}
    if(s.failed){S.status[s.tx]='a';L(`${n}: ROLLBACK (transaction had failed).`)}else{S.status[s.tx]='c';L(`${n}: COMMIT txid ${s.tx}.`)}
    S.ss[n]=Object.assign(blank(),{out:s.out});resolve()}
  function rollback(n){const s=S.ss[n];if(!s.tx){L(`${n}: no transaction.`);return}S.status[s.tx]='a';L(`${n}: ROLLBACK txid ${s.tx}. Its row versions become invisible.`);S.ss[n]=Object.assign(blank(),{out:s.out});resolve()}
  function resolve(){['A','B'].forEach(n=>{const s=S.ss[n];if(s.pending&&S.status[s.pending]!=='p'){s.pending=null;L(`${n}: lock released, retrying UPDATE.`);upd(n)}})}
  const ACT={begin,sel,upd,commit,rollback};
  const SC={nr:{t:'Non-repeatable read',iso:'rc',st:[['A','begin'],['A','sel'],['B','upd'],['A','sel'],['A','commit']]},
    rr:{t:'Snapshot stays stable',iso:'rr',st:[['A','begin'],['A','sel'],['B','upd'],['A','sel'],['A','commit'],['A','sel']]},
    lk:{t:'Writers wait for writers',iso:'rc',st:[['A','begin'],['A','upd'],['B','begin'],['B','upd'],['A','commit'],['B','commit']]},
    ser:{t:'Concurrent update error',iso:'rr',st:[['A','begin'],['A','sel'],['B','begin'],['B','upd'],['A','upd'],['B','commit'],['A','rollback']]},
    dirty:{t:'No dirty reads',iso:'rc',st:[['A','begin'],['A','upd'],['B','sel'],['A','rollback'],['B','sel']]}};
  let timers=[];onLeave(()=>timers.forEach(clearTimeout));
  w.innerHTML=P(m,`<div class="panel row" style="justify-content:space-between"><label class="f">Isolation level<select id="iso"><option value="rc">Read Committed (default)</option><option value="rr">Repeatable Read</option></select></label>
    <div class="row"><span style="color:var(--muted);font-size:13px">Guided scenarios:</span>${Object.entries(SC).map(([k,v])=>`<button class="btn sm" data-sc="${k}">${v.t}</button>`).join('')}<button class="btn sm" data-sc="reset">Reset</button></div></div>
   <div class="cols">${['A','B'].map(n=>`<div class="sess"><h3>Session ${n} <span class="tag" id="st${n}"></span></h3>
     <div class="row"><button class="btn sm" data-s="${n}" data-a="begin">BEGIN</button><button class="btn sm" data-s="${n}" data-a="sel">SELECT</button><button class="btn sm" data-s="${n}" data-a="upd">UPDATE alice +10</button><button class="btn sm primary" data-s="${n}" data-a="commit">COMMIT</button><button class="btn sm" data-s="${n}" data-a="rollback">ROLLBACK</button></div>
     <div class="out" id="o${n}"></div></div>`).join('')}</div>
   <div class="note">Without BEGIN, a statement is its own transaction (autocommit). The table below is the physical heap: every version of every row, with the txids that created (xmin) and ended (xmax) it.</div>
   <div class="cols"><div class="panel"><h3>Row versions on disk</h3><div class="tw"><table class="t"><thead><tr><th>row</th><th>bal</th><th>xmin</th><th>xmax</th><th>A would see</th><th>B would see</th></tr></thead><tbody id="vt"></tbody></table></div></div>
   <div class="panel"><h3>Event log</h3><div class="log" id="lg" style="max-height:220px"></div></div></div>`,
  ['Readers never block writers and writers never block readers: each statement or transaction reads from a snapshot of committed data.',
   'Read Committed takes a fresh snapshot per statement, so repeated reads can change. Repeatable Read keeps one snapshot for the whole transaction.',
   'Two writers on the same row do conflict: the second waits. Under Repeatable Read it then fails with a serialization error and must retry.',
   'Postgres has no true "Read Uncommitted": asking for it gives Read Committed. Serializable adds predicate tracking to prevent write skew.']);
  function draw(){
    const st=(n)=>{const s=S.ss[n];return s.failed?['aborted','bad']:s.pending?[`blocked by ${s.pending}`,'warn']:s.tx?[`in txn ${s.tx}`,'acc']:['idle','']};
    ['A','B'].forEach(n=>{const [t,c]=st(n);const e=$('#st'+n,w);e.textContent=t;e.className='tag '+c;$('#o'+n,w).textContent=S.ss[n].out||'(no result yet)'});
    const stat=x=>x?`<span class="tag ${S.status[x]==='c'?'good':S.status[x]==='a'?'bad':'warn'}">${x} ${S.status[x]==='c'?'committed':S.status[x]==='a'?'aborted':'in progress'}</span>`:'—';
    const seen=n=>{const s=S.ss[n];const sn=S.iso==='rr'&&s.snap?s.snap:fresh();return v=>vis(v,s.tx||-1,sn)?'<span class="tag good">visible</span>':'<span class="tag">hidden</span>'};
    const a=seen('A'),b=seen('B');
