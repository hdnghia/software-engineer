<title>Pattern Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar, left index of 23 patterns grouped by family, main column = intent -> live demo + roles -> guidance -> code. */
:root{
  --bg:#F2F5F7; --surface:#FFFFFF; --ink:#13202B; --mute:#576876; --line:#D8E0E6; --soft:#E8EEF2;
  --cre:#B26B00; --str:#0A7873; --beh:#C1411A;
  --c:var(--str); --ok:#1B7F4B; --bad:#B42318;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1317; --surface:#141C22; --ink:#E5ECF1; --mute:#92A3B1; --line:#26333D; --soft:#1B262E;
  --cre:#E8A93C; --str:#42C6C0; --beh:#FF8C5E; --ok:#4CC789; --bad:#FF7A6B; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1317; --surface:#141C22; --ink:#E5ECF1; --mute:#92A3B1; --line:#26333D; --soft:#1B262E;
  --cre:#E8A93C; --str:#42C6C0; --beh:#FF8C5E; --ok:#4CC789; --bad:#FF7A6B; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--c);outline-offset:2px}
.wrap{padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{font:700 20px/1 var(--f-display);letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand small{font:400 12px var(--f-mono);color:var(--mute);margin-left:8px;letter-spacing:0}
.top nav.tabs{margin-left:auto;display:flex;gap:6px}
.tabs a{padding:6px 12px;border-radius:6px;text-decoration:none;color:var(--mute);font-weight:500}
.tabs a[aria-current="page"]{background:var(--soft);color:var(--ink)}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);gap:32px;padding-block:24px 64px}
aside.idx{position:sticky;top:calc(64px + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
aside.idx summary{display:none}
.fam{margin:0 0 18px}
.fam h3{font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px;display:flex;gap:8px;align-items:center}
.fam h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--fc)}
.fam a{display:block;padding:5px 10px;border-radius:6px;color:var(--mute);text-decoration:none;font-size:14px;border-left:2px solid transparent}
.fam a:hover{background:var(--soft);color:var(--ink)}
.fam a[aria-current="page"]{background:var(--soft);color:var(--ink);font-weight:600;border-left-color:var(--fc)}
.cre{--fc:var(--cre)} .str{--fc:var(--str)} .beh{--fc:var(--beh)}
main{min-width:0}
.eyebrow{font:500 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c)}
h1{font:700 clamp(30px,5vw,46px)/1.05 var(--f-display);letter-spacing:-.02em;margin:6px 0 10px;text-wrap:balance}
h2{font:600 13px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin:0 0 10px}
.lead{font-size:18px;max-width:62ch;margin:0 0 24px;text-wrap:pretty}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.stage{border-top:3px solid var(--c)}
.stage .hint{color:var(--mute);font-size:13px;margin:0 0 12px}
.side{display:flex;flex-direction:column;gap:16px}
.roles{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0;font-size:14px}
.roles dt{font:500 12px var(--f-mono);color:var(--mute);padding-top:2px}
.roles dd{margin:0;font-family:var(--f-mono);font-size:13px}
.analogy{font-size:15px;margin:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}
ul.tight{margin:0;padding-left:18px;display:grid;gap:5px}
.codewrap{margin-top:20px}
.codehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
pre.code{margin:0;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:14px;overflow:auto;font:13px/1.55 var(--f-mono);tab-size:2}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.pager a{color:var(--ink);text-decoration:none;padding:10px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:500}
.pager a:hover{border-color:var(--c)}
/* demo controls */
button{cursor:pointer;background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:6px;padding:7px 12px;font-weight:500;font-size:14px}
button:hover{opacity:.88}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.ghost:hover{border-color:var(--c)}
button.on{background:var(--c);border-color:var(--c);color:#fff}
button[disabled]{opacity:.35;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.row label{display:flex;gap:6px;align-items:center;font-size:14px}
input[type=range]{accent-color:var(--c);flex:1;min-width:140px}
input[type=text],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{font:12px var(--f-mono);padding:3px 8px;border-radius:99px;border:1px solid var(--line);background:var(--bg)}
.chip.c{border-color:var(--c);color:var(--c)}
.log{font:12.5px/1.5 var(--f-mono);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-height:64px;max-height:190px;overflow:auto;color:var(--mute)}
.log .ok{color:var(--ok)} .log .bad{color:var(--bad)} .log .hl{color:var(--ink)}
.box{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--bg);font:13px/1.5 var(--f-mono);overflow:auto;white-space:pre-wrap;min-width:0}
.box.hot{border-color:var(--c);box-shadow:inset 3px 0 0 var(--c)}
.box.err{border-color:var(--bad);color:var(--bad)}
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-bottom:12px}
.node{flex:1 1 90px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:13px;background:var(--bg);transition:.2s}
.node b{display:block;font:600 13px var(--f-mono)}
.node.passed{opacity:.5;text-decoration:line-through}
.node.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.node.cur{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--bg))}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{font:13px var(--f-mono);color:var(--mute);margin:8px 0 0}
.stat b{color:var(--ink)}
.tree{font:13px/1.8 var(--f-mono);margin:0 0 10px;padding:0;list-style:none}
.tree ul{list-style:none;padding-left:18px;margin:0;border-left:1px dashed var(--line)}
.tree .n{cursor:pointer;padding:1px 6px;border-radius:4px}
.tree .n:hover{background:var(--soft)}
.tree .n.sel{background:var(--c);color:#fff}
.cells{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.cell{padding:8px 12px;border:1px solid var(--line);border-radius:6px;font:13px var(--f-mono);background:var(--bg)}
.cell.vis{background:var(--soft);color:var(--mute)} .cell.cur{border-color:var(--c);background:var(--c);color:#fff}
.bar{height:14px;background:var(--soft);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);transition:width .15s}
.snaps{display:grid;gap:6px;margin-top:10px}
.snap{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:12.5px var(--f-mono);background:var(--bg)}
.snap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
canvas{max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
svg text{fill:currentColor}
.preview{display:flex;gap:14px;align-items:center;padding:14px;border:1px dashed var(--line);border-radius:8px;margin-bottom:10px;flex-wrap:wrap}
.pw{display:inline-block;padding:8px 16px;font-size:14px;border:2px solid;font-weight:600}
.pc{display:inline-flex;gap:8px;align-items:center;font-size:14px}
.pc i{width:18px;height:18px;border:2px solid;display:inline-block}
/* overview */
.famhead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin:30px 0 4px}
.famhead h2{margin:0;color:var(--fc)}
.famhead p{margin:0;color:var(--mute)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.pcard{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--fc);border-radius:8px;padding:14px}
.pcard:hover{border-color:var(--fc)}
.pcard b{display:block;font:600 17px var(--f-display);margin-bottom:4px}
.pcard span{color:var(--mute);font-size:14px}
.guide{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:8px}
.guide div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;border-top:3px solid var(--fc)}
.guide b{font:600 12px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--fc)}
.guide p{margin:6px 0 0}
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.qopts button{background:var(--surface);color:var(--ink);border-color:var(--line);text-align:left;padding:12px}
.qopts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,var(--surface))}
.qopts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
@media (max-width:900px){
  .shell{grid-template-columns:1fr;gap:16px}
  aside.idx{position:static;max-height:none}
  aside.idx summary{display:block;cursor:pointer;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  aside.idx .fams{padding-top:12px}
  .grid2,.cols,.guide,.qopts,.two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<header class="top"><div class="wrap">
  <a class="brand" href="#overview">Pattern Atlas<small>23 GoF patterns, hands-on</small></a>
  <nav class="tabs" aria-label="Sections"><a href="#overview" id="t-overview">Map</a><a href="#quiz" id="t-quiz">Quiz</a></nav>
</div></header>
<div class="wrap shell">
  <aside class="idx"><details id="idxd" open><summary>All 23 patterns</summary><div class="fams" id="fams"></div></details></aside>
  <main id="main" aria-live="polite"></main>
</div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function wire(el,map){
  el.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&el.contains(b)&&map[b.dataset.a])map[b.dataset.a](b,e)});
  el.addEventListener('input',e=>{const b=e.target.closest('[data-i]');if(b&&el.contains(b)&&map[b.dataset.i])map[b.dataset.i](b,e)});
}
function logger(el){const pre=$('.log',el);return(m,cls='')=>{const d=document.createElement('div');d.className=cls;d.textContent=m;pre.prepend(d);while(pre.children.length>40)pre.lastChild.remove()}}
const hex=()=>Math.random().toString(16).slice(2,6);

/* ================= DEMOS ================= */
function dSingleton(el){
  el.innerHTML=`<div class="row"><button data-a="get">Config.getInstance()</button><button class="ghost" data-a="new">new Config()</button><button class="ghost" data-a="reset">Reset</button></div><div class="chips"></div><div class="log"></div><p class="stat"></p>`;
  const log=logger(el),chips=$('.chips',el),st=$('.stat',el);let inst=null,calls=0,made=0;
  const upd=()=>st.innerHTML=`getInstance() calls: <b>${calls}</b> · instances created: <b>${made}</b>`;upd();
  wire(el,{
    get(){calls++;if(!inst){inst={id:hex()};made++;log('created Config@'+inst.id,'ok')}else log('returned existing Config@'+inst.id);
      chips.insertAdjacentHTML('beforeend',`<span class="chip c">call ${calls} → Config@${inst.id}</span>`);upd()},
    new(){log('TypeError: Config constructor is private. Use getInstance().','bad')},
    reset(){inst=null;calls=0;made=0;chips.innerHTML='';$('.log',el).innerHTML='';upd()}
  });
}
function dFactoryMethod(el){
  const F={Road:['Truck','drives on a road','by land'],Sea:['Ship','sails a route','by sea'],Air:['Plane','flies a corridor','by air']};
  el.innerHTML=`<div class="row">${Object.keys(F).map(k=>`<button class="ghost" data-a="mk" data-k="${k}">${k}Logistics</button>`).join('')}</div><div class="box" id="o">Pick a creator. Each one decides which Transport class to instantiate.</div>`;
  wire(el,{mk(b){$$('button',el).forEach(x=>x.classList.toggle('on',x===b));const [t,v,w]=F[b.dataset.k];
    $('#o',el).className='box hot';$('#o',el).textContent=`logistics = new ${b.dataset.k}Logistics()\ntransport = logistics.createTransport()  // returns ${t}\nlogistics.planDelivery()  // the shared code calls transport.deliver()\n→ ${t} ${v}, delivering ${w}`}});
}
function dAbstractFactory(el){
  const FAM={Flat:{btn:'border-radius:2px;background:#0A7873;color:#fff;border-color:#0A7873',box:'border-radius:2px;border-color:#0A7873;background:#0A7873'},
    Rounded:{btn:'border-radius:99px;background:#B26B00;color:#fff;border-color:#B26B00',box:'border-radius:50%;border-color:#B26B00;background:#B26B00'},
    Outline:{btn:'border-radius:6px;background:transparent;color:currentColor;border-color:currentColor',box:'border-radius:4px;border-color:currentColor;background:transparent'}};
  el.innerHTML=`<div class="row">${Object.keys(FAM).map(k=>`<button class="ghost" data-a="f" data-k="${k}">${k}Factory</button>`).join('')}</div><div class="preview" id="pv"><span class="pw">Button</span><span class="pc"><i></i>Checkbox</span></div><div class="box" id="o">Client code only knows the GuiFactory interface. Swap the factory and the whole family changes together.</div>`;
  function pick(k){$$('button',el).forEach(x=>x.classList.toggle('on',x.dataset.k===k));const f=FAM[k];
    $('.pw',el).style.cssText=f.btn;$('.pc i',el).style.cssText=f.box;
    $('#o',el).className='box hot';$('#o',el).textContent=`gui = new ${k}Factory()\nbutton = gui.createButton()      // ${k}Button\ncheckbox = gui.createCheckbox()  // ${k}Checkbox\n// both products always match: same family`}
  wire(el,{f(b){pick(b.dataset.k)}});pick('Flat');
}
function dBuilder(el){
  el.innerHTML=`<div class="row"><label>Size <select data-i="u"><option>S</option><option selected>M</option><option>L</option></select></label>
  <label><input type="checkbox" data-i="u" value="cheese" checked> cheese</label><label><input type="checkbox" data-i="u" value="pepperoni"> pepperoni</label>
  <label><input type="checkbox" data-i="u" value="mushrooms"> mushrooms</label><label><input type="checkbox" data-i="u" value="sauce"> extra sauce</label></div>
  <div class="box" id="c"></div><div class="box hot" id="r" style="margin-top:8px"></div>`;
  const u=()=>{const sz=$('select',el).value,on=$$('input:checked',el).map(i=>i.value);
    $('#c',el).textContent='new PizzaBuilder()\n  .size("'+sz+'")'+on.map(o=>'\n  .add("'+o+'")').join('')+'\n  .build()';
    $('#r',el).textContent='Pizza { size: '+sz+', toppings: ['+on.join(', ')+'] }\nsteps run: '+(on.length+2)+' (the same builder can make other pizzas)'};
  wire(el,{u});u();
}
function dPrototype(el){
  el.innerHTML=`<div class="row"><button data-a="deep">Deep clone</button><button class="ghost" data-a="shallow">Shallow clone</button><button class="ghost" data-a="paint">Paint clone's arm gold</button><button class="ghost" data-a="reset">Reset</button></div>
  <div class="two"><div><h2>Original</h2><div class="box" id="o"></div></div><div><h2>Clone</h2><div class="box" id="c">no clone yet</div></div></div><p class="stat" id="s"></p>`;
  let o,c;const J=x=>JSON.stringify(x,null,1);
  const reset=()=>{o={name:'Robot',parts:{arm:'steel'}};c=null;draw()};
  function draw(){$('#o',el).textContent=J(o);$('#c',el).textContent=c?J(c):'no clone yet';$('#s',el).textContent=''}
  wire(el,{deep(){c=structuredClone(o);draw();$('#s',el).textContent='structuredClone(o): nested objects are copied too.'},
    shallow(){c={...o};draw();$('#s',el).textContent='{...o}: c.parts is the SAME object as o.parts.'},
    paint(){if(!c)return;c.parts.arm='gold';draw();const leaked=o.parts.arm==='gold';const s=$('#s',el);s.innerHTML=leaked?'<b style="color:var(--bad)">The original changed too.</b> Shallow copies share nested state.':'<b style="color:var(--ok)">Original is untouched.</b> Deep clone is independent.'},reset});
  reset();
}
function dAdapter(el){
  el.innerHTML=`<div class="row"><label>Sensor reads <input type="range" min="14" max="122" value="68" data-i="u"> <b id="f">68</b>°F</label><label><input type="checkbox" data-i="u" checked> use adapter</label></div>
  <div class="box" id="o"></div><p class="stat">Client expects <b>getCelsius()</b>. Legacy sensor only offers <b>readFahrenheit()</b>.</p>`;
  const u=()=>{const f=+$('input[type=range]',el).value,ad=$('input[type=checkbox]',el).checked;$('#f',el).textContent=f;const b=$('#o',el);
    if(ad){b.className='box hot';b.textContent='client.show(new CelsiusAdapter(legacySensor))\n→ adapter.getCelsius() = (readFahrenheit() - 32) * 5/9\n→ '+((f-32)*5/9).toFixed(1)+' °C'}
    else{b.className='box err';b.textContent='client.show(legacySensor)\nTypeError: legacySensor.getCelsius is not a function'}};
  wire(el,{u});u();
}
function dBridge(el){
  el.innerHTML=`<div class="row"><label>Shape (abstraction) <select data-i="u"><option>Circle</option><option>Square</option><option>Triangle</option></select></label><label>Renderer (implementation) <select data-i="u"><option>Solid</option><option>Outline</option><option>Dotted</option></select></label></div>
  <div class="two"><svg id="sv" viewBox="0 0 120 120" width="120" height="120" style="color:var(--c)"></svg><div class="box" id="o"></div></div>
  <p class="stat">3 shapes + 3 renderers = <b>6 classes</b>. Without a bridge you would write <b>9</b> (and 12 after one more shape).</p>`;
  const u=()=>{const [s,r]=$$('select',el).map(x=>x.value);const st={Solid:'fill="currentColor"',Outline:'fill="none" stroke="currentColor" stroke-width="4"',Dotted:'fill="none" stroke="currentColor" stroke-width="4" stroke-dasharray="2 7" stroke-linecap="round"'}[r];
    const g={Circle:`<circle cx="60" cy="60" r="44" ${st}/>`,Square:`<rect x="16" y="16" width="88" height="88" ${st}/>`,Triangle:`<polygon points="60,14 108,102 12,102" ${st}/>`}[s];
    $('#sv',el).innerHTML=g;$('#o',el).textContent='new '+s+'(new '+r+'Renderer())\n→ '+s.toLowerCase()+'.draw()\n→ this.renderer.render'+s+'(...)'};
  wire(el,{u});u();
}
function dComposite(el){
  const T={n:'root/',kids:[{n:'docs/',kids:[{n:'cv.pdf',s:120},{n:'letter.txt',s:80}]},{n:'photos/',kids:[{n:'a.jpg',s:900},{n:'b.jpg',s:700},{n:'raw/',kids:[{n:'c.raw',s:3000}]}]},{n:'notes.md',s:15}]};
  const size=x=>x.kids?x.kids.reduce((a,k)=>a+size(k),0):x.s;let id=0;const M=new Map();
  const R=x=>{const i=++id;M.set(i,x);return `<li><span class="n" data-a="p" data-id="${i}">${x.kids?'▸ ':''}${x.n}</span>${x.kids?'<ul>'+x.kids.map(R).join('')+'</ul>':''}</li>`};
  el.innerHTML=`<ul class="tree">${R(T)}</ul><div class="box" id="o">Click any file or folder. Same call, same interface: node.size()</div>`;
  wire(el,{p(b){$$('.n',el).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');const x=M.get(+b.dataset.id);const o=$('#o',el);o.className='box hot';
    o.textContent=x.kids?x.n+'.size() = sum of '+x.kids.length+' children = '+size(x)+' KB':x.n+'.size() = '+x.s+' KB  (leaf)'}});
}
function dDecorator(el){
  const A={Milk:.5,Mocha:.7,Whip:.4};let base='Espresso',stack=[];

function dInterpreter(el){
  el.innerHTML=`<div class="row"><input type="text" data-i="u" value="2 + 3 * (4 - 1)" style="flex:1"></div><div class="box hot" id="o"></div><p class="stat">Grammar: expr := term (+|- term)* · term := factor (*|/ factor)* · factor := number | ( expr )</p>`;
  function parse(src){const tk=src.match(/\d+\.?\d*|[()+\-*/]|\S/g)||[];let i=0;
    const num=n=>({t:'Num',ev:()=>n,kids:[],label:String(n)});
    const op=(o,l,r)=>({t:{'+':'Add','-':'Sub','*':'Mul','/':'Div'}[o],kids:[l,r],ev:()=>{const a=l.ev(),b=r.ev();return o=='+'?a+b:o=='-'?a-b:o=='*'?a*b:a/b}});
    function expr(){let l=term();while(tk[i]=='+'||tk[i]=='-'){const o=tk[i++];l=op(o,l,term())}return l}
    function term(){let l=fac();while(tk[i]=='*'||tk[i]=='/'){const o=tk[i++];l=op(o,l,fac())}return l}
    function fac(){const t=tk[i++];if(t=='('){const e=expr();if(tk[i++]!=')')throw Error('missing )');return e}if(/^\d/.test(t))return num(+t);throw Error('unexpected "'+(t??'end')+'"')}
    const r=expr();if(i<tk.length)throw Error('unexpected "'+tk[i]+'"');return r}
  const show=(n,d=0)=>'  '.repeat(d)+n.t+(n.label?'('+n.label+')':'')+'  = '+n.ev()+'\n'+n.kids.map(k=>show(k,d+1)).join('');
  const u=()=>{const o=$('#o',el);try{const t=parse($('input',el).value);o.className='box hot';o.textContent='Syntax tree, each node.interpret():\n'+show(t)}catch(e){o.className='box err';o.textContent='SyntaxError: '+e.message}};
  wire(el,{u});u();
}

const FAMS={cre:['Creational','How objects get made','Hide or customise creation.'],str:['Structural','How objects fit together','Compose classes into larger, flexible structures.'],beh:['Behavioral','How objects talk and share work','Assign responsibility and manage communication.']};

/* ================= QUIZ ================= */
const Q=[['I need exactly one shared logger across the whole app.','singleton'],['Add milk, mocha or whip to a coffee at runtime without a subclass per combination.','decorator'],['Many widgets must refresh whenever the data changes.','observer'],['Let the user switch the sorting algorithm on the fly.','strategy'],['An old API must look like the one my code expects.','adapter'],['Undo and redo for editor actions.','command'],['A folder and a file should answer "how big are you?" the same way.','composite'],['Hide six subsystem calls behind one simple method.','facade'],['Cache a slow-to-load image behind the same interface.','proxy'],['Walk a collection without exposing how it is stored.','iterator'],['Save a checkpoint and roll back to it later.','memento'],['Construct a complex object step by step with optional parts.','builder'],['A document moves through draft, review and published with different allowed actions.','state'],['A request should travel through handlers until one of them deals with it.','chain-of-responsibility'],['Millions of particles share the same texture and mesh, memory is too high.','flyweight'],['Add new export and report operations to a class tree without editing the classes.','visitor'],['UI components must always come from the same matching theme family.','abstract-factory'],['Subclasses choose which product class the shared code instantiates.','factory-method'],['Chat users should never hold references to each other.','mediator'],['Copy an existing configured object rather than building it again.','prototype']];

/* ================= ROUTER ================= */
const main=$('#main');
function buildIndex(){
  $('#fams').innerHTML=Object.keys(FAMS).map(c=>`<div class="fam ${c}"><h3>${FAMS[c][0]}</h3>${P.filter(p=>p.cat==c).map(p=>`<a href="#${p.id}" data-id="${p.id}">${p.name}</a>`).join('')}</div>`).join('');
}
function setActive(h){
  $$('.fam a').forEach(a=>a.dataset.id==h?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current'));
  ['overview','quiz'].forEach(t=>{const a=$('#t-'+t);h==t?a.setAttribute('aria-current','page'):a.removeAttribute('aria-current')});
}
function overview(){
  main.style.removeProperty('--c');
  main.innerHTML=`<div class="eyebrow">Map</div><h1>Learn design patterns by touching them</h1>
  <p class="lead">Patterns are named solutions to problems that keep coming back. Each of the 23 classic Gang of Four patterns has a live demo, a real-world analogy, and short code. Start from the question you are asking.</p>
  <div class="guide">${Object.keys(FAMS).map(c=>`<div class="${c}"><b>${FAMS[c][0]}</b><p><strong>${FAMS[c][1]}.</strong> ${FAMS[c][2]}</p></div>`).join('')}</div>
  ${Object.keys(FAMS).map(c=>`<div class="${c}"><div class="famhead"><h2>${FAMS[c][0]} · ${P.filter(p=>p.cat==c).length}</h2><p>${FAMS[c][1]}</p></div><div class="cards">${P.filter(p=>p.cat==c).map(p=>`<a class="pcard" href="#${p.id}"><b>${p.name}</b><span>${p.tag}</span></a>`).join('')}</div></div>`).join('')}
  <p style="margin-top:32px"><a href="#quiz" style="color:var(--ink);font-weight:600">Done exploring? Test yourself with the quiz →</a></p>`;
}
function pattern(p,i){
  main.style.setProperty('--c',`var(--${p.cat})`);
  const prev=P[i-1],next=P[i+1];
  main.innerHTML=`<div class="eyebrow">${FAMS[p.cat][0]} · ${i+1} of ${P.length}</div><h1>${p.name}</h1><p class="lead">${p.intent}</p>
  <div class="grid2"><section class="card stage"><h2>Try it</h2><p class="hint">${p.tag}</p><div id="demo"></div></section>
  <div class="side"><section class="card"><h2>Think of it as</h2><p class="analogy">${p.analogy}</p></section><section class="card"><h2>Roles</h2><dl class="roles">${p.roles.map(r=>`<dt>${r[0]}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></section></div></div>
  <div class="cols"><section class="card"><h2>Use it when</h2><ul class="tight">${p.use.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="card"><h2>Watch out for</h2><ul class="tight">${p.watch.map(x=>`<li>${x}</li>`).join('')}</ul></section></div>
  <section class="codewrap"><div class="codehead"><h2 style="margin:0">Code</h2><button class="ghost" id="cp">Copy</button></div><pre class="code"></pre></section>
  <div class="pager">${prev?`<a href="#${prev.id}">← ${prev.name}</a>`:'<span></span>'}${next?`<a href="#${next.id}">${next.name} →</a>`:`<a href="#quiz">Take the quiz →</a>`}</div>`;
  $('pre.code',main).textContent=p.code;
  $('#cp').onclick=async()=>{const b=$('#cp');try{await navigator.clipboard.writeText(p.code);b.textContent='Copied'}catch(e){const r=document.createRange();r.selectNodeContents($('pre.code',main));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='Selected'}setTimeout(()=>b.textContent='Copy',1400)};
  p.demo($('#demo'));
}
let qstate;
function quiz(){
  main.style.setProperty('--c','var(--ink)');
  qstate={qs:[...Q].sort(()=>Math.random()-.5).slice(0,10),i:0,score:0};drawQ();
}
function drawQ(){
  const s=qstate;const root=document.createElement('div');main.replaceChildren(root);
  if(s.i>=s.qs.length){root.innerHTML=`<div class="eyebrow">Quiz</div><h1>${s.score} / ${s.qs.length}</h1><p class="lead">${s.score>=9?'You can pick the right pattern from a problem description.':s.score>=6?'Solid. Revisit the ones you missed from the map.':'Open the demos of the patterns you missed, then try again.'}</p><div class="row"><button data-a="again">Try another round</button><a href="#overview" style="color:var(--ink);font-weight:600;padding:8px">Back to the map</a></div>`;wire(root,{again:quiz});return}
  const [q,ans]=s.qs[s.i];
  const opts=[ans,...P.map(p=>p.id).filter(x=>x!=ans).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);
  root.innerHTML=`<div class="eyebrow">Quiz · question ${s.i+1} of ${s.qs.length} · score ${s.score}</div><h1 style="font-size:clamp(22px,3.5vw,32px)">Which pattern fits?</h1><p class="lead">${q}</p>
  <div class="qopts">${opts.map(o=>`<button data-a="pick" data-o="${o}">${P.find(p=>p.id==o).name}</button>`).join('')}</div><div id="fb"></div>`;
  wire(root,{pick(b){if($('#fb').dataset.d)return;$('#fb').dataset.d=1;const ok=b.dataset.o==ans;if(ok)s.score++;
    $$('.qopts button').forEach(x=>{if(x.dataset.o==ans)x.classList.add('right');else if(x==b)x.classList.add('wrong')});
    const p=P.find(x=>x.id==ans);$('#fb').innerHTML=`<p><strong>${ok?'Correct.':'Not quite.'}</strong> ${p.name}: ${p.tag} <a href="#${p.id}" style="color:var(--ink)">See the demo</a></p><button data-a="next">${s.i+1<s.qs.length?'Next question':'See score'}</button>`},
    next(){s.i++;drawQ()}});
}
function route(){
  const h=location.hash.slice(1)||'overview';
  const i=P.findIndex(p=>p.id==h);
  if(h=='quiz')quiz();else if(i>=0)pattern(P[i],i);else overview();
  setActive(i>=0?h:(h=='quiz'?'quiz':'overview'));
  window.scrollTo(0,0);
  if(matchMedia('(max-width:900px)').matches)$('#idxd').open=false;
}
buildIndex();
if(!matchMedia('(max-width:900px)').matches)$('#idxd').open=true;
addEventListener('hashchange',route);route();
</script>
