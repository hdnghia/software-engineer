    table(['Strategy','How keys map','Weak spot'],[['Range','A–F → shard 1, G–M → shard 2','Hot ranges (e.g. recent dates)'],['Hash mod N','hash(key) % N','Changing N moves almost every key'],['Consistent hashing','First node clockwise on a ring','Uneven without virtual nodes'],['Directory','Lookup table key → shard','Table is a dependency; flexible though']]) +
    sec('Pitfalls', keys(['<b>Hot keys</b>: a celebrity’s row gets all the traffic. Split it, cache it, or add a random suffix.','<b>Cross-shard queries</b> and joins become scatter-gather. Choose a shard key that keeps related data together (e.g. <code>user_id</code>).','<b>Cross-shard transactions</b> need 2PC or sagas; see <a href="#transactions">distributed transactions</a>.','<b>Resharding</b> is painful. Start with many logical shards mapped to fewer machines.'])) +
    check('Why do virtual nodes help?', 'Each server appears at many points on the ring, so its share of keys averages out. When a server leaves, its keys spread over many others instead of dumping on one neighbour.'),
  mount(r){
    const names='ABCDEF'; let nodes=['A','B','C'], vn=3;
    const keysA = Array.from({length:80},(_,i)=>{const h=hash32('key-'+i); return {h, a:h/4294967296*360}});
    let prev = null, prevN = null;
    const ring = () => { const pts=[]; nodes.forEach(n=>{ for(let i=0;i<vn;i++){ const h=hash32(n+'#'+i); pts.push({h,n}) } }); return pts.sort((a,b)=>a.h-b.h) };
    const owner = (pts,h) => (pts.find(p=>p.h>=h) || pts[0]).n;
    const col = n => `var(--c${names.indexOf(n)+1})`;
    function draw(){ const pts = ring(), own = keysA.map(k=>owner(pts,k.h)), modN = keysA.map(k=>nodes[k.h%nodes.length]);
      const cx=170, cy=170, R=128, P = (a,rad) => [cx+rad*Math.sin(a*Math.PI/180), cy-rad*Math.cos(a*Math.PI/180)];
      let s = `<svg viewBox="0 0 340 340" role="img" aria-label="Consistent hash ring"><circle cx="${cx}" cy="${cy}" r="${R}" style="fill:none;stroke:var(--line);stroke-width:2"/>`;
      pts.forEach(p => { const a = p.h/4294967296*360, [x1,y1]=P(a,R-12), [x2,y2]=P(a,R+12), [tx,ty]=P(a,R+24); s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${col(p.n)};stroke-width:3"/>`; if(vn<=6) s += `<text x="${tx}" y="${ty+4}" text-anchor="middle" style="fill:${col(p.n)};font:600 11px var(--mono)">${p.n}</text>` });
      keysA.forEach((k,i) => { const [x,y] = P(k.a, R-26 - (i%3)*9), moved = prev && prev[i]!==own[i]; s += `<circle cx="${x}" cy="${y}" r="${moved?5:3.6}" style="fill:${col(own[i])};${moved?'stroke:var(--ink);stroke-width:2':''}"/>` });
      $(r,'#ch-ring').innerHTML = s + `<text x="${cx}" y="${cy+5}" text-anchor="middle" style="fill:var(--muted);font:12px var(--mono)">${nodes.length} nodes · ${pts.length} points</text></svg>`;
      const cnt = nodes.map(n=>own.filter(o=>o===n).length), mx = Math.max(...cnt);
      $(r,'#ch-d').innerHTML = nodes.map((n,i)=>`<div><b style="color:${col(n)}">${n}</b><div class="bar"><i style="width:${cnt[i]/mx*100}%;background:${col(n)}"></i></div><span>${cnt[i]}</span></div>`).join('');
      if(prev){ const m1 = own.filter((o,i)=>o!==prev[i]).length, m2 = modN.filter((o,i)=>o!==prevN[i]).length;
        setT(r,'ch-m',`${m1} / 80 (${Math.round(m1/80*100)}%)`,'ok'); setT(r,'ch-mn',`${m2} / 80 (${Math.round(m2/80*100)}%)`,'bad') }
      return [own, modN] }
    const change = fn => { const [o,m] = draw(); prev = o; prevN = m; fn(); draw() };
    $(r,'#ch-add').onclick = () => { if(nodes.length<6) change(()=>nodes.push(names[nodes.length])) };
    $(r,'#ch-rm').onclick = () => { if(nodes.length>1) change(()=>nodes.pop()) };
    bindRange(r,'ch-v', v => { vn=v; prev=null; setT(r,'ch-m','–'); setT(r,'ch-mn','–'); draw() });
  }});

topic({ id:'caching', group:'Data', title:'Caching', nav:'Caching',
  card:'Strategies, eviction policies, and failure modes.',
  lede:'A cache keeps hot data in memory so most reads skip the database. Two decisions matter: how the cache stays in sync with the source of truth, and what to throw away when it is full.',
  body:()=> lab('Write and read strategies', `<div class="row" style="margin-bottom:10px">${seg('cs-m',[['aside','Cache-aside'],['wt','Write-through'],['wb','Write-back']],'aside','Strategy')}</div><div id="cs-st"></div>`) +
    lab('Eviction: what to forget', `<div class="ctls"><div class="ctl"><span class="sl">Policy</span>${seg('lru-p',[['lru','LRU'],['lfu','LFU'],['fifo','FIFO']],'lru','Policy')}</div>${slider('lru-c','Cache size',2,6,1,3)}</div>
    <div class="keypad" id="lru-k"></div><div class="slots" id="lru-s" aria-live="polite"></div><div class="row"><button class="btn" id="lru-play">Play sample pattern</button><button class="btn" id="lru-reset">Reset</button><span class="mono" id="lru-msg" style="font-size:13px;color:var(--muted)"></span></div>
    ${stats(stat('lru-h','Hits'),stat('lru-m','Misses'),stat('lru-r','Hit ratio'))}`, 'Request keys. Slots are ordered from the next to be kept (left) to the next to be evicted (right).') +
    sec('Things that go wrong', cards([['Stampede','A hot key expires; thousands of requests hit the DB at once.','Fix: lock per key, serve stale while refreshing'],['Penetration','Requests for keys that do not exist always miss.','Fix: cache “not found”, bloom filter'],['Avalanche','Many keys expire at the same moment.','Fix: add random jitter to TTLs'],['Stale data','DB changed but cache still holds the old value.','Fix: delete on write, short TTLs'],['Hot key','One key gets more traffic than a node can serve.','Fix: replicate the key, local in-process cache']])) +
    sec('Where caches live', keys(['Browser → CDN → API gateway → application (in-process) → distributed cache (Redis, Memcached) → database buffer pool.','The closer to the user, the faster, and the harder to invalidate.'])) +
    check('With cache-aside, why delete the cache entry on update instead of writing the new value?', 'Two concurrent writers can race and leave an older value in the cache. Deleting is simpler: the next read reloads the current value from the database.'),
  mount(r, life){
    const spec = {w:520,h:280,minw:440,label:'Application, cache and database',nodes:[{id:'app',x:100,y:140,label:'App'},{id:'cache',x:380,y:55,label:'Cache',sub:'memory'},{id:'db',x:380,y:225,label:'Database',sub:'source of truth'}],edges:[['app','cache'],['app','db'],['cache','db']]};
    const S = {
      aside:[{flow:['app>cache'],cls:{cache:'bad'},sub:{cache:'MISS'},text:'<b>Read:</b> the app asks the cache for <code>user:42</code>. It is not there.'},{flow:['app>db','db>app'],text:'The app reads the row from the database.'},{flow:['app>cache'],sub:{cache:'user:42 · TTL 10m'},text:'The app stores it in the cache with a TTL.'},{flow:['app>cache','cache>app'],cls:{cache:'leader'},sub:{cache:'HIT'},text:'Next read: cache hit, no database work. <b>On write:</b> update the DB, then delete the cache key.'}],
      wt:[{flow:['app>cache'],text:'<b>Write:</b> the app writes to the cache…'},{flow:['cache>db','db>cache'],text:'…which writes to the database before confirming. Both always match.'},{flow:['cache>app'],text:'Confirmed. Reads are always fresh, but every write pays two writes of latency, and rarely-read data fills the cache.'}],
      wb:[{flow:['app>cache','cache>app'],sub:{cache:'dirty: 3 writes'},text:'<b>Write:</b> the cache accepts the write and confirms at once. Very fast.'},{flow:['cache>db'],sub:{cache:'flushing…'},text:'Later, the cache flushes changes to the database in batches.'},{flow:['cache>db:bad'],cls:{cache:'bad'},sub:{cache:'crashed'},text:'Risk: if the cache dies before flushing, those writes are lost. Used for counters, metrics, and where some loss is acceptable.'}]};
    const show = m => stepper($(r,'#cs-st'), spec, S[m], life); bindSeg(r,'cs-m',show); show('aside');
    let pol='lru', cap=3, c=[], t=0, hits=0, miss=0, playT=null;
    $(r,'#lru-k').innerHTML = 'ABCDEFG'.split('').map(k=>`<button class="btn" data-k="${k}">${k}</button>`).join('');
    const order = () => pol==='lru' ? [...c].sort((a,b)=>b.used-a.used) : pol==='fifo' ? [...c].sort((a,b)=>b.ins-a.ins) : [...c].sort((a,b)=>b.n-a.n || b.used-a.used);
    function access(k){ t++; let e = c.find(x=>x.k===k), msg='';
      if(e){ hits++; e.used=t; e.n++; msg=`${k}: hit` }
      else { miss++; if(c.length>=cap){ const v = order().pop(); c = c.filter(x=>x!==v); msg=`${k}: miss, evicted ${v.k}` } else msg=`${k}: miss`; e = {k,used:t,ins:t,n:1}; c.push(e) }
      draw(k, !!msg.includes('hit'), msg) }
    function draw(k, hit, msg){ const o = order();
      $(r,'#lru-s').innerHTML = o.map(x=>`<div class="slot ${x.k===k?(hit?'hit':'new'):''}">${x.k}${pol==='lfu'?`<small>${x.n}</small>`:''}</div>`).join('') + Array.from({length:cap-o.length},()=>'<div class="slot empty">·</div>').join('');
      $(r,'#lru-msg').textContent = msg||''; setT(r,'lru-h',String(hits),'ok'); setT(r,'lru-m',String(miss)); setT(r,'lru-r', hits+miss ? Math.round(hits/(hits+miss)*100)+'%' : '–') }
    const reset = () => { clearInterval(playT); c=[]; t=hits=miss=0; draw() };
    $(r,'#lru-k').onclick = e => { const b = e.target.closest('[data-k]'); if(b) access(b.dataset.k) };
    $(r,'#lru-reset').onclick = reset;
    $(r,'#lru-play').onclick = () => { reset(); const seq = 'ABACADAEABFAGAB'.split(''); let i=0; playT = setInterval(()=>{ if(i>=seq.length) return clearInterval(playT); access(seq[i++]) }, 550) };
    life.add(()=>clearInterval(playT));
    bindSeg(r,'lru-p',v=>{pol=v; reset()}); bindRange(r,'lru-c',v=>{cap=v; reset()},v=>v+' slots');
  }});

topic({ id:'queues', group:'Async & distributed', title:'Message queues and streams', nav:'Queues & streams',
  card:'Decouple services, absorb spikes, process later.',
  lede:'A queue lets a producer hand off work without waiting for it. Consumers process messages at their own pace. When producers outrun consumers, the backlog grows, and that is the number to watch.',
  body:()=> lab('Producer vs consumers', `<div class="ctls">${slider('mq-p','Messages produced',1,60,1,20)}${slider('mq-c','Consumers',1,10,1,3)}${slider('mq-pt','Partitions',1,10,1,4)}${slider('mq-ms','Time to process one message',50,1000,50,200)}</div>
    <canvas class="chart" id="mq-cv" aria-label="Backlog over the last 30 seconds"></canvas><div class="cons" id="mq-cons"></div>
    <div class="row" style="margin-top:10px"><button class="btn" id="mq-spike">Traffic spike ×5 for 5 s</button></div>
    ${stats(stat('mq-cap','Throughput limit'),stat('mq-b','Backlog'),stat('mq-l','Lag (time to drain)'))}`, 'In Kafka-style streams, each partition is read by at most one consumer in a group. Extra consumers sit idle.') +
    table(['','Queue (SQS, RabbitMQ)','Log / stream (Kafka, Kinesis)'],[['Message after read','Deleted once acknowledged','Kept for a retention period'],['Consumers','Compete for messages','Each group reads everything, tracks its offset'],['Ordering','Usually none (FIFO variants exist)','Ordered within a partition'],['Replay','No','Yes, rewind the offset'],['Typical use','Background jobs, task distribution','Event streams, analytics, many subscribers']]) +
    sec('Delivery guarantees', cards([['At most once','Send and forget. May lose messages, never duplicates.','Metrics, logs where loss is fine'],['At least once','Retry until acknowledged. No loss, but duplicates happen.','The common default'],['Exactly once (effectively)','At-least-once plus idempotent consumers or transactions.','Payments, counters']])) +
    tip('Assume at-least-once and make consumers idempotent: store a processed-message ID, or use upserts, so a duplicate does no harm. Send repeatedly failing messages to a dead-letter queue.') +
    check('8 consumers on a topic with 4 partitions. What happens?', '4 consumers get one partition each and 4 sit idle. To scale consumption further, add partitions.'),
  mount(r, life){
    let p=20, cn=3, pt=4, ms=200, backlog=0, spike=0; const hist = Array(300).fill(0); const cv = $(r,'#mq-cv');
    const capf = () => Math.min(cn,pt)*1000/ms;
    function cons(){ $(r,'#mq-cons').innerHTML = Array.from({length:cn},(_,i)=>`<span class="${i>=pt?'idle':''}">consumer ${i+1}${i<pt?' · p'+(i+1):' · idle'}</span>`).join('') }
    bindRange(r,'mq-p',v=>{p=v},v=>v+'/s'); bindRange(r,'mq-c',v=>{cn=v;cons()}); bindRange(r,'mq-pt',v=>{pt=v;cons()}); bindRange(r,'mq-ms',v=>{ms=v},v=>v+' ms');
    $(r,'#mq-spike').onclick = () => { spike = 50 };
    function chart(){ const {c,w,h} = canvasCtx(cv); const mx = Math.max(20, ...hist)*1.15;
      c.clearRect(0,0,w,h); c.strokeStyle = tok('--line'); c.lineWidth = 1; c.font = '11px '+tok('--mono'); c.fillStyle = tok('--muted');
      for(let i=0;i<=3;i++){ const y = 10+(h-30)*i/3; c.beginPath(); c.moveTo(40,y); c.lineTo(w-8,y); c.stroke(); c.fillText(fmt(mx*(1-i/3),0),4,y+4) }
      c.fillText('30 s ago',40,h-6); c.fillText('now',w-34,h-6);
      const X = i => 40+(w-48)*i/(hist.length-1), Y = v => 10+(h-30)*(1-v/mx);
      c.beginPath(); c.moveTo(X(0),Y(0)); hist.forEach((v,i)=>c.lineTo(X(i),Y(v))); c.lineTo(X(hist.length-1),Y(0)); c.closePath();
      c.globalAlpha = .18; c.fillStyle = tok('--accent'); c.fill(); c.globalAlpha = 1;
      c.beginPath(); hist.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v))); c.strokeStyle = tok('--accent'); c.lineWidth = 2; c.stroke();
      const lv = hist[hist.length-1]; c.beginPath(); c.arc(X(hist.length-1),Y(lv),4,0,7); c.fillStyle = tok('--packet'); c.fill() }
    life.every(() => { const inr = p*(spike>0?5:1); if(spike>0) spike--; backlog += inr*0.1; backlog = Math.max(0, backlog - capf()*0.1);
      hist.push(backlog); hist.shift(); chart(); const cp = capf();
      setT(r,'mq-cap',fmt(cp)+'/s', cp>=p?'ok':'bad'); setT(r,'mq-b',fmt(Math.round(backlog)), backlog<cp?'ok':backlog<cp*10?'warn':'bad'); setT(r,'mq-l', backlog<1?'0 s':fmtDur(backlog/cp)) }, 100);
  }});

topic({ id:'consensus', group:'Async & distributed', title:'Consensus and leader election (Raft)', nav:'Consensus (Raft)',
  card:'How a cluster agrees on one leader and one log.',
  lede:'Consensus lets a group of machines agree on a value even when some fail. Raft does it with an elected leader and majority votes. Systems like etcd, Consul and many databases are built on it.',
  body:()=> lab('Elect a leader, commit a write', `<div id="raft"></div>`) +
    sec('Core rules', keys(['<b>Majority (quorum)</b>: a cluster of 2f+1 nodes tolerates f failures. 3 nodes survive 1; 5 survive 2.','<b>Terms</b> number each election. A node with an old term steps down when it sees a newer one, which prevents two active leaders.','<b>Committed</b> means stored on a majority. Committed entries survive any minority failure.','<b>Randomized timeouts</b> make split votes rare.','Odd cluster sizes: 4 nodes tolerate only 1 failure, same as 3.'])) +
    sec('Where you meet it', keys(['Coordination services: etcd (Kubernetes), ZooKeeper, Consul.','Distributed SQL: CockroachDB, TiDB, Spanner (Paxos).','Kafka’s KRaft mode for cluster metadata.','In interviews: leader election for a scheduler, locks, or config. Usually say “use etcd/ZooKeeper” rather than implementing it.'])) +
    check('A 5-node cluster splits 3 | 2. What happens on each side?', 'The side with 3 can elect a leader and commit writes. The side with 2 cannot reach a majority, so it stops accepting writes. That is Raft choosing CP.'),
  mount(r, life){
    const cx=380, cy=170, R=120, P = k => [cx+R*Math.cos((-90+k*72)*Math.PI/180), cy+R*Math.sin((-90+k*72)*Math.PI/180)];
    const nodes = [1,2,3,4,5].map((n,k)=>{ const [x,y]=P(k); return {id:'S'+n,x,y,label:'S'+n,sub:'follower · t1'} });
    nodes.push({id:'cl',x:80,y:170,label:'Client'});
    const ids = ['S1','S2','S3','S4','S5'], edges = []; ids.forEach((a,i)=>ids.slice(i+1).forEach(b=>edges.push([a,b]))); edges.push(['cl','S3']);
    const f = (t,s) => Object.fromEntries(ids.map(i=>[i,s+' · t'+t]));
    stepper($(r,'#raft'), {w:540+160,h:330,minw:600,bw:100,bh:50,label:'Five-node Raft cluster',nodes,edges}, [
      {flow:['S1>S2','S1>S3','S1>S4','S1>S5'], hot:['S1'], cls:{S1:'leader'}, sub:{...f(1,'follower'),S1:'LEADER · t1'}, text:'S1 is leader for term 1. It sends heartbeats so followers know it is alive.'},
      {cls:{S1:'down'}, sub:{...f(1,'waiting…'),S1:'crashed'}, text:'S1 crashes. Heartbeats stop. Each follower waits for its own random election timeout (150–300 ms).'},
      {flow:['S3>S2','S3>S4','S3>S5'], cls:{S1:'down',S3:'cand'}, sub:{...f(1,'follower'),S1:'crashed',S3:'CANDIDATE · t2'}, text:'S3 times out first. It moves to term 2, votes for itself and asks the others for votes.'},
      {flow:['S2>S3','S4>S3'], cls:{S1:'down',S3:'cand'}, sub:{...f(2,'follower'),S1:'crashed',S3:'3 / 5 votes',S2:'voted S3',S4:'voted S3'}, text:'S2 and S4 grant their votes. With its own, S3 has 3 of 5: a majority.'},
      {flow:['S3>S2','S3>S4','S3>S5'], cls:{S1:'down',S3:'leader'}, sub:{...f(2,'follower'),S1:'crashed',S3:'LEADER · t2'}, text:'S3 is the new leader and starts sending heartbeats. Failover took about one timeout.'},
      {flow:['cl>S3'], cls:{S1:'down',S3:'leader'}, sub:{...f(2,'follower'),S1:'crashed',S3:'log: x=5 (pending)'}, text:'A client sends <code>SET x=5</code>. The leader appends it to its log, not yet committed.'},
      {flow:['S3>S2','S3>S4','S3>S5'], cls:{S1:'down',S3:'leader'}, sub:{...f(2,'follower'),S1:'crashed',S3:'replicating…'}, text:'The leader sends the entry to followers (AppendEntries).'},
      {flow:['S2>S3','S4>S3'], cls:{S1:'down',S3:'leader'}, sub:{...f(2,'follower'),S1:'crashed',S2:'x=5 ✓',S4:'x=5 ✓',S3:'committed 3/5'}, text:'S2 and S4 acknowledge. Stored on 3 of 5 nodes, the entry is committed. S5 is slow and will catch up.'},
      {flow:['S3>cl'], cls:{S3:'leader'}, sub:{...f(2,'follower'),S3:'LEADER · t2',S1:'follower · t2'}, text:'The client gets OK. S1 restarts, sees term 2, and rejoins as a follower; the leader brings its log up to date.'}], life);
  }});

topic({ id:'transactions', group:'Async & distributed', title:'Distributed transactions: 2PC and sagas', nav:'2PC & sagas',
  card:'Keep several services consistent without one database.',
  lede:'When one business action touches several databases or services, you need all-or-nothing behaviour across them. Two-phase commit locks everything and decides together; a saga runs local steps and undoes them if something fails.',
  body:()=> lab('Place an order', `<div class="row" style="margin-bottom:10px">${seg('tx-m',[['2pc','Two-phase commit'],['saga','Saga (with failure)']],'2pc','Pattern')}</div><div id="tx-st"></div>`) +
    table(['','Two-phase commit','Saga'],[['Consistency','Atomic, strong','Eventual; temporary partial states are visible'],['Locks','Held across services during the protocol','Only local, short'],['Failure handling','Abort everywhere','Run compensating actions (refund, release)'],['Weak spot','Coordinator failure blocks participants','Compensations must be designed for every step'],['Fits','Few databases you control, short transactions','Microservices, long-running business flows']]) +
    sec('Making sagas reliable', keys(['<b>Choreography</b>: services react to each other’s events. <b>Orchestration</b>: a central workflow tells each service what to do (easier to follow).','<b>Outbox pattern</b>: write the event to an outbox table in the same local transaction as the data change, then publish it. No lost or phantom events.','<b>Idempotent steps</b>: every step and compensation may run twice.','Workflow engines (Temporal, Step Functions) handle retries and state for you.'])) +
    check('Why not just call Payment then Inventory in a row from the Order service?', 'If the process crashes between the calls, you have charged the customer with no reserved stock and no record of what to undo. Sagas persist progress and compensate.'),
  mount(r, life){
    const S2 = {w:600,h:300,minw:500,label:'Two-phase commit',nodes:[{id:'co',x:300,y:55,label:'Coordinator',w:130},{id:'o',x:100,y:240,label:'Orders DB'},{id:'p',x:300,y:240,label:'Payments DB'},{id:'i',x:500,y:240,label:'Inventory DB'}],edges:[['co','o'],['co','p'],['co','i']]};
    const SS = {w:640,h:300,minw:540,label:'Saga',nodes:[{id:'o',x:100,y:60,label:'Order service'},{id:'p',x:320,y:60,label:'Payment service'},{id:'i',x:540,y:60,label:'Inventory service'},{id:'bus',x:320,y:240,label:'Event bus',sub:'Kafka'}],edges:[['o','bus'],['p','bus'],['i','bus']]};
    const steps = {
      '2pc':[{flow:['co>o','co>p','co>i'],sub:{o:'PREPARE?',p:'PREPARE?',i:'PREPARE?'},text:'<b>Phase 1, prepare.</b> The coordinator asks each database whether it can commit. Each writes the change to disk and locks the rows.'},
        {flow:['o>co','p>co','i>co'],sub:{o:'YES (locked)',p:'YES (locked)',i:'YES (locked)'},text:'All three vote yes. One “no” would abort everyone.'},
        {flow:['co>o','co>p','co>i'],cls:{co:'leader'},sub:{co:'decision: COMMIT',o:'commit',p:'commit',i:'commit'},text:'<b>Phase 2, commit.</b> The coordinator logs its decision, then tells everyone to commit.'},
        {flow:['o>co','p>co','i>co'],cls:{o:'leader',p:'leader',i:'leader'},sub:{o:'done',p:'done',i:'done'},text:'Locks are released. Weakness: if the coordinator dies after phase 1, participants wait with locks held.'}],
      saga:[{flow:['o>bus'],sub:{o:'order PENDING'},text:'The Order service saves the order as PENDING and publishes <code>OrderCreated</code>.'},
        {flow:['bus>p','p>bus'],cls:{p:'leader'},sub:{p:'charged $40'},text:'Payment charges the card in its own database and publishes <code>PaymentCharged</code>.'},
        {flow:['bus>i','i>bus:bad'],cls:{p:'leader',i:'bad'},sub:{p:'charged $40',i:'out of stock'},text:'Inventory cannot reserve the item and publishes <code>ReservationFailed</code>.'},
        {flow:['bus>p'],cls:{p:'cand',i:'bad'},sub:{p:'REFUND $40',i:'out of stock'},text:'<b>Compensation:</b> Payment refunds the charge. There is no rollback, only a new action that undoes the effect.'},
        {flow:['bus>o'],cls:{o:'bad'},sub:{o:'order CANCELLED',p:'refunded'},text:'Order marks the order CANCELLED and tells the user. The system is consistent again.'}]};
    const show = m => stepper($(r,'#tx-st'), m==='2pc'?S2:SS, steps[m], life); bindSeg(r,'tx-m',show); show('2pc');
  }});

topic({ id:'ids', group:'Async & distributed', title:'Unique ID generation', nav:'Unique IDs',
  card:'Snowflake IDs: unique, sortable, no coordination.',
  lede:'At scale, a single auto-increment counter becomes a bottleneck. Snowflake-style IDs pack a timestamp, a machine number and a sequence into 64 bits, so every server can mint IDs independently and they still sort by time.',
  body:()=> lab('Snowflake generator', `<div class="ctls">${slider('sf-m','Machine ID',0,1023,1,42)}</div><div class="row"><button class="btn primary" id="sf-g">Generate ID</button><button class="btn" id="sf-b">Generate 4 in the same millisecond</button></div>
    <div class="mono" id="sf-id" style="font-size:22px;margin-top:12px;overflow-wrap:anywhere"></div><div class="bits" id="sf-bits"></div>
    <div class="legend"><span><i style="background:var(--muted)"></i>1 sign bit</span><span><i style="background:var(--accent)"></i>41 bits ms timestamp (~69 years)</span><span><i style="background:var(--warn)"></i>10 bits machine (1,024)</span><span><i style="background:var(--ok)"></i>12 bits sequence (4,096/ms)</span></div>
    <ul class="log" id="sf-log"></ul>`, 'Uses the Twitter epoch (Nov 2010).') +
    table(['Approach','Sortable','Coordination','Notes'],[['DB auto-increment','Yes','Single DB','Simple; bottleneck and SPOF'],['UUID v4','No','None','128 bits, random; poor index locality'],['UUID v7','Yes (ms)','None','128 bits, time-ordered; a modern default'],['Snowflake','Yes','Assign machine IDs once','64 bits, fits a BIGINT'],['Ticket server / ranges','Roughly','Hand out blocks of 1,000','Flickr-style; few calls']]) +
    check('Why do random UUIDs make B-tree inserts slower?', 'New keys land on random pages across the index, causing page splits and cache misses. Time-ordered IDs append at the end, which is cache-friendly.'),
  mount(r){
    const EP = 1288834974657n; let m = 42, lastMs = -1n, seq = 0n; const log = $(r,'#sf-log');
    bindRange(r,'sf-m',v=>{m=v});
    function gen(ms){ ms = ms ?? BigInt(Date.now()); if(ms===lastMs) seq = (seq+1n)&4095n; else { seq=0n; lastMs=ms }
      const ts = ms-EP, id = (ts<<22n)|(BigInt(m)<<12n)|seq, bits = id.toString(2).padStart(64,'0');
      $(r,'#sf-id').textContent = id.toString();
      $(r,'#sf-bits').innerHTML = bits.split('').map((b,i)=>`<span class="${i===0?'b-s':i<42?'b-t':i<52?'b-m':'b-q'}">${b}</span>`).join('');
      log.insertAdjacentHTML('afterbegin',`<li>${id} → ${new Date(Number(ms)).toISOString()} · machine ${m} · seq ${seq}</li>`); while(log.children.length>6) log.lastChild.remove() }
    $(r,'#sf-g').onclick = () => gen(); $(r,'#sf-b').onclick = () => { const ms = BigInt(Date.now()); for(let i=0;i<4;i++) gen(ms) };
    gen();
  }});

topic({ id:'resilience', group:'Reliability', title:'Timeouts, retries and circuit breakers', nav:'Resilience patterns',
  card:'Stop one slow dependency from taking everything down.',
  lede:'In a distributed system, something is always failing. Timeouts bound the wait, retries hide brief glitches, and circuit breakers stop hammering a dependency that is clearly down.',
  body:()=> lab('Circuit breaker', `<div class="ctls">${slider('cb-f','Dependency failure rate',0,100,5,10)}</div><div class="dg-scroll" id="cb-svg"></div><div class="tiles" id="cb-t"></div><div class="legend" style="margin-top:6px"><span><i style="background:var(--ok)"></i>success</span><span><i style="background:var(--bad)"></i>failure (waited for timeout)</span><span><i style="background:var(--muted)"></i>failed fast (breaker open)</span></div><p class="step-text" id="cb-msg"></p>`, 'Five calls per second. Push the failure rate above 50% and watch the breaker trip, wait, then test the water.') +
    lab('Retry storms and jitter', `<div class="row" style="margin-bottom:10px">${seg('rt-m',[['fixed','Fixed 200 ms'],['exp','Exponential'],['jit','Exponential + jitter']],'fixed','Retry strategy')}<button class="btn" id="rt-re">Re-run</button></div><canvas class="chart" id="rt-cv" aria-label="Retry attempts over time"></canvas>${stats(stat('rt-pk','Peak load (per 50 ms)'),stat('rt-tot','Total retries'))}`, '200 clients fail at the same moment and retry up to 4 times. Bars show retries arriving at the server.') +
    sec('Rules that prevent outages', keys(['<b>Always set timeouts</b>, shorter than the caller’s own timeout.','<b>Retry only idempotent operations</b>, or use idempotency keys.','<b>Exponential backoff with jitter</b>: <code>sleep = random(0, base × 2^attempt)</code>.','<b>Retry budgets</b>: cap retries at ~10% of traffic so retries cannot multiply load.','<b>Bulkheads</b>: separate thread or connection pools per dependency so one slow service cannot use them all.','<b>Fallbacks</b>: cached data, defaults, or a degraded feature instead of an error page.'])) +
    check('Service A retries 3 times, calls B which retries 3 times, calls C. C is down. How many calls reach C per user request?', 'Up to 4 × 4 = 16. Retries multiply across layers. Retry at one layer only, or use retry budgets.'),
  mount(r, life){
    $(r,'#cb-svg').innerHTML = `<svg viewBox="0 0 560 220" class="dg" style="min-width:460px" role="img" aria-label="Circuit breaker states"><defs><marker id="cb-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" class="arrowhead"/></marker></defs>
      <path d="M150 50 Q280 0 410 50" style="fill:none;stroke:var(--muted);stroke-width:1.5" marker-end="url(#cb-ar)"/><text x="280" y="22" class="elab" text-anchor="middle">5 of last 10 calls failed</text>
      <path d="M430 85 Q420 150 340 170" style="fill:none;stroke:var(--muted);stroke-width:1.5" marker-end="url(#cb-ar)"/><text x="470" y="150" class="elab" text-anchor="middle">after 4 s</text>
      <path d="M220 170 Q140 150 130 85" style="fill:none;stroke:var(--muted);stroke-width:1.5" marker-end="url(#cb-ar)"/><text x="100" y="150" class="elab" text-anchor="middle">trial succeeds</text>
      <path d="M320 155 Q380 120 405 85" style="fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 3" marker-end="url(#cb-ar)"/><text x="345" y="112" class="elab" text-anchor="middle">trial fails</text>
      <g class="node" id="cb-closed" transform="translate(70,40)"><rect width="120" height="46" rx="23"/><text class="nl" x="60" y="28" text-anchor="middle">Closed</text></g>
      <g class="node" id="cb-open" transform="translate(370,40)"><rect width="120" height="46" rx="23"/><text class="nl" x="60" y="28" text-anchor="middle">Open</text></g>
      <g class="node" id="cb-half" transform="translate(220,150)"><rect width="120" height="46" rx="23"/><text class="nl" x="60" y="28" text-anchor="middle">Half-open</text></g></svg>`;
    let fr=0.1, st='closed', win=[], opened=0; const hist=[];
    const MSG = {closed:'<b>Closed:</b> calls pass through normally. Failures are counted.',open:'<b>Open:</b> calls fail immediately without touching the dependency. It gets time to recover and users get a fast error or fallback.',half:'<b>Half-open:</b> one trial call is let through to test whether the dependency has recovered.'};
    bindRange(r,'cb-f',v=>{fr=v/100},v=>v+'%');
    life.every(() => { const now = performance.now(); let res;
      if(st==='open' && now-opened>=4000) st='half';
      if(st==='open') res='skip';
      else { const ok = Math.random()>=fr; res = ok?'ok':'bad';
        if(st==='half'){ if(ok){ st='closed'; win=[] } else { st='open'; opened=now } }
        else { win.push(ok); if(win.length>10) win.shift(); if(win.filter(x=>!x).length>=5){ st='open'; opened=now } } }
      hist.push(res); if(hist.length>100) hist.shift();
      ['closed','open','half'].forEach(s => { const g = $(r,'#cb-'+s); g.classList.remove('leader','bad','cand'); if(s===st) g.classList.add(s==='closed'?'leader':s==='open'?'bad':'cand') });
      $(r,'#cb-t').innerHTML = hist.map(x=>`<i class="${x}"></i>`).join('');
      $(r,'#cb-msg').innerHTML = MSG[st] + (st==='open' ? ` Trying again in ${Math.max(0,(4000-(now-opened))/1000).toFixed(1)} s.` : '');
    }, 200);
    let mode='fixed'; const cv=$(r,'#rt-cv');
    function run(){ const B = 80, bk = new Array(B).fill(0); let tot=0;
      for(let c=0;c<200;c++){ let t=0; for(let k=0;k<4;k++){ const base=100*Math.pow(2,k); t += mode==='fixed'?200 : mode==='exp'?base : Math.random()*base*2; const b = Math.floor(t/50); if(b<B){ bk[b]++; tot++ } } }
      const {c,w,h} = canvasCtx(cv), mx = Math.max(...bk, 10); c.clearRect(0,0,w,h);
      c.font = '11px '+tok('--mono'); c.fillStyle = tok('--muted'); c.strokeStyle = tok('--line');
      [0,.5,1].forEach(f => { const y = 10+(h-30)*(1-f); c.beginPath(); c.moveTo(36,y); c.lineTo(w-6,y); c.stroke(); c.fillText(Math.round(mx*f),4,y+4) });
      c.fillText('0 s',36,h-6); c.fillText('2 s',36+(w-42)*0.5-8,h-6); c.fillText('4 s',w-26,h-6);
      const bw = (w-42)/B; c.fillStyle = tok(mode==='jit'?'--ok':'--bad');
      bk.forEach((v,i) => { const bh = (h-30)*v/mx; c.fillRect(36+i*bw+1, 10+(h-30)-bh, Math.max(1,bw-2), bh) });
      setT(r,'rt-pk',String(Math.max(...bk)), Math.max(...bk)>60?'bad':'ok'); setT(r,'rt-tot',String(tot)) }
    bindSeg(r,'rt-m',v=>{mode=v; run()}); $(r,'#rt-re').onclick=run; run();
  }});

topic({ id:'observability', group:'Reliability', title:'Observability and SLOs', nav:'Observability & SLOs',
  card:'Metrics, logs, traces; error budgets.',
  lede:'You cannot fix what you cannot see. Metrics tell you something is wrong, traces tell you where, and logs tell you why. SLOs turn “reliable enough” into a number the team can manage against.',
  body:()=> cards([['Metrics','Numbers over time: request rate, error rate, p99 latency, CPU. Cheap to store, great for alerts and dashboards.','Prometheus · Grafana · Datadog'],['Logs','Timestamped events with detail. Use structured JSON with a request ID.','Loki · Elasticsearch · CloudWatch'],['Traces','One request’s path across services, with timing per hop (spans).','OpenTelemetry · Jaeger · Tempo']]) +
    sec('What to measure', table(['Framework','Signals','Use for'],[['Golden signals (Google SRE)','Latency, traffic, errors, saturation','User-facing services'],['RED','Rate, errors, duration','Request-driven microservices'],['USE','Utilization, saturation, errors','Resources: CPU, disks, queues']]) + `<p>Measure latency as percentiles. An average of 50 ms can hide a p99 of 2 seconds that 1 in 100 users feel on every page.</p>`) +
    lab('Error budget calculator', `<div class="ctls"><div class="ctl"><span class="sl">SLO (successful requests)</span>${seg('slo-s',[['99','99%'],['99.5','99.5%'],['99.9','99.9%'],['99.95','99.95%'],['99.99','99.99%']],'99.9','SLO')}</div>${num('slo-r','Requests per 30 days (millions)',500)}${slider('slo-e','Current error rate',0,5,0.05,0.5)}</div>${stats(stat('slo-bm','Budget as downtime'),stat('slo-br','Budget as failed requests'),stat('slo-burn','Burn rate'),stat('slo-ex','Budget runs out in'))}`, 'SLI = what you measure. SLO = the target. SLA = the contract with penalties, set looser than the SLO.') +
    tip('When the error budget is spent, the team slows feature releases and works on reliability. Alert on fast burn rates (e.g. budget gone in 2 days), not on every error.') +
    check('What does a burn rate of 10 mean for a 30-day SLO?', 'You are using error budget 10× faster than allowed. The whole monthly budget will be gone in 3 days.'),
  mount(r){
    let s=99.9, e=0.5;
    function calc(){ const b = 1-s/100, req = (+$(r,'#slo-r').value||0)*1e6, burn = (e/100)/b;
      setT(r,'slo-bm',fmtDur(b*30*86400)); setT(r,'slo-br',fmt(b*req)); setT(r,'slo-burn',burn.toFixed(1)+'×', burn<=1?'ok':burn<5?'warn':'bad');
      setT(r,'slo-ex', e===0 ? 'never' : burn<=1 ? 'not this month' : fmtDur(30*86400/burn), burn<=1?'ok':'bad') }
    bindSeg(r,'slo-s',v=>{s=+v; calc()}); $(r,'#slo-r').addEventListener('input',calc); bindRange(r,'slo-e',v=>{e=v; calc()},v=>v.toFixed(2)+'%');
  }});

topic({ id:'architecture', group:'Reliability', title:'Monoliths, microservices and patterns', nav:'Architecture styles',
  card:'When to split services, and the patterns that come with it.',
  lede:'Microservices let many teams ship independently, at the cost of network calls, distributed data and more operations work. Most products should start as a well-structured monolith.',
  body:()=> lab('Which style fits?', `<div class="ctls"><div class="ctl"><span class="sl">Engineers</span>${seg('ar-t',[['s','< 15'],['m','15–80'],['l','80+']],'s','Team size')}</div><div class="ctl"><span class="sl">Domain</span>${seg('ar-d',[['new','Still changing'],['known','Well understood']],'new','Domain')}</div></div><div class="nbox" id="ar-o"></div>`) +
    table(['','Monolith','Modular monolith','Microservices'],[['Deploy','One unit','One unit, strict module boundaries','Each service on its own'],['Data','One database','One DB, schema per module','Database per service'],['Calls between parts','Function calls','Function calls via interfaces','Network (HTTP, gRPC, events)'],['Ops cost','Low','Low','High: discovery, tracing, CI per service'],['Scales teams','Poorly past ~20 engineers','Reasonably','Well']]) +
    sec('Patterns you will mention', cards([['API gateway','One entry point: auth, rate limits, routing, aggregation.'],['Service discovery','Services find each other by name (DNS, Consul, Kubernetes).'],['Service mesh','Sidecars handle mTLS, retries and metrics without app code.'],['Backend for frontend','A small API per client type (web, mobile).'],['Event-driven','Services publish events; others react. Loose coupling.'],['CQRS','Separate models for writes and reads; read side is denormalized.'],['Event sourcing','Store every change as an event; current state is a replay.'],['Strangler fig','Replace a legacy system route by route behind a proxy.']])) +
    check('What is a "distributed monolith"?', 'Services that must be deployed together and call each other synchronously for every request. You pay all the costs of microservices with none of the independence.'),
  mount(r){
    let t='s', d='new';
    const draw = () => { let txt;
      if(t==='s') txt = '<b>Monolith (modular).</b> One deployable, clear module boundaries. You move fastest, and can extract services later along proven seams.';
      else if(t==='m') txt = d==='new' ? '<b>Modular monolith.</b> Enforce module boundaries and separate schemas first. Extract a service only where a team or scaling need is clear.' : '<b>A few services.</b> Split along stable domain boundaries (billing, search, notifications), each owned by one team.';
      else txt = d==='new' ? '<b>Careful microservices.</b> Many teams need independence, but unclear boundaries cause chatty services. Invest in domain modelling first.' : '<b>Microservices.</b> Database per service, async events between them, platform team for gateway, mesh and observability.';
      $(r,'#ar-o').innerHTML = txt };
    bindSeg(r,'ar-t',v=>{t=v;draw()}); bindSeg(r,'ar-d',v=>{d=v;draw()}); draw();
  }});

topic({ id:'url-shortener', group:'Case studies', title:'Design a URL shortener', nav:'URL shortener',
  card:'IDs, base62, read-heavy caching, redirects.',
  lede:'Turn a long URL into a short code like <code>sho.rt/2TX</code> and redirect anyone who opens it. It is a small problem that exercises IDs, storage, caching and heavy read traffic.',
  body:()=> sec('Requirements and estimates', keys(['Create a short link; redirect on open; optional custom alias and expiry.','100M new links/day → ~1,200 writes/s. Reads 100× more → ~120K redirects/s at peak.','Each row ~500 bytes → 50 GB/day, ~90 TB over 5 years.','Redirects must be fast (p99 < 20 ms) and highly available.'])) +
    lab('Short codes with base62', `<div class="ctls">${num('u-id','Numeric ID from the ID generator',11157,1)}${slider('u-len','Code length',4,9,1,7)}</div>${stats(stat('u-code','Short code'),stat('u-cap','Possible codes'),stat('u-yr','Lasts at 100M/day'))}<div class="formula" id="u-f"></div>`, 'Characters 0–9, a–z, A–Z: 62 options per position.') +
    lab('Create and open a link', `<div class="row" style="margin-bottom:10px">${seg('u-m',[['w','Create'],['r','Redirect']],'w','Path')}</div><div id="u-st"></div>`) +
    sec('Design decisions', keys(['<b>Code generation</b>: a counter or Snowflake ID encoded in base62 never collides. Hashing the URL (MD5 → first 7 chars) needs collision checks.','<b>Storage</b>: a key-value store (DynamoDB, Cassandra) fits perfectly: one lookup by key.','<b>Cache</b> the hottest links in Redis; a small share of links gets most clicks.','<b>301 vs 302</b>: 301 is cached by browsers (less load, no click analytics); 302 hits you every time (analytics works).','Sequential codes are guessable. Shuffle the ID bits or add a random component if that matters.'])) +
    check('Why not generate a random 7-character code and check if it exists?', 'It works at small scale, but each create needs a read before write, and collisions grow as the space fills. A unique ID encoded in base62 needs no check.'),
  mount(r, life){
    let len=7; function calc(){ let id; try{ id = BigInt(Math.max(0,Math.floor(+$(r,'#u-id').value||0))) }catch(e){ id=0n }
      const code = base62(id), capN = Math.pow(62,len), yrs = capN/(1e8*365);
      setT(r,'u-code',code); setT(r,'u-cap',fmt(capN)); setT(r,'u-yr', yrs>1000?'> 1,000 years':yrs<1?Math.round(yrs*365)+' days':Math.round(yrs).toLocaleString()+' years', yrs>=10?'ok':'bad');
      const digits=[]; let n=id; if(n===0n) digits.push(0); while(n>0n){ digits.unshift(Number(n%62n)); n/=62n }
      $(r,'#u-f').textContent = `${id} in base 62 = [${digits.join(', ')}] → "${code}"` }
    $(r,'#u-id').addEventListener('input',calc); bindRange(r,'u-len',v=>{len=v;calc()},v=>v+' chars');
    const spec = {w:620,h:300,minw:520,label:'URL shortener',nodes:[{id:'c',x:70,y:150,label:'Client'},{id:'api',x:250,y:150,label:'Shortener API',w:130},{id:'id',x:500,y:50,label:'ID generator',sub:'Snowflake'},{id:'db',x:500,y:150,label:'Link store',sub:'code → URL'},{id:'ca',x:500,y:250,label:'Cache',sub:'Redis'}],edges:[['c','api'],['api','id'],['api','db'],['api','ca']]};
    const W = [{flow:['c>api'],text:'<code>POST /links {url: "https://example.com/very/long/path"}</code>'},{flow:['api>id','id>api'],sub:{id:'→ 11157'},text:'The API gets a unique number from the ID generator.'},{flow:['api>db'],sub:{db:'2TX → https://…'},text:'It encodes 11157 as <code>2TX</code> and stores the mapping.'},{flow:['api>c'],text:'Returns <code>https://sho.rt/2TX</code>.'}];
    const R = [{flow:['c>api'],text:'Someone opens <code>sho.rt/2TX</code>.'},{flow:['api>ca','ca>api'],cls:{ca:'leader'},sub:{ca:'HIT 2TX'},text:'The API checks the cache. Popular links are almost always there.'},{flow:['api>db','db>api'],sub:{db:'lookup 2TX'},text:'On a miss, one key lookup in the store, then the cache is filled.'},{flow:['api>c'],text:'<code>302 Location: https://example.com/very/long/path</code>. Click events go to a queue for analytics.'}];
    const show = m => stepper($(r,'#u-st'), spec, m==='w'?W:R, life); bindSeg(r,'u-m',show); show('w'); calc();
  }});

topic({ id:'chat', group:'Case studies', title:'Design a chat system', nav:'Chat system',
  card:'WebSockets, presence, ordering, offline delivery.',
  lede:'A chat system keeps millions of connections open, delivers each message once and in order, and still works when the recipient is offline.',

    sec('Key decisions', keys(['<b>Connections</b>: WebSockets through stateless gateway servers. A presence service maps user → gateway.','<b>Ordering</b>: a sequence number per conversation, assigned by the chat service (or the partition leader). Clients sort by it.','<b>Storage</b>: write-heavy, read by conversation and time. Wide-column stores like Cassandra fit: partition key <code>conversation_id</code>, clustering by sequence.','<b>Delivery</b>: at-least-once with a client-generated message ID for deduplication.','<b>Offline users</b>: push notification; on reconnect the client syncs everything after its last seen sequence.','<b>Group chat</b>: fan out to members; for very large groups, members pull instead.'])) +
    check('Bob has the app open on a phone and a laptop. How do both get the message?', 'Presence stores a list of connections per user. The chat service delivers to every gateway that holds one of Bob’s connections; each device tracks its own last-seen sequence.'),
  mount(r, life){
    stepper($(r,'#ch-st'), {w:700,h:330,minw:600,label:'Chat message flow',nodes:[{id:'a',x:70,y:80,label:'Alice'},{id:'g1',x:240,y:80,label:'Gateway 1',sub:'WebSocket'},{id:'cs',x:430,y:165,label:'Chat service'},{id:'st',x:620,y:80,label:'Message store',sub:'Cassandra',w:130},{id:'pr',x:620,y:250,label:'Presence',sub:'Redis'},{id:'g2',x:240,y:250,label:'Gateway 2',sub:'WebSocket'},{id:'b',x:70,y:250,label:'Bob'}],
      edges:[['a','g1'],['g1','cs'],['cs','st'],['cs','pr'],['cs','g2'],['g2','b']]}, [
      {flow:['a>g1'],text:'Alice sends “hi” over her open WebSocket, with a client message ID for deduplication.'},
      {flow:['g1>cs'],text:'The gateway forwards it to the chat service.'},
      {flow:['cs>st'],sub:{st:'conv 77 · seq 1042'},text:'The chat service assigns sequence 1042 in this conversation and stores the message durably.'},
      {flow:['cs>g1','g1>a'],sub:{a:'✓ sent'},text:'Alice gets an ack and sees one tick.'},
      {flow:['cs>pr','pr>cs'],sub:{pr:'Bob → gateway 2'},text:'The service asks Presence where Bob is connected.'},
      {flow:['cs>g2','g2>b'],sub:{b:'hi (1042)'},text:'The message is pushed down Bob’s connection.'},
      {flow:['b>g2','g2>cs','cs>g1','g1>a'],sub:{a:'✓✓ delivered'},text:'Bob’s app sends a delivery receipt, which flows back to Alice. If Bob had been offline, a push notification goes out and his app syncs from seq 1041 when it reconnects.'}], life);
  }});

topic({ id:'newsfeed', group:'Case studies', title:'Design a news feed', nav:'News feed',
  card:'Fan-out on write vs read, and the celebrity problem.',
  lede:'A feed shows recent posts from everyone you follow. You can build each feed when someone posts (push) or when someone opens the app (pull). Real systems mix both.',
  body:()=> lab('Who pays the cost?', `<div class="ctls">${slider('nf-f','Followers of the poster',1,8,0.1,3)}${slider('nf-t','Push only below',3,7,0.5,5)}</div>${stats(stat('nf-w','Feed writes per post'),stat('nf-tm','Time to deliver (at 1M writes/s)'),stat('nf-d','Strategy for this user'))}<div class="formula" id="nf-x"></div>`, 'Push writes the post ID into every follower’s cached feed. Pull merges followed accounts’ recent posts at read time.') +
    table(['','Fan-out on write (push)','Fan-out on read (pull)'],[['Work happens','When someone posts','When someone opens the feed'],['Feed load','Very fast: read a precomputed list','Slower: query and merge many sources'],['Problem','Celebrities: one post → millions of writes','Every read is expensive; hard to rank'],['Wasted work','Feeds built for inactive users','None']]) +
    sec('The hybrid design', keys(['Normal users: push post IDs into followers’ feed caches (Redis lists, capped at ~800 items).','Celebrities (above a follower threshold): skip fan-out; merge their recent posts in at read time.','Store post IDs in feeds, not full posts; hydrate content from a post cache.','Ranking happens on read over a few hundred candidates.','Skip fan-out to users who have not logged in for weeks.'])) +
    check('Why store only post IDs in each feed?', 'Posts can be edited or deleted, and copying full content to millions of feeds wastes memory. IDs are 8 bytes; content is fetched once from a shared cache.'),
  mount(r){
    let f=3, th=5; function calc(){ const F = Math.round(Math.pow(10,f)), T = Math.pow(10,th), push = F < T;
      setT(r,'nf-w', push?fmt(F):'0 (skipped)', push?(F>1e5?'warn':'ok'):'ok'); setT(r,'nf-tm', push?fmtDur(Math.max(F/1e6,0.001)):'instant');
      setT(r,'nf-d', push?'Push (fan-out on write)':'Pull (merge on read)', push?'':'warn');
      $(r,'#nf-x').textContent = push ? `${fmt(F)} followers < ${fmt(T)} threshold → write the post ID into ${fmt(F)} feed caches` : `${fmt(F)} followers ≥ ${fmt(T)} → followers fetch this account’s recent posts when they load their feed` }
    bindRange(r,'nf-f',v=>{f=v;calc()},v=>fmt(Math.round(Math.pow(10,v)))); bindRange(r,'nf-t',v=>{th=v;calc()},v=>fmt(Math.pow(10,v))+' followers');
  }});

const QZ = [
  ['N = 3 replicas. Which setting guarantees reads see the latest write?',['W=1, R=1','W=2, R=2','W=1, R=2','W=2, R=1'],1,'R + W must exceed N: 2 + 2 = 4 > 3.','consistency'],
  ['A celebrity with 50M followers posts. Best feed strategy for that post?',['Fan-out on write to all followers','Merge it in at read time (pull)','Email every follower','Store it in each follower’s SQL row'],1,'Pushing to 50M feeds is slow and wasteful; the hybrid model pulls celebrity posts at read time.','newsfeed'],
  ['With consistent hashing, adding a 5th node to 4 moves roughly what share of keys?',['100%','80%','20%','0%'],2,'About 1/5 of keys move to the new node. With hash mod N, about 80% would move.','sharding'],
  ['Which is NOT a reason to put a queue between two services?',['Absorb traffic spikes','Let the consumer fail without losing work','Get a synchronous answer faster','Decouple deploys and scaling'],2,'A queue makes work asynchronous. It does not make the caller’s answer faster.','queues'],
  ['During a network partition, an AP system will…',['Reject all writes','Keep answering, possibly with stale data','Elect two leaders and stop','Lose all data'],1,'AP chooses availability: both sides keep serving and reconcile after the partition heals.','cap'],
  ['99.9% availability allows about how much downtime per month?',['4 minutes','43 minutes','7 hours','3 days'],1,'0.1% of 30 days ≈ 43 minutes.','availability'],
  ['Two components in series, each 99.9% available. Overall?',['99.99%','99.9%','99.8%','99%'],2,'0.999 × 0.999 ≈ 0.998.','availability'],
  ['Token bucket of 10, refill 1/s, idle for a minute, then 15 requests arrive at once. How many pass?',['15','10','60','1'],1,'The bucket holds at most 10 tokens.','ratelimit'],
  ['In cache-aside, who loads data into the cache on a miss?',['The database','The cache itself','The application','The CDN'],2,'The app reads the database and writes the result into the cache.','caching'],
  ['A circuit breaker is open. A new call arrives. What happens?',['It waits for the timeout','It fails fast without calling the dependency','It is retried 3 times','It goes to a random server'],1,'Open means short-circuit: fail immediately and give the dependency time to recover.','resilience'],
  ['Why add random jitter to retry delays?',['To make retries slower for everyone','To spread retries so they do not arrive in synchronized spikes','To encrypt requests','To skip timeouts'],1,'Without jitter, clients that failed together retry together.','resilience'],
  ['10M daily users × 10 requests/day is roughly how many requests per second?',['~120','~1,200','~12,000','~120,000'],1,'100M ÷ 86,400 ≈ 1,160.','estimation'],
  ['A user updates their profile, refreshes, and sees the old one. Which guarantee is missing?',['Linearizability across regions','Read-your-writes','Durability','Partition tolerance'],1,'The read went to a lagging replica. Route the user’s reads to the leader briefly after a write.','replication'],
  ['A 5-node Raft cluster can survive how many failed nodes?',['1','2','3','4'],1,'A majority (3) must remain: 5 − 3 = 2.','consensus'],
  ['Which ID scheme is time-sortable and needs no central coordinator per ID?',['UUID v4','Snowflake','Single-DB auto-increment','Random 6 characters'],1,'Snowflake packs a timestamp first, plus a machine ID, so servers mint IDs independently.','ids'],
  ['8 consumers in one group read a topic with 4 partitions. What happens?',['All 8 share every partition','4 consumers are idle','Messages are duplicated 2×','Kafka adds partitions automatically'],1,'One partition goes to at most one consumer per group.','queues']];

/* ---------- app shell ---------- */
const learned = new Set(store.get('sda-learned', []));
const main = document.getElementById('main'), navList = document.getElementById('nav-list'), navEl = document.getElementById('nav');
let cleanup = () => {};
function progress(){ const tot = T.length-1, n = [...learned].filter(id=>id!=='map' && T.some(t=>t.id===id)).length;
  document.getElementById('prog-t').textContent = `${n} / ${tot} understood`; document.getElementById('prog-b').style.width = (n/tot*100)+'%' }
function renderNav(filter=''){ const f = filter.toLowerCase(), groups = [...new Set(T.map(t=>t.group))], cur = location.hash.slice(1) || 'map';
  navList.innerHTML = groups.map(g => { const items = T.filter(t=>t.group===g && (!f || (t.title+' '+t.nav+' '+t.card).toLowerCase().includes(f)));
    if(!items.length) return ''; return `<div class="ngroup"><h3>${g}</h3>${items.map(t=>`<a href="#${t.id}" class="${learned.has(t.id)?'done':''}" ${t.id===cur?'aria-current="page"':''}><span class="dot"></span>${t.nav}</a>`).join('')}</div>` }).join('') || '<p style="color:var(--muted);font-size:14px">No topics match.</p>' }
function route(){
  const id = location.hash.slice(1) || 'map', idx = Math.max(0, T.findIndex(t=>t.id===id)), t = T[idx];
  cleanup(); const fns = [];
  const life = { add:f=>fns.push(f), every(fn,ms){ const h=setInterval(fn,ms); fns.push(()=>clearInterval(h)) }, after(fn,ms){ const h=setTimeout(fn,ms); fns.push(()=>clearTimeout(h)) } };
  cleanup = () => fns.forEach(f=>f());
  const prev = T[idx-1], next = T[idx+1], done = learned.has(t.id);
  main.innerHTML = `<article class="topic"><div class="eyebrow mono">${t.group}</div><h1>${t.title}</h1><p class="lede">${t.lede}</p>${t.body()}
    <footer class="tfoot">${t.id!=='map'?`<div><button class="btn ${done?'done':''}" id="learn" aria-pressed="${done}">${done?'✓ Understood':'Mark as understood'}</button></div>`:''}
    <div class="pn">${prev?`<a class="pn-l" href="#${prev.id}"><span>Previous</span>${prev.title}</a>`:''}${next?`<a class="pn-r" href="#${next.id}"><span>Next</span>${next.title}</a>`:''}</div></footer></article>`;
  const lb = document.getElementById('learn');
  if(lb) lb.onclick = () => { learned.has(t.id) ? learned.delete(t.id) : learned.add(t.id); store.set('sda-learned',[...learned]);
    const d = learned.has(t.id); lb.className = 'btn'+(d?' done':''); lb.textContent = d?'✓ Understood':'Mark as understood'; lb.setAttribute('aria-pressed',d); renderNav(document.getElementById('q').value); progress() };
  try { t.mount && t.mount(main, life) } catch(e){ console.error(e) }
  renderNav(document.getElementById('q').value); progress(); closeNav();
  document.title = t.id==='map' ? 'System Design Atlas' : t.nav+' · System Design Atlas';
  window.scrollTo(0,0);
}
const menu = document.getElementById('menu'), scrim = document.getElementById('scrim');
function closeNav(){ navEl.classList.remove('open'); scrim.classList.remove('on'); menu.setAttribute('aria-expanded','false') }
menu.onclick = () => { const o = !navEl.classList.contains('open'); navEl.classList.toggle('open',o); scrim.classList.toggle('on',o); menu.setAttribute('aria-expanded',String(o)) };
scrim.onclick = closeNav;
document.getElementById('q').addEventListener('input', e => renderNav(e.target.value));
window.addEventListener('hashchange', route);
route();
</script>
